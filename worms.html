<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Worms PoC</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    font-family: monospace; color: #ddd; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #wrap { position: relative; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges;
    width: 960px; height: 540px; background: #87ceeb; display: block;
    box-shadow: 0 0 20px #000; cursor: crosshair; }
  #hud { position: absolute; top: 8px; left: 12px; font-size: 12px;
    text-shadow: 1px 1px 0 #000; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="270"></canvas>
  <div id="hud">A/D or ←/→ move • S/↓ duck • W/Space/↑ jump • 1 pistol / 2 MG / 3 bazooka • Left-click shoot • Right-click slow-mo • R regenerate<br><span id="weap"></span></div>
</div>
<script>
(() => {
  const W = 480, H = 270;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // Terrain grid: 1 = solid, 0 = empty
  let grid = new Uint8Array(W * H);
  // Offscreen image for terrain rendering
  const terrainCanvas = document.createElement('canvas');
  terrainCanvas.width = W; terrainCanvas.height = H;
  const tctx = terrainCanvas.getContext('2d');
  const terrainImg = tctx.createImageData(W, H);
  let terrainDirty = true;
  // Offscreen FX canvas — used to mask explosion flashes to terrain shape
  const fxCanvas = document.createElement('canvas');
  fxCanvas.width = W; fxCanvas.height = H;
  const fxctx = fxCanvas.getContext('2d');

  // Colors
  const COL_DIRT     = [120, 72, 40, 255];
  const COL_DIRT2    = [96,  56, 28, 255];
  const COL_GRASS    = [70, 170, 60, 255];
  const COL_GRASS_DK = [40, 110, 40, 255];
  const COL_SKY      = [0, 0, 0, 0]; // transparent so canvas bg shows

  function idx(x, y) { return y * W + x; }
  function inBounds(x, y) { return x >= 0 && x < W && y >= 0 && y < H; }
  function solid(x, y) {
    if (x < 0 || x >= W) return true; // walls
    if (y >= H) return true;          // floor
    if (y < 0) return false;          // sky
    return grid[idx(x, y)] === 1;
  }

  function generateTerrain() {
    grid.fill(0);
    // Stacked sines for rolling hills
    const baseY = H * 0.55;
    const seedA = Math.random() * 1000;
    const seedB = Math.random() * 1000;
    const seedC = Math.random() * 1000;
    for (let x = 0; x < W; x++) {
      const h = baseY
        + Math.sin((x + seedA) * 0.012) * 40
        + Math.sin((x + seedB) * 0.035) * 15
        + Math.sin((x + seedC) * 0.08)  * 6;
      const top = Math.max(20, Math.min(H - 1, Math.floor(h)));
      for (let y = top; y < H; y++) grid[idx(x, y)] = 1;
    }
    // Carve some random caves so destruction has interesting interior
    for (let i = 0; i < 6; i++) {
      const cx = 60 + Math.random() * (W - 120);
      const cy = baseY + 20 + Math.random() * 60;
      const r  = 12 + Math.random() * 20;
      carveCircle(cx, cy, r, false);
    }
    terrainDirty = true;
  }

  function carveCircle(cx, cy, r, runIsolation = true) {
    const r2 = r * r;
    const x0 = Math.max(0, Math.floor(cx - r));
    const x1 = Math.min(W - 1, Math.ceil(cx + r));
    const y0 = Math.max(0, Math.floor(cy - r));
    const y1 = Math.min(H - 1, Math.ceil(cy + r));
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = x - cx, dy = y - cy;
        if (dx*dx + dy*dy <= r2) grid[idx(x, y)] = 0;
      }
    }
    terrainDirty = true;
    if (runIsolation) detachFloatingChunks();
  }

  // Falling chunks: pixels relative to (x,y) origin
  const chunks = [];

  const MAX_CHUNK_PIXELS = 200; // bigger floating slabs stay suspended until chipped smaller

  function detachFloatingChunks() {
    // Flood-fill from bottom row across all solid pixels
    const visited = new Uint8Array(W * H);
    const stack = [];
    for (let x = 0; x < W; x++) {
      const i = idx(x, H - 1);
      if (grid[i] === 1) { visited[i] = 1; stack.push(x, H - 1); }
    }
    while (stack.length) {
      const y = stack.pop();
      const x = stack.pop();
      // 4-neighbour
      if (x > 0) {
        const i = idx(x-1, y);
        if (!visited[i] && grid[i] === 1) { visited[i] = 1; stack.push(x-1, y); }
      }
      if (x < W-1) {
        const i = idx(x+1, y);
        if (!visited[i] && grid[i] === 1) { visited[i] = 1; stack.push(x+1, y); }
      }
      if (y > 0) {
        const i = idx(x, y-1);
        if (!visited[i] && grid[i] === 1) { visited[i] = 1; stack.push(x, y-1); }
      }
      if (y < H-1) {
        const i = idx(x, y+1);
        if (!visited[i] && grid[i] === 1) { visited[i] = 1; stack.push(x, y+1); }
      }
    }
    // Group unvisited solid pixels into connected components
    const claimed = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = idx(x, y);
        if (grid[i] !== 1 || visited[i] || claimed[i]) continue;
        // BFS this component
        const compPixels = [];
        let minX = x, minY = y;
        const st = [x, y];
        claimed[i] = 1;
        while (st.length) {
          const py = st.pop(), px = st.pop();
          compPixels.push(px, py);
          if (px < minX) minX = px;
          if (py < minY) minY = py;
          const neigh = [[px-1,py],[px+1,py],[px,py-1],[px,py+1]];
          for (const [nx, ny] of neigh) {
            if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
            const ni = idx(nx, ny);
            if (grid[ni] === 1 && !visited[ni] && !claimed[ni]) {
              claimed[ni] = 1; st.push(nx, ny);
            }
          }
        }
        const pixelCount = compPixels.length / 2;
        // Too big to fall — leave it floating in the grid until further damage breaks it up
        if (pixelCount > MAX_CHUNK_PIXELS) continue;
        // Near the limit (>50%) — compact to half height on landing
        const heavy = pixelCount > MAX_CHUNK_PIXELS / 2;
        // Convert to chunk
        const pixels = new Int16Array(compPixels.length);
        for (let k = 0; k < compPixels.length; k += 2) {
          const gx = compPixels[k], gy = compPixels[k+1];
          pixels[k]   = gx - minX;
          pixels[k+1] = gy - minY;
          grid[idx(gx, gy)] = 0; // remove from terrain
        }
        chunks.push({ pixels, x: minX, y: minY, vy: 0, heavy });
        terrainDirty = true;
      }
    }
  }

  function chunkCollides(chunk, ox, oy) {
    const p = chunk.pixels;
    for (let k = 0; k < p.length; k += 2) {
      const gx = ox + p[k], gy = oy + p[k+1];
      if (gy >= H) return true;
      if (gx < 0 || gx >= W) return true;
      if (gy >= 0 && grid[idx(gx, gy)] === 1) return true;
    }
    return false;
  }

  function stampChunk(chunk) {
    // For each column of the chunk, preserve its pixel count but re-base it
    // onto the ground directly beneath that column — no air gaps between chunk
    // and existing terrain, no internal gaps within the chunk.
    const p = chunk.pixels;
    const colData = new Map(); // worldX -> { count, maxRelY }
    for (let k = 0; k < p.length; k += 2) {
      const gx = chunk.x + p[k];
      if (gx < 0 || gx >= W) continue;
      const relY = p[k+1];
      const existing = colData.get(gx);
      if (existing) {
        existing.count++;
        if (relY > existing.maxRelY) existing.maxRelY = relY;
      } else {
        colData.set(gx, { count: 1, maxRelY: relY });
      }
    }
    for (const [gx, data] of colData) {
      // Ground top = first solid grid pixel below the chunk's lowest pixel in this column
      const startY = chunk.y + data.maxRelY + 1;
      let groundTop = H;
      for (let y = Math.max(0, startY); y < H; y++) {
        if (grid[idx(gx, y)] === 1) { groundTop = y; break; }
      }
      const stampCount = chunk.heavy ? Math.max(1, Math.floor(data.count * 0.25)) : data.count;
      for (let i = 1; i <= stampCount; i++) {
        const ny = groundTop - i;
        if (ny >= 0 && ny < H) grid[idx(gx, ny)] = 1;
      }
    }
    terrainDirty = true;
  }

  function updateChunks() {
    for (let i = chunks.length - 1; i >= 0; i--) {
      const c = chunks[i];
      c.vy += 0.35;
      if (c.vy > 6) c.vy = 6;
      let remaining = c.vy;
      while (remaining > 0) {
        const step = Math.min(1, remaining);
        if (chunkCollides(c, c.x, c.y + 1)) {
          stampChunk(c);
          chunks.splice(i, 1);
          // Cascade: a landed chunk might now anchor or isolate things
          detachFloatingChunks();
          break;
        }
        c.y += 1;
        remaining -= 1;
      }
    }
  }

  // Player
  const MAX_HP = 100;
  const player = {
    x: W / 2, y: 20,
    w: 6, h: 10,
    vx: 0, vy: 0,
    onGround: false,
    facing: 1,
    hp: MAX_HP,
    dead: false,
    deathTimer: 0,
    walkPhase: 0,
    jumpCharge: 0,
    breathT: 0,
    ducking: false,
  };
  const STAND_H = 10;
  const DUCK_H  = 6;
  const JUMP_CHARGE_FRAMES = 6;

  function playerCollidesAt(px, py) {
    const x0 = Math.floor(px - player.w / 2);
    const x1 = Math.floor(px + player.w / 2 - 0.001);
    const y0 = Math.floor(py - player.h);
    const y1 = Math.floor(py - 0.001);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (solid(x, y)) return true;
      }
    }
    return false;
  }

  function updatePlayer() {
    if (player.dead) {
      // Still subject to gravity so the corpse settles
      player.vy += 0.18;
      if (player.vy > 5) player.vy = 5;
      let my = player.vy;
      const ydir = my > 0 ? 1 : -1;
      let ysteps = Math.ceil(Math.abs(my));
      for (let s = 0; s < ysteps; s++) {
        const tryY = player.y + ydir;
        if (!playerCollidesAt(player.x, tryY)) player.y = tryY;
        else { player.vy = 0; break; }
      }
      player.deathTimer++;
      // Slow drip: a single pixel every ~25 ticks, near the body, leaking sideways/down
      if ((player.deathTimer % 25) === 0) {
        bloods.push({
          x: player.x + (Math.random() - 0.5) * player.h,
          y: player.y - 1,
          vx: (Math.random() - 0.5) * 0.4,
          vy: 0.3 + Math.random() * 0.4,
          life: 90,
        });
      }
      return;
    }
    // Face toward cursor each frame
    player.facing = (mouseX >= player.x) ? 1 : -1;
    // Breathing — always ticks while alive so even an idle worm looks alive
    player.breathT++;
    // Duck input: held while pressing S / down, but only on the ground.
    // Unduck is gated on having free space above so the head doesn't tunnel.
    const wantDuck = (keys['s'] || keys['arrowdown']) && player.onGround;
    if (wantDuck) {
      player.h = DUCK_H;
      player.ducking = true;
    } else if (player.ducking) {
      player.h = STAND_H;
      if (playerCollidesAt(player.x, player.y)) {
        player.h = DUCK_H; // stuck under something, stay ducked
      } else {
        player.ducking = false;
      }
    }
    // Horizontal input — frozen while crouching for the jump
    let ax = 0;
    if (keys['arrowleft'] || keys['a']) ax -= 1;
    if (keys['arrowright'] || keys['d']) ax += 1;
    if (player.jumpCharge > 0) ax = 0;
    player.vx = ax * (player.ducking ? 0.45 : 0.7);
    // Advance walk phase only when actually moving on the ground
    if (ax !== 0 && player.onGround) player.walkPhase++;
    else player.walkPhase = 0;

    // Gravity
    player.vy += 0.18;
    if (player.vy > 5) player.vy = 5;

    // Move X with sub-stepping; allow step-up of up to 2px to climb small bumps
    let mx = player.vx;
    const stepDir = mx > 0 ? 1 : -1;
    let steps = Math.ceil(Math.abs(mx));
    for (let s = 0; s < steps; s++) {
      const tryX = player.x + stepDir;
      if (!playerCollidesAt(tryX, player.y)) {
        player.x = tryX;
      } else {
        // Try step-up — generous enough to smooth over jagged pixel slopes,
        // but capped so steep walls still block (Worms-style traversal).
        let climbed = false;
        for (let up = 1; up <= 4; up++) {
          if (!playerCollidesAt(tryX, player.y - up)) {
            player.x = tryX;
            player.y -= up;
            climbed = true;
            break;
          }
        }
        if (!climbed) { player.vx = 0; break; }
      }
    }

    // Move Y
    let my = player.vy;
    const ydir = my > 0 ? 1 : -1;
    let ysteps = Math.ceil(Math.abs(my));
    player.onGround = false;
    for (let s = 0; s < ysteps; s++) {
      const tryY = player.y + ydir;
      if (!playerCollidesAt(player.x, tryY)) {
        player.y = tryY;
      } else {
        if (ydir > 0) player.onGround = true;
        player.vy = 0;
        break;
      }
    }

    // Jump — small sit-up crouch before launching
    if (jumpQueued > 0 && player.onGround && !player.ducking && player.jumpCharge === 0) {
      player.jumpCharge = JUMP_CHARGE_FRAMES;
      jumpQueued = 0;
    } else if (jumpQueued > 0) {
      jumpQueued--;
    }
    if (player.jumpCharge > 0 && player.onGround) {
      player.jumpCharge--;
      if (player.jumpCharge === 0) {
        player.vy = -2.8;
        player.onGround = false;
      }
    } else if (!player.onGround) {
      player.jumpCharge = 0;
    }

    // Don't fall out of world
    if (player.y > H + 50) {
      player.x = W / 2; player.y = 20; player.vx = 0; player.vy = 0;
    }
  }

  // Rendering
  function renderTerrain() {
    const d = terrainImg.data;
    // Reset to transparent
    for (let i = 0; i < d.length; i += 4) {
      d[i] = 0; d[i+1] = 0; d[i+2] = 0; d[i+3] = 0;
    }
    // Find top-of-column for grass tinting
    for (let x = 0; x < W; x++) {
      let topY = -1;
      for (let y = 0; y < H; y++) {
        if (grid[idx(x, y)] === 1) { topY = y; break; }
      }
      if (topY < 0) continue;
      for (let y = topY; y < H; y++) {
        if (grid[idx(x, y)] !== 1) continue;
        const di = (y * W + x) * 4;
        let col;
        const depth = y - topY;
        if (depth === 0)        col = COL_GRASS;
        else if (depth === 1)   col = COL_GRASS;
        else if (depth === 2)   col = COL_GRASS_DK;
        else if ((x + y) & 1)   col = COL_DIRT;
        else                    col = COL_DIRT2;
        d[di]   = col[0];
        d[di+1] = col[1];
        d[di+2] = col[2];
        d[di+3] = col[3];
      }
    }
    tctx.putImageData(terrainImg, 0, 0);
    terrainDirty = false;
  }

  function render() {
    // Screen shake — random offset scaled by trauma² so big hits feel chunky.
    const SHAKE_MAX = 5;
    const s = shakeTrauma * shakeTrauma;
    const shakeX = (Math.random() * 2 - 1) * SHAKE_MAX * s;
    const shakeY = (Math.random() * 2 - 1) * SHAKE_MAX * s;
    ctx.setTransform(1, 0, 0, 1, shakeX, shakeY);

    // Sky — during slow-mo we fade with low alpha so the previous frame's
    // moving pixels (bullets, blood, rockets) leave motion-blur trails.
    if (slowmoActive()) {
      ctx.fillStyle = 'rgba(135,206,235,0.25)';
    } else {
      ctx.fillStyle = '#87ceeb';
    }
    ctx.fillRect(-SHAKE_MAX, -SHAKE_MAX, W + SHAKE_MAX * 2, H + SHAKE_MAX * 2);
    // Sun
    ctx.fillStyle = '#fff7cc';
    ctx.beginPath(); ctx.arc(W - 50, 40, 18, 0, Math.PI * 2); ctx.fill();

    // Clouds drift in front of the sun but behind everything else
    renderClouds();

    if (terrainDirty) renderTerrain();

    // Explosion flashes — drawn BEFORE terrain so they glow from inside the
    // crater. The current (post-carve) terrain then overlays them, so the
    // flash is only visible through the freshly-blown hole, never on top of
    // intact dirt or sky.
    for (const f of flashes) {
      if (!f.explosion) continue;
      const t = f.life / f.maxLife;
      ctx.globalAlpha = t;
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (0.6 + (1 - t) * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.drawImage(terrainCanvas, 0, 0);

    // Static trees on top of terrain — sway with current wind
    renderTrees(windNow());

    // Falling chunks
    for (const c of chunks) {
      const p = c.pixels;
      ctx.fillStyle = '#8a4828';
      for (let k = 0; k < p.length; k += 2) {
        ctx.fillRect(c.x + p[k], c.y + p[k+1], 1, 1);
      }
    }

    // UFOs + lasers (above clouds/terrain, below player projectiles)
    renderUfos();
    renderLasers();
    renderPacks();

    // Bullets — small round amber pellet inside a dark ring for visibility
    for (const b of bullets) {
      ctx.fillStyle = '#3a1f00';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 1.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffaa10';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 0.9, 0, Math.PI * 2);
      ctx.fill();
    }

    // Blood pixels in flight
    ctx.fillStyle = '#c8121a';
    for (const b of bloods) {
      ctx.fillRect(Math.floor(b.x), Math.floor(b.y), 1, 1);
    }

    // Rockets — chunky dark body with a flickering flame tail
    for (const r of rockets) {
      const sp = Math.hypot(r.vx, r.vy) || 1;
      const ux = r.vx / sp, uy = r.vy / sp;
      // Two-pixel flame tail
      const t1x = Math.floor(r.x - ux * 3), t1y = Math.floor(r.y - uy * 3);
      const t2x = Math.floor(r.x - ux * 5), t2y = Math.floor(r.y - uy * 5);
      ctx.fillStyle = (Math.random() < 0.5) ? '#ffd040' : '#ff7020';
      ctx.fillRect(t1x, t1y, 2, 2);
      ctx.fillStyle = (Math.random() < 0.5) ? '#ff5010' : '#a03000';
      ctx.fillRect(t2x, t2y, 1, 1);
      // Outline + body
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.floor(r.x) - 1, Math.floor(r.y) - 1, 4, 4);
      ctx.fillStyle = '#5a5a5a';
      ctx.fillRect(Math.floor(r.x), Math.floor(r.y), 2, 2);
    }

    // Muzzle flashes (drawn over everything, including sky)
    for (const f of flashes) {
      if (f.explosion) continue;
      const t = f.life / f.maxLife;
      ctx.globalAlpha = t;
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (0.6 + (1 - t) * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Grenades (blink faster as fuse runs out)
    for (const g of grenades) {
      const blink = g.fuse < 30 ? (g.fuse >> 1) & 1 : ((g.fuse >> 3) & 1);
      ctx.fillStyle = blink ? '#ff4444' : '#2a2a2a';
      ctx.fillRect(Math.floor(g.x) - 1, Math.floor(g.y) - 1, 3, 3);
    }

    // Player
    if (player.dead) {
      // Lying on side: swap width/height, head at facing end
      const lw = player.h, lh = player.w;
      const lx = Math.floor(player.x - lw / 2);
      const ly = Math.floor(player.y - lh);
      const headRight = player.facing > 0;
      ctx.fillStyle = '#cc3030';
      ctx.fillRect(lx, ly, lw, lh); // body slab
      ctx.fillStyle = '#ffd9b3';
      ctx.fillRect(headRight ? lx + lw - 4 : lx, ly, 4, lh); // head
      // X eye
      ctx.fillStyle = '#000';
      const eyeX = headRight ? lx + lw - 2 : lx + 1;
      ctx.fillRect(eyeX, ly + 1, 1, 1);
    } else {
      const crouched = player.jumpCharge > 0;
      const squish = crouched ? 2 : 0;             // body compresses by 2px when crouching
      // Breathing: 1px head bob + 1px shoulder shift on slow alternating cycle.
      // Suppressed while crouching / airborne so it only reads on idle/walk.
      const calm = !crouched && player.onGround;
      const breathCycle = Math.sin(player.breathT * 0.06);  // ~17 frame period each half
      const breathBob = calm && breathCycle > 0.5 ? 1 : 0;  // head dips 1px on exhale
      const shoulderShift = calm && breathCycle < -0.5 ? 1 : 0; // body inhale lift
      const px = Math.floor(player.x - player.w / 2);
      const py = Math.floor(player.y - player.h) + squish + breathBob;
      // Head
      ctx.fillStyle = '#ffd9b3';
      ctx.fillRect(px, py, player.w, 4);
      // Body (shorter when crouched; leave 3px for legs at the bottom)
      const bodyTop = py + 4 - shoulderShift;
      const bodyBottom = Math.floor(player.y) - 3; // 3 px reserved for legs
      const bodyH = Math.max(1, bodyBottom - bodyTop);
      ctx.fillStyle = '#cc3030';
      ctx.fillRect(px, bodyTop, player.w, bodyH);
      // Eye
      ctx.fillStyle = '#000';
      ctx.fillRect(px + (player.facing > 0 ? player.w - 2 : 1), py + 1, 1, 1);

      // Legs
      ctx.fillStyle = '#2a2a2a';
      const legY = bodyBottom;
      const baseBottom = Math.floor(player.y);
      const legLeftX  = px + 2;
      const legRightX = px + player.w - 3;
      // Per-column ground probe: scan downward from the leg's top until we
      // find the first solid pixel, so each leg stands on its own surface
      // even on steep slopes. Wide vertical window so adjacent columns
      // (which may differ by several pixels) are still reached.
      function legFootY(col, top) {
        if (!player.onGround) return baseBottom;
        if (col < 0 || col >= W) return baseBottom;
        const minY = top + 1;
        const maxY = baseBottom + 4;
        for (let yy = minY; yy <= maxY; yy++) {
          if (yy >= H) return yy;
          if (yy >= 0 && grid[idx(col, yy)] === 1) return yy;
        }
        return baseBottom;
      }
      // Draw a single leg from y=top down to its column's ground (or to baseBottom in air).
      function drawLeg(col, top) {
        const foot = legFootY(col, top);
        const h = Math.max(1, foot - top);
        ctx.fillRect(col, top, 1, h);
      }
      if (crouched) {
        drawLeg(legLeftX,  legY + 1);
        drawLeg(legRightX, legY + 1);
      } else if (!player.onGround) {
        // Mid-air: tucked legs (fixed short stubs, no ground probe)
        ctx.fillRect(legLeftX,  legY + 1, 1, 2);
        ctx.fillRect(legRightX, legY + 1, 1, 2);
      } else if (Math.abs(player.vx) > 0.01) {
        const phase = (player.walkPhase >> 2) & 1; // 0 or 1
        const frontDX = player.facing;
        const backDX  = -player.facing;
        if (phase === 0) {
          drawLeg(legLeftX  + frontDX, legY);
          drawLeg(legRightX + backDX,  legY + 1);
        } else {
          drawLeg(legLeftX  + backDX,  legY + 1);
          drawLeg(legRightX + frontDX, legY);
        }
      } else {
        drawLeg(legLeftX,  legY);
        drawLeg(legRightX, legY);
      }
    }
    if (!player.dead) {
    // Weapon — rotated to aim, shape per weapon
    const gx0 = player.x;
    const gy0 = player.y - player.h / 2;
    const adx = mouseX - gx0, ady = mouseY - gy0;
    const ang = Math.atan2(ady, adx);
    ctx.save();
    ctx.translate(gx0, gy0);
    ctx.rotate(ang);
    // When aiming to the left the sprite is rotated past vertical, which puts
    // grip/mag on top. Flip the local Y so "down" of the weapon stays toward
    // the player's feet regardless of facing.
    if (adx < 0) ctx.scale(1, -1);
    if (weapon === 'pistol') {
      // Short stubby grey pistol — barrel + small grip
      ctx.fillStyle = '#444';
      ctx.fillRect(0, -1, 5, 2);              // barrel
      ctx.fillStyle = '#222';
      ctx.fillRect(1, 0, 2, 3);               // grip stub
    } else if (weapon === 'mg') {
      // Longer barrel, mag underneath
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(0, -1, 9, 2);              // long barrel
      ctx.fillStyle = '#555';
      ctx.fillRect(7, -2, 2, 1);              // front sight
      ctx.fillStyle = '#222';
      ctx.fillRect(2, 1, 3, 3);               // magazine
    } else if (weapon === 'bazooka') {
      // Compact tube with muzzle ring and small handgrip
      ctx.fillStyle = '#3a2a1a';
      ctx.fillRect(-1, -1, 8, 3);             // tube
      ctx.fillStyle = '#5a3a20';
      ctx.fillRect(6, -2, 2, 4);              // muzzle ring
      ctx.fillStyle = '#222';
      ctx.fillRect(1, 2, 2, 2);               // grip
    }
    ctx.restore();

    // Aim reticle
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mouseX - 3, mouseY); ctx.lineTo(mouseX + 3, mouseY);
    ctx.moveTo(mouseX, mouseY - 3); ctx.lineTo(mouseX, mouseY + 3);
    ctx.stroke();
    }

    // Slow-mo screen filter — a cool blue tint with vignette at the edges
    if (slowmoActive()) {
      ctx.fillStyle = 'rgba(80,140,220,0.18)';
      ctx.fillRect(0, 0, W, H);
      const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
      vg.addColorStop(0, 'rgba(0,0,40,0)');
      vg.addColorStop(1, 'rgba(0,0,40,0.45)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    // Bullet-time meter (top-left). Border + fill that shrinks as you use it.
    {
      const mW = 60, mH = 4;
      const mx = 6, my = 6;
      ctx.fillStyle = '#000';
      ctx.fillRect(mx - 1, my - 1, mW + 2, mH + 2);
      const frac = slowmoEnergy / SLOWMO_MAX_MS;
      ctx.fillStyle = slowmoActive() ? '#60c0ff'
                     : frac < 0.2     ? '#a04040'
                                       : '#3070a0';
      ctx.fillRect(mx, my, Math.round(mW * frac), mH);
    }

    // Game-over overlay
    if (player.dead) {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // GAME OVER
      ctx.fillStyle = '#000';
      ctx.font = 'bold 32px monospace';
      ctx.fillText('GAME OVER', W / 2 + 1, H / 2 - 9);
      ctx.fillStyle = '#ff3030';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 10);
      // Stats
      ctx.font = '10px monospace';
      const lines = [
        'Survived: ' + survivedString(),
        'Hits: ' + hits,
        'Score: ' + currentScore(),
      ];
      lines.forEach((line, i) => {
        const ly = H / 2 + 14 + i * 12;
        ctx.fillStyle = '#000';
        ctx.fillText(line, W / 2 + 1, ly + 1);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(line, W / 2, ly);
      });
      // Press R
      const pry = H / 2 + 14 + lines.length * 12 + 6;
      ctx.fillStyle = '#000';
      ctx.fillText('Press R to reload', W / 2 + 1, pry + 1);
      ctx.fillStyle = '#ffe060';
      ctx.fillText('Press R to reload', W / 2, pry);
      ctx.textAlign = 'start';
      ctx.textBaseline = 'alphabetic';
    }

    // HP bar above player
    if (!player.dead) {
      const hpW = 16;
      const hpx = Math.floor(player.x - hpW / 2);
      const hpy = Math.floor(player.y - player.h) - 4;
      ctx.fillStyle = '#000';
      ctx.fillRect(hpx - 1, hpy - 1, hpW + 2, 3);
      ctx.fillStyle = player.hp > 50 ? '#3ad14a' : player.hp > 20 ? '#e0c020' : '#d03030';
      ctx.fillRect(hpx, hpy, Math.round((player.hp / MAX_HP) * hpW), 1);
    }
  }

  // Weapons
  const WEAPONS = {
    pistol:  { name: 'PISTOL',  fire: fireBullet, interval: 24, auto: false },
    mg:      { name: 'MG',      fire: fireBullet, interval: 5,  auto: true  },
    bazooka: { name: 'BAZOOKA', fire: fireRocket, interval: 55, auto: false },
  };
  let weapon = 'mg';

  // Input
  const keys = Object.create(null);
  // Jump input buffer: frames remaining where a queued jump is still valid.
  // Lets you press jump slightly before/after leaving the ground while walking
  // over uneven terrain (a brief step-up can put you off-ground for a tick).
  let jumpQueued = 0;
  const JUMP_BUFFER = 8;
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const wasDown = keys[k];
    if (!wasDown && !player.dead && (k === ' ' || k === 'w' || k === 'arrowup')) jumpQueued = JUMP_BUFFER;
    if (!wasDown && !player.dead && k === 'g') throwGrenade();
    if (!wasDown && k === '1') { weapon = 'pistol';  updateWeaponHud(); }
    if (!wasDown && k === '2') { weapon = 'mg';      updateWeaponHud(); }
    if (!wasDown && k === '3') { weapon = 'bazooka'; updateWeaponHud(); }
    keys[k] = true;
    if (k === 'r') {
      generateTerrain();
      spawnTrees();
      resetWaves();
      lasers.length = 0;
      packs.length = 0;
      gameStartMs = Date.now();
      finalElapsedMs = null;
      hits = 0;
      slowmoEnergy = SLOWMO_MAX_MS;
      player.hp = MAX_HP;
      player.dead = false;
      player.deathTimer = 0;
      player.x = W / 2; player.y = 20; player.vx = 0; player.vy = 0;
    }
    if (e.key === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  let mouseX = 0, mouseY = 0;
  function setMouseFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    mouseX = Math.floor((e.clientX - rect.left) * (W / rect.width));
    mouseY = Math.floor((e.clientY - rect.top)  * (H / rect.height));
  }
  canvas.addEventListener('mousemove', setMouseFromEvent);
  let firingHeld = false;
  let fireCooldown = 0;
  let slowmoHeld = false;
  // Bullet-time meter: 10s of use, 5s to recharge from empty.
  const SLOWMO_MAX_MS = 10000;
  const SLOWMO_RECHARGE_MS = 5000;
  let slowmoEnergy = SLOWMO_MAX_MS;
  let slowmoLastMs = Date.now();
  function slowmoActive() {
    return slowmoHeld && slowmoEnergy > 0 && !player.dead;
  }
  function updateSlowmoEnergy() {
    const now = Date.now();
    const dt = now - slowmoLastMs;
    slowmoLastMs = now;
    if (slowmoActive()) {
      slowmoEnergy = Math.max(0, slowmoEnergy - dt);
    } else {
      slowmoEnergy = Math.min(SLOWMO_MAX_MS, slowmoEnergy + dt * (SLOWMO_MAX_MS / SLOWMO_RECHARGE_MS));
    }
  }
  canvas.addEventListener('mousedown', e => {
    setMouseFromEvent(e);
    if (e.button === 2) {
      slowmoHeld = true;
    } else if (!player.dead) {
      const w = WEAPONS[weapon];
      if (fireCooldown <= 0) { w.fire(); fireCooldown = w.interval; }
      firingHeld = true;
    }
  });
  window.addEventListener('mouseup', e => {
    if (e.button === 2) slowmoHeld = false;
    else firingHeld = false;
  });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // Bullets
  const bullets = [];
  // Visual flashes: { x, y, r, life, maxLife, color }
  const flashes = [];
  // Screen shake: trauma in [0..1]; shake offset = trauma^2 * SHAKE_MAX
  let shakeTrauma = 0;
  function addShake(amount) { shakeTrauma = Math.min(1, shakeTrauma + amount); }
  function fireBullet() {
    const muzzleX = player.x;
    const muzzleY = player.y - player.h / 2;
    const dx = mouseX - muzzleX;
    const dy = mouseY - muzzleY;
    const len = Math.hypot(dx, dy) || 1;
    const speed = 4.5;
    bullets.push({
      x: muzzleX,
      y: muzzleY,
      vx: (dx / len) * speed,
      vy: (dy / len) * speed,
      life: 120,
    });
    // Muzzle flash at the gun tip
    flashes.push({
      x: muzzleX + (dx / len) * 7,
      y: muzzleY + (dy / len) * 7,
      r: 3, maxLife: 4, life: 4,
      color: '#ffe066',
    });
    addShake(0.75);
    player.facing = dx >= 0 ? 1 : -1;
  }

  function updateFlashes() {
    for (let i = flashes.length - 1; i >= 0; i--) {
      if (--flashes[i].life <= 0) flashes.splice(i, 1);
    }
    // Trauma decays smoothly each tick
    shakeTrauma = Math.max(0, shakeTrauma - 0.06);
  }

  // Blood pixels — single-pixel particles that arc out and stick on landing
  const bloods = [];
  function updateBloods() {
    for (let i = bloods.length - 1; i >= 0; i--) {
      const b = bloods[i];
      b.vy += 0.18;
      if (b.vy > 5) b.vy = 5;
      b.vx *= 0.995;
      const steps = Math.max(1, Math.ceil(Math.max(Math.abs(b.vx), Math.abs(b.vy))));
      let dead = false;
      for (let s = 0; s < steps; s++) {
        const nx = b.x + b.vx / steps;
        const ny = b.y + b.vy / steps;
        const gx = Math.floor(nx), gy = Math.floor(ny);
        if (gx < 0 || gx >= W || gy >= H) { dead = true; break; }
        if (gy >= 0 && grid[idx(gx, gy)] === 1) {
          // Paint blood onto terrain at the impact spot
          const px = Math.floor(b.x), py = Math.floor(b.y);
          if (inBounds(px, py)) {
            // Stamp a red pixel on the terrain image directly
            tctx.fillStyle = '#a01020';
            tctx.fillRect(px, py, 1, 1);
          }
          dead = true; break;
        }
        b.x = nx; b.y = ny;
      }
      b.life--;
      if (dead || b.life <= 0) bloods.splice(i, 1);
    }
  }

  // Shared explosion: carves crater, flash, shake, damages player if in blastR, sprays blood
  function explode(x, y, craterR, blastR, maxDmg, shake) {
    carveCircle(x, y, craterR, true);
    flashes.push({ x, y, r: craterR * 0.65, maxLife: 14, life: 14, color: '#fff2a8', explosion: true });
    flashes.push({ x, y, r: craterR * 0.82, maxLife: 18, life: 18, color: '#ff8a3a', explosion: true });
    addShake(shake);
    const pcx = player.x, pcy = player.y - player.h / 2;
    const ddx = pcx - x, ddy = pcy - y;
    const dist = Math.hypot(ddx, ddy);
    if (dist < blastR && !player.dead) {
      const intensity = 1 - dist / blastR;
      const dmg = Math.round(maxDmg * intensity * intensity + 5 * intensity);
      player.hp = Math.max(0, player.hp - dmg);
      if (player.hp === 0) { player.dead = true; player.deathTimer = 0; if (finalElapsedMs === null) finalElapsedMs = Date.now() - gameStartMs; }
      const count = 14 + Math.floor(intensity * 26);
      for (let k = 0; k < count; k++) {
        const ang = Math.atan2(ddy || (Math.random() - 0.5), ddx || (Math.random() - 0.5))
          + (Math.random() - 0.5) * 1.4;
        const speed = 1 + Math.random() * 3 + intensity * 1.5;
        bloods.push({
          x: pcx + (Math.random() - 0.5) * 2,
          y: pcy + (Math.random() - 0.5) * 4,
          vx: Math.cos(ang) * speed,
          vy: Math.sin(ang) * speed - Math.random() * 1.5,
          life: 60 + (Math.random() * 40) | 0,
        });
      }
    }
  }

  // Rockets — straight-flying projectiles that explode on terrain contact
  const rockets = [];
  function fireRocket() {
    const mx0 = player.x;
    const my0 = player.y - player.h / 2;
    const dx = mouseX - mx0, dy = mouseY - my0;
    const len = Math.hypot(dx, dy) || 1;
    const speed = 3.0;
    rockets.push({
      x: mx0 + (dx / len) * 7,
      y: my0 + (dy / len) * 7,
      vx: (dx / len) * speed,
      vy: (dy / len) * speed,
      life: 200,
    });
    player.facing = dx >= 0 ? 1 : -1;
    addShake(0.3);
  }
  function updateRockets() {
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      const steps = Math.max(1, Math.ceil(Math.max(Math.abs(r.vx), Math.abs(r.vy))));
      let hit = false;
      for (let s = 0; s < steps; s++) {
        r.x += r.vx / steps;
        r.y += r.vy / steps;
        const gx = Math.floor(r.x), gy = Math.floor(r.y);
        if (gx < 0 || gx >= W || gy >= H) { hit = true; break; }
        { const u = ufoAt(r.x, r.y); if (u) { damageUfo(u, 4); hit = true; break; } }
        if (gy >= 0 && grid[idx(gx, gy)] === 1) { hit = true; break; }
      }
      r.life--;
      if (hit || r.life <= 0) {
        // 30% smaller crater than grenade (22 → ~15). Self-damage if close.
        explode(r.x, r.y, 15, 45, 55, 0.85);
        rockets.splice(i, 1);
      }
    }
  }

  // Grenades
  const grenades = [];
  function throwGrenade() {
    const mx0 = player.x;
    const my0 = player.y - player.h / 2;
    const dx = mouseX - mx0;
    const dy = mouseY - my0;
    const len = Math.hypot(dx, dy) || 1;
    const power = 3.2;
    grenades.push({
      x: mx0,
      y: my0,
      vx: (dx / len) * power,
      vy: (dy / len) * power - 0.5, // slight upward bias for an arc
      fuse: 120, // ~2s at 60fps
    });
    player.facing = dx >= 0 ? 1 : -1;
  }

  function grenadeSolidAt(gx, gy) {
    if (gx < 0 || gx >= W) return true;
    if (gy >= H) return true;
    if (gy < 0) return false;
    return grid[idx(gx, gy)] === 1;
  }

  function updateGrenades() {
    for (let i = grenades.length - 1; i >= 0; i--) {
      const g = grenades[i];
      g.vy += 0.18;
      if (g.vy > 5) g.vy = 5;

      // Sub-step movement with axis-separated collision so it bounces off walls/floor naturally
      const steps = Math.max(1, Math.ceil(Math.max(Math.abs(g.vx), Math.abs(g.vy))));
      for (let s = 0; s < steps; s++) {
        // X
        const nx = g.x + g.vx / steps;
        if (grenadeSolidAt(Math.floor(nx), Math.floor(g.y))) {
          g.vx = -g.vx * 0.5;
        } else {
          g.x = nx;
        }
        // Y
        const ny = g.y + g.vy / steps;
        if (grenadeSolidAt(Math.floor(g.x), Math.floor(ny))) {
          if (g.vy > 0) g.vy = -g.vy * 0.45;
          else g.vy = -g.vy * 0.5;
          g.vx *= 0.8; // friction on landing
        } else {
          g.y = ny;
        }
      }

      g.fuse--;
      if (g.fuse <= 0) {
        explode(g.x, g.y, 22, 60, 70, 0.85);
        grenades.splice(i, 1);
      }
    }
  }

  function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      // Sub-step so fast bullets don't tunnel
      const steps = Math.ceil(Math.max(Math.abs(b.vx), Math.abs(b.vy)));
      let hit = false;
      for (let s = 0; s < steps; s++) {
        b.x += b.vx / steps;
        b.y += b.vy / steps;
        const gx = Math.floor(b.x), gy = Math.floor(b.y);
        if (gx < 0 || gx >= W || gy >= H) { hit = true; break; }
        { const u = ufoAt(b.x, b.y); if (u) { damageUfo(u, 1); hit = true; break; } }
        if (gy >= 0 && grid[idx(gx, gy)] === 1) {
          carveCircle(gx, gy, 6, true);
          hit = true;
          break;
        }
      }
      b.life--;
      if (hit || b.life <= 0) bullets.splice(i, 1);
    }
  }

  // HUD weapon label
  const weapEl = document.getElementById('weap');
  function updateWeaponHud() {
    weapEl.textContent = 'Weapon: ' + WEAPONS[weapon].name;
  }
  updateWeaponHud();

  // Wind / clouds / trees ---------------------------------------------------
  let windT = 0;
  function windNow() {
    // Slow base breeze + faster gentle ripple. Range roughly [-1.4, 1.4].
    return Math.sin(windT * 0.006) * 1.0 + Math.sin(windT * 0.021) * 0.4;
  }

  const clouds = [];
  function spawnClouds() {
    clouds.length = 0;
    for (let i = 0; i < 5; i++) {
      clouds.push({
        x: Math.random() * W,
        y: 10 + Math.random() * 60,
        scale: 0.7 + Math.random() * 0.9,
        speed: 0.06 + Math.random() * 0.08,
      });
    }
  }

  const trees = [];
  function spawnTrees() {
    trees.length = 0;
    const count = 6 + ((Math.random() * 4) | 0);
    for (let i = 0; i < count; i++) {
      const tx = Math.floor(20 + Math.random() * (W - 40));
      const top = groundTopAt(tx);
      if (top < 0) continue; // no ground here, skip
      trees.push({
        x: tx,
        rootY: top,                              // current surface position of the trunk base
        vy: 0,                                   // vertical velocity when terrain drops away
        h:   6 + ((Math.random() * 5) | 0),     // trunk height
        cw:  5 + ((Math.random() * 3) | 0),     // canopy half-width
        ch:  5 + ((Math.random() * 3) | 0),     // canopy half-height
        sway: Math.random() * 6.28,             // phase offset so they don't all sway in lockstep
        falling: false,
        fallen: false,
        angle: 0,                                // 0 = upright; +π/2 = flat to the right
        angVel: 0,
        dir: 1,                                  // which way it topples
      });
    }
  }
  function groundTopAt(x) {
    if (x < 0 || x >= W) return -1;
    for (let y = 0; y < H; y++) if (grid[idx(x, y)] === 1) return y;
    return -1;
  }
  function renderClouds() {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const c of clouds) {
      // Cloud built from a few overlapping circles
      const r = 6 * c.scale;
      ctx.beginPath();
      ctx.arc(c.x,        c.y,        r,        0, Math.PI * 2);
      ctx.arc(c.x + r,    c.y - r*0.3, r*0.9,   0, Math.PI * 2);
      ctx.arc(c.x - r*0.8,c.y,         r*0.7,   0, Math.PI * 2);
      ctx.arc(c.x + r*1.7,c.y + r*0.1, r*0.7,   0, Math.PI * 2);
      ctx.fill();
    }
  }
  function updateTrees() {
    for (let i = trees.length - 1; i >= 0; i--) {
      const t = trees[i];
      if (t.fallen) {
        t.fadeT = (t.fadeT || 0) + 1;
        if (t.fadeT > 90) trees.splice(i, 1);
        continue;
      }

      // Vertical follow: if the ground at this column has dropped (or vanished),
      // pull the tree down with gravity until it rests on the new surface.
      const top = groundTopAt(t.x);
      if (top < 0) {
        // No ground in this column at all — free fall.
        t.vy += 0.18;
        if (t.vy > 5) t.vy = 5;
        t.rootY += t.vy;
        if (t.rootY > H + 20) { trees.splice(i, 1); continue; }
      } else if (top > t.rootY) {
        // Ground has receded below the trunk base — fall to catch up.
        t.vy += 0.18;
        if (t.vy > 5) t.vy = 5;
        t.rootY = Math.min(top, t.rootY + t.vy);
        if (t.rootY === top) t.vy = 0;
      } else {
        // top <= rootY: ground is at or above the trunk base — settled.
        t.vy = 0;
        t.rootY = top; // ride small surface bumps
      }

      if (!t.falling) {
        // Lateral support check — sample ground a few pixels either side of
        // the trunk. If one side is much lower (or gone) we've got an
        // overhang and the tree should topple toward that void.
        const leftTop  = groundTopAt(t.x - 3);
        const rightTop = groundTopAt(t.x + 3);
        const leftBad  = leftTop  < 0 || leftTop  > t.rootY + 4;
        const rightBad = rightTop < 0 || rightTop > t.rootY + 4;
        if (leftBad || rightBad) {
          t.falling = true;
          if (leftBad && !rightBad) t.dir = -1;
          else if (rightBad && !leftBad) t.dir = 1;
          else t.dir = windNow() >= 0 ? 1 : -1;
          t.angVel = 0.005 * t.dir;
        }
      } else {
        t.angVel += 0.012 * t.dir;
        t.angle += t.angVel;
        if (Math.abs(t.angle) >= Math.PI / 2) {
          t.angle = (Math.PI / 2) * t.dir;
          t.falling = false;
          t.fallen = true;
        }
      }
    }
  }

  function updateClouds(w) {
    for (const c of clouds) {
      c.x += c.speed + w * 0.4;
      const span = 30 * c.scale;
      if (c.x - span > W) c.x = -span;
      if (c.x + span < 0) c.x = W + span;
    }
  }
  function renderTrees(w) {
    for (const t of trees) {
      // rootY is kept up-to-date in updateTrees (follows the surface with
      // gravity), so we can just render at the current rootY in every state.
      const baseY = t.rootY;
      const sway = (t.falling || t.fallen)
        ? 0
        : Math.round(w * 2.2 * Math.sin(windT * 0.04 + t.sway));

      ctx.save();
      ctx.translate(t.x, baseY);
      if (t.angle !== 0) ctx.rotate(t.angle);
      if (t.fallen) ctx.globalAlpha = Math.max(0, 1 - (t.fadeT || 0) / 90);

      // Trunk grows upward from the pivot.
      ctx.fillStyle = '#5a3a18';
      for (let i = 0; i < t.h; i++) {
        const dx = (t.falling || t.fallen) ? 0 : Math.round((i / t.h) * sway);
        ctx.fillRect(dx,     -i - 1, 1, 1);
        ctx.fillRect(dx + 1, -i - 1, 1, 1);
      }
      // Canopy centred above the trunk.
      const cy = -t.h - t.ch + 1;
      const cx = (t.falling || t.fallen) ? 0 : sway;
      ctx.fillStyle = '#2c8a3a';
      for (let y = -t.ch; y <= t.ch; y++) {
        for (let x = -t.cw; x <= t.cw; x++) {
          const d = (x*x) / (t.cw*t.cw) + (y*y) / (t.ch*t.ch);
          if (d <= 1) ctx.fillRect(cx + x, cy + y, 1, 1);
        }
      }
      ctx.fillStyle = '#4cb050';
      ctx.fillRect(cx - 1, cy - t.ch + 1, 1, 1);
      ctx.fillRect(cx + 1, cy - t.ch + 2, 1, 1);

      ctx.restore();
    }
  }

  // Health packs --------------------------------------------------------------
  // Small crates that fall out of the sky, settle on terrain, and heal the
  // player on contact. Spawned mostly after enemy ships are downed, plus an
  // occasional random drop so the player has a chance to top up.
  const HEAL_AMOUNT = 35;
  const packs = [];
  function spawnPack(x) {
    packs.push({
      x: Math.max(8, Math.min(W - 8, x | 0)),
      y: -6,
      vy: 0,
      bob: Math.random() * 6.28,
      idle: 0,                 // ticks since landing (used for parachute fade + idle bob)
      landed: false,
    });
  }
  function packSolidAt(gx, gy) {
    if (gx < 0 || gx >= W) return true;
    if (gy >= H) return true;
    if (gy < 0) return false;
    return grid[idx(gx, gy)] === 1;
  }
  function updatePacks() {
    for (let i = packs.length - 1; i >= 0; i--) {
      const p = packs[i];
      if (!p.landed) {
        // Slowed fall (parachute) — cap vy lower than gravity normally allows.
        p.vy = Math.min(1.1, p.vy + 0.05);
        let remaining = p.vy;
        while (remaining > 0) {
          const step = Math.min(1, remaining);
          if (packSolidAt(Math.floor(p.x), Math.floor(p.y + 2))) {
            p.landed = true;
            p.vy = 0;
            break;
          }
          p.y += step;
          remaining -= step;
        }
      } else {
        p.idle++;
        p.bob += 0.05;
      }
      // Player pickup — overlap check with player bounding box
      if (!player.dead) {
        const dx = Math.abs(p.x - player.x);
        const dy = Math.abs(p.y - (player.y - player.h / 2));
        if (dx < 4 && dy < player.h / 2 + 2) {
          player.hp = Math.min(MAX_HP, player.hp + HEAL_AMOUNT);
          // Sparkle: a small green burst at the player
          for (let k = 0; k < 10; k++) {
            const ang = Math.random() * Math.PI * 2;
            flashes.push({
              x: player.x + Math.cos(ang) * 3,
              y: player.y - player.h / 2 + Math.sin(ang) * 3,
              r: 1.5, maxLife: 14, life: 14,
              color: '#9aff90',
            });
          }
          packs.splice(i, 1);
          continue;
        }
      }
      if (p.y > H + 20) packs.splice(i, 1);
    }
  }
  function renderPacks() {
    for (const p of packs) {
      const x = Math.floor(p.x), y = Math.floor(p.y + (p.landed ? Math.sin(p.bob) * 0.5 : 0));
      // Parachute (only while falling)
      if (!p.landed) {
        ctx.fillStyle = '#e0e0e0';
        ctx.fillRect(x - 4, y - 5, 9, 1);
        ctx.fillRect(x - 3, y - 6, 7, 1);
        // Strings
        ctx.fillStyle = '#666';
        ctx.fillRect(x - 3, y - 4, 1, 2);
        ctx.fillRect(x + 3, y - 4, 1, 2);
      }
      // Crate body — white with red cross
      ctx.fillStyle = '#000';
      ctx.fillRect(x - 3, y - 2, 7, 5);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x - 2, y - 1, 5, 3);
      ctx.fillStyle = '#d02828';
      ctx.fillRect(x, y - 1, 1, 3);   // vertical bar
      ctx.fillRect(x - 1, y, 3, 1);   // horizontal bar
    }
  }

  // UFO enemies --------------------------------------------------------------
  const UFO_W = 24, UFO_H = 10;
  const UFO_BASE_HP = 6;
  const ufos = [];
  const lasers = [];
  // Wave progression: 1 ship at 1× HP, then each wave adds 2 more ships and
  // a +1× HP multiplier (3@2×, 5@3×, 7@4×, 9@5×, …). Endless.
  function waveSpec(i) {
    return { count: 1 + i * 2, hpMult: i + 1 };
  }
  let waveIndex = 0;
  let interWaveDelay = 0; // ticks until next wave spawns after the current is cleared

  function spawnWave(count, hpMult) {
    for (let i = 0; i < count; i++) {
      const maxHp = UFO_BASE_HP * hpMult;
      const baseY = 22 + Math.random() * 18;
      ufos.push({
        x: 20 + Math.random() * (W - 40),
        // Start off the top of the screen and fly down to baseY.
        y: -10 - i * 8 - Math.random() * 6,
        vx: (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 0.2),
        bob: Math.random() * 6.28,
        bobSpeed: 0.035 + Math.random() * 0.03,
        baseY,
        hp: maxHp, maxHp,
        cooldown: 60 + ((Math.random() * 120) | 0),
        hitFlash: 0,
        state: 'entering',     // 'entering' | 'alive' | 'falling'
        vy: 0,
      });
    }
  }
  function resetWaves() {
    ufos.length = 0;
    waveIndex = 0;
    interWaveDelay = 0;
    const w = waveSpec(0);
    spawnWave(w.count, w.hpMult);
  }
  function damageUfo(u, dmg) {
    if (u.state !== 'alive') return;
    u.hp -= dmg;
    u.hitFlash = 6;
    hits++;
    if (u.hp <= 0) {
      u.hp = 0;
      u.state = 'falling';
      u.vy = 0.5 + Math.random() * 0.5;
    }
  }
  function ufoAt(x, y) {
    // Returns the first alive UFO whose bounds contain (x,y), or null.
    for (const u of ufos) {
      if (u.state !== 'alive') continue;
      if (Math.abs(x - u.x) <= UFO_W / 2 && Math.abs(y - u.y) <= UFO_H / 2 + 1) return u;
    }
    return null;
  }
  function fireLaser(u) {
    const sx = u.x;
    const sy = u.y + UFO_H / 2;
    const tx = player.x;
    const ty = player.y - player.h / 2;
    const dx = tx - sx, dy = ty - sy;
    const len = Math.hypot(dx, dy) || 1;
    const speed = 2.2;
    lasers.push({
      x: sx, y: sy,
      vx: (dx / len) * speed,
      vy: (dy / len) * speed,
      life: 240,
    });
  }
  function updateUfos() {
    for (let i = ufos.length - 1; i >= 0; i--) {
      const u = ufos[i];
      if (u.hitFlash > 0) u.hitFlash--;
      if (u.state === 'entering') {
        // Fly in from above to the bobbing altitude.
        u.y += 0.9;
        if (u.y >= u.baseY) {
          u.y = u.baseY;
          u.state = 'alive';
        }
        continue;
      }
      if (u.state === 'falling') {
        // Spiral / plummet. No more shooting.
        u.vy += 0.18;
        if (u.vy > 5) u.vy = 5;
        u.y += u.vy;
        u.x += u.vx * 0.4; // drifts as it falls
        // Sample several columns across the saucer's belly so a wide hull
        // still detects ground contact even if u.x is over a small gap.
        const belly = u.y + UFO_H / 2;
        const gy = Math.floor(belly);
        let inTerrain = gy >= H;
        if (!inTerrain) {
          for (let dx = -UFO_W / 2; dx <= UFO_W / 2; dx += 2) {
            const gx = Math.floor(u.x + dx);
            if (gx >= 0 && gx < W && gy >= 0 && grid[idx(gx, gy)] === 1) {
              inTerrain = true; break;
            }
          }
        }
        if (inTerrain || u.y > H + 20) {
          // Guaranteed grenade-strength blast on impact, with extra trauma
          // for a satisfying crash even if the saucer fell off-screen.
          explode(u.x, Math.min(H - 1, belly), 22, 60, 70, 1.0);
          // ~60% chance the wreck drops a health pack from above where it died
          if (Math.random() < 0.6) spawnPack(u.x + (Math.random() - 0.5) * 40);
          ufos.splice(i, 1);
        }
        continue;
      }
      // Alive — drift toward staying within a band around the player's column
      u.bob += u.bobSpeed;
      const desiredX = Math.max(20, Math.min(W - 20, player.x));
      const dx = desiredX - u.x;
      if (Math.abs(dx) > 30) u.vx += Math.sign(dx) * 0.008;
      u.vx = Math.max(-0.6, Math.min(0.6, u.vx));
      u.x += u.vx;
      if (u.x < 12) { u.x = 12; u.vx = Math.abs(u.vx); }
      if (u.x > W - 12) { u.x = W - 12; u.vx = -Math.abs(u.vx); }
      u.y = u.baseY + Math.sin(u.bob) * 6;
      // Shoot at player periodically
      if (!player.dead) {
        u.cooldown--;
        if (u.cooldown <= 0) {
          fireLaser(u);
          u.cooldown = 35 + ((Math.random() * 30) | 0);
        }
      }
    }
    // Wave progression — once the field is empty and we have more waves,
    // wait a short beat then spawn the next.
    if (ufos.length === 0) {
      if (interWaveDelay <= 0) interWaveDelay = 180;
      else if (--interWaveDelay === 0) {
        waveIndex++;
        const w = waveSpec(waveIndex);
        spawnWave(w.count, w.hpMult);
      }
    }
  }
  function updateLasers() {
    for (let i = lasers.length - 1; i >= 0; i--) {
      const L = lasers[i];
      const steps = Math.max(1, Math.ceil(Math.max(Math.abs(L.vx), Math.abs(L.vy))));
      let dead = false;
      for (let s = 0; s < steps; s++) {
        L.x += L.vx / steps;
        L.y += L.vy / steps;
        const gx = Math.floor(L.x), gy = Math.floor(L.y);
        if (gx < 0 || gx >= W || gy >= H) { dead = true; break; }
        // Hit terrain → small crater
        if (gy >= 0 && grid[idx(gx, gy)] === 1) {
          carveCircle(gx, gy, 4, true);
          flashes.push({ x: gx, y: gy, r: 4, maxLife: 6, life: 6, color: '#ff5050' });
          dead = true; break;
        }
        // Hit player
        if (!player.dead) {
          const pcx = player.x, pcy = player.y - player.h / 2;
          if (Math.abs(L.x - pcx) < 3 && Math.abs(L.y - pcy) < player.h / 2 + 1) {
            player.hp = Math.max(0, player.hp - 12);
            if (player.hp === 0) { player.dead = true; player.deathTimer = 0; if (finalElapsedMs === null) finalElapsedMs = Date.now() - gameStartMs; }
            // Splash of blood
            for (let k = 0; k < 8; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1 + Math.random() * 2;
              bloods.push({
                x: pcx, y: pcy + (Math.random() - 0.5) * 4,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.5,
                life: 60,
              });
            }
            dead = true; break;
          }
        }
      }
      L.life--;
      if (dead || L.life <= 0) lasers.splice(i, 1);
    }
  }
  function renderUfos() {
    for (const u of ufos) {
      ctx.save();
      // Falling ones tumble and trail smoke
      if (u.state === 'falling') {
        ctx.translate(u.x, u.y);
        ctx.rotate(Math.sin(u.y * 0.1) * 0.6);
        ctx.translate(-u.x, -u.y);
        // Smoke puffs trailing upward as it falls
        if ((Math.random() < 0.6)) {
          flashes.push({
            x: u.x + (Math.random() - 0.5) * 6,
            y: u.y - 2 + Math.random() * 4,
            r: 2 + Math.random() * 1.5,
            maxLife: 20, life: 20,
            color: 'rgba(40,40,40,0.7)',
          });
        }
      }
      const x = u.x, y = u.y;
      // Saucer base — dark slab so it reads well against the sky
      ctx.fillStyle = u.hitFlash > 0 ? '#fff' : '#222';
      ctx.beginPath();
      ctx.ellipse(x, y + 2, UFO_W / 2, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      // Underbelly stripe (slightly lighter rim)
      ctx.fillStyle = u.hitFlash > 0 ? '#fff' : '#3a3a3a';
      ctx.fillRect(Math.floor(x - UFO_W / 2 + 1), Math.floor(y + 1), UFO_W - 2, 1);
      // Dome — dark teal so it pops against blue sky without glowing
      ctx.fillStyle = u.hitFlash > 0 ? '#fff' : '#1d3a55';
      ctx.beginPath();
      ctx.arc(x, y + 1, 5, Math.PI, 0);
      ctx.fill();
      // Dome highlight
      ctx.fillStyle = u.hitFlash > 0 ? '#fff' : '#3b6f9c';
      ctx.fillRect(Math.floor(x - 2), Math.floor(y - 3), 1, 1);
      // Underside lights
      const tt = (windT * 0.15) | 0;
      const cols = ['#ffe040', '#ff4060', '#40e0ff'];
      const lightYs = Math.floor(y + 4);
      [-7, -2, 3, 8].forEach((dx, i) => {
        ctx.fillStyle = cols[(tt + i) % cols.length];
        ctx.fillRect(Math.floor(x + dx), lightYs, 1, 1);
      });
      // HP bar — only while alive
      if (u.state === 'alive') {
        const hpW = UFO_W;
        const hpx = Math.floor(x - hpW / 2);
        const hpy = Math.floor(y - 8);
        ctx.fillStyle = '#000';
        ctx.fillRect(hpx - 1, hpy - 1, hpW + 2, 3);
        ctx.fillStyle = u.hp > u.maxHp * 0.5 ? '#3ad14a'
                       : u.hp > u.maxHp * 0.2 ? '#e0c020'
                       : '#d03030';
        ctx.fillRect(hpx, hpy, Math.round((u.hp / u.maxHp) * hpW), 1);
      }
      ctx.restore();
    }
  }
  function renderLasers() {
    for (const L of lasers) {
      const sp = Math.hypot(L.vx, L.vy) || 1;
      const ux = L.vx / sp, uy = L.vy / sp;
      const hx = Math.floor(L.x), hy = Math.floor(L.y);
      // Dark halo so the bolt reads on a bright sky
      ctx.fillStyle = '#3a0000';
      ctx.fillRect(hx - 1, hy - 1, 4, 4);
      // Trail (darker red further back)
      ctx.fillStyle = '#a01818';
      ctx.fillRect(Math.floor(L.x - ux * 4), Math.floor(L.y - uy * 4), 2, 2);
      ctx.fillStyle = '#e02020';
      ctx.fillRect(Math.floor(L.x - ux * 2), Math.floor(L.y - uy * 2), 2, 2);
      // Bright head
      ctx.fillStyle = '#ffd0d0';
      ctx.fillRect(hx, hy, 2, 2);
    }
  }

  spawnClouds();

  // Score / run tracking
  let gameStartMs = Date.now();
  let finalElapsedMs = null;   // frozen value at the moment the player died
  let hits = 0;                // shots landed on enemy ships
  function survivedMs() {
    return finalElapsedMs !== null ? finalElapsedMs : (Date.now() - gameStartMs);
  }
  function survivedString() {
    const total = Math.floor(survivedMs() / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function currentScore() {
    return Math.floor(survivedMs() / 100) + hits * 50;
  }

  // Boot
  generateTerrain();
  spawnTrees();
  resetWaves();

  const TIME_SCALE = 0.6; // <1 = slower world; render still runs every frame
  const SLOWMO_SCALE = 0.15;
  let tickAccum = 0;
  function loop() {
    updateSlowmoEnergy();
    tickAccum += slowmoActive() ? SLOWMO_SCALE : TIME_SCALE;
    while (tickAccum >= 1) {
      tickAccum -= 1;
      const wpn = WEAPONS[weapon];
      if (firingHeld && wpn.auto && !player.dead) {
        if (fireCooldown <= 0) { wpn.fire(); fireCooldown = wpn.interval; }
        else fireCooldown--;
      } else if (fireCooldown > 0) {
        fireCooldown--;
      }
      windT++;
      updateClouds(windNow());
      updateTrees();
      updateChunks();
      updatePlayer();
      updateBullets();
      updateRockets();
      updateGrenades();
      updateUfos();
      updateLasers();
      updatePacks();
      // Rare random aid drop — roughly once every ~25s on average.
      if (!player.dead && Math.random() < 0.0007 && packs.length < 4) {
        spawnPack(20 + Math.random() * (W - 40));
      }
      updateBloods();
      updateFlashes();
    }
    render();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
