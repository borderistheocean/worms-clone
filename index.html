<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Worms PoC</title>
<style>
  html, body { margin: 0; height: 100%; width: 100%; background: #111; overflow: hidden;
    font-family: monospace; color: #ddd; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
  #wrap { position: relative;
    width:  min(92vw, calc(92vh * 16 / 9));
    height: min(92vh, calc(92vw * 9 / 16)); }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges;
    width: 100%; height: 100%; background: #000; display: block;
    box-shadow: 0 0 20px #000; cursor: none; }
  #hud { margin-top: 8px; text-align: center; font-size: 12px;
    color: #ddd; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="270"></canvas>
</div>
<div id="hud">Press [1] or [2] on the screen to choose your control scheme</div>
<script>
(() => {
  const W = 480, H = 270;
  const WORLD_W = 960;
  let cameraX = 0;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let controlMode = null;
  let contraAimAngle = 0;

  function updateHudText() {
    const hud = document.getElementById('hud');
    if (!hud) return;
    if (controlMode === 'contra') {
      hud.textContent = "A/D Run • W/S/Diagonals Aim (Steers Missiles) • K Jump • J Shoot • L Grenade • C Duck • U/I Weapon • Shift Slo-Mo • P Pause";
    } else {
      hud.textContent = "A/D or ←/→ Move • S/↓ Duck • W/Space Jump • Left-click Shoot • Right-click/Shift Slo-mo • Scroll/Q Weapon • P Pause";
    }
  }

  let grid = new Uint8Array(WORLD_W * H);
  const terrainCanvas = document.createElement('canvas');
  terrainCanvas.width = WORLD_W; terrainCanvas.height = H;
  const tctx = terrainCanvas.getContext('2d');
  const terrainImg = tctx.createImageData(WORLD_W, H);
  let terrainDirty = true;
  const fxCanvas = document.createElement('canvas');
  fxCanvas.width = WORLD_W; fxCanvas.height = H;
  const fxctx = fxCanvas.getContext('2d');

  const COL_DIRT     = [120, 72, 40, 255];
  const COL_DIRT2    = [96,  56, 28, 255];
  const COL_GRASS    = [70, 170, 60, 255];
  const COL_GRASS_DK = [40, 110, 40, 255];
  const COL_SKY      = [0, 0, 0, 0];

  function idx(x, y) { return y * WORLD_W + x; }
  function inBounds(x, y) { return x >= 0 && x < WORLD_W && y >= 0 && y < H; }
  function solid(x, y) {
    if (x < 0 || x >= WORLD_W) return true;
    if (y >= H) return true;
    if (y < 0) return false;
    return grid[idx(x, y)] === 1;
  }

  function generateTerrain() {
    grid.fill(0);
    const baseY = H * 0.55;
    const seedA = Math.random() * 1000;
    const seedB = Math.random() * 1000;
    const seedC = Math.random() * 1000;
    for (let x = 0; x < WORLD_W; x++) {
      const h = baseY
        + Math.sin((x + seedA) * 0.012) * 40
        + Math.sin((x + seedB) * 0.035) * 15
        + Math.sin((x + seedC) * 0.08)  * 6;
      const top = Math.max(20, Math.min(H - 1, Math.floor(h)));
      for (let y = top; y < H; y++) grid[idx(x, y)] = 1;
    }
    const caves = [];
    for (let i = 0; i < 6; i++) {
      const cx = 60 + Math.random() * (WORLD_W - 120);
      const cy = baseY + 20 + Math.random() * 60;
      const r  = 12 + Math.random() * 20;
      carveCircle(cx, cy, r, false);
      caves.push({ x: cx, y: cy });
    }
    terrainDirty = true;
    return caves;
  }

  function carveCircle(cx, cy, r, runIsolation = true) {
    const r2 = r * r;
    const x0 = Math.max(0, Math.floor(cx - r));
    const x1 = Math.min(WORLD_W - 1, Math.ceil(cx + r));
    const y0 = Math.max(0, Math.floor(cy - r));
    const y1 = Math.min(H - 1, Math.ceil(cy + r));
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = x - cx, dy = y - cy;
        if (dx*dx + dy*dy <= r2) grid[idx(x, y)] = 0;
      }
    }
    for (let i = casings.length - 1; i >= 0; i--) {
      const c = casings[i];
      if (c.landed) {
        const cdx = c.x - cx, cdy = c.y - cy;
        if (cdx * cdx + cdy * cdy <= r2) {
          casings.splice(i, 1);
        }
      }
    }
    terrainDirty = true;
    if (runIsolation) detachFloatingChunks();
  }

  const chunks = [];
  const MAX_CHUNK_PIXELS = 200;

  function detachFloatingChunks() {
    const visited = new Uint8Array(WORLD_W * H);
    const stack = [];
    for (let x = 0; x < WORLD_W; x++) {
      const i = idx(x, H - 1);
      if (grid[i] === 1) { visited[i] = 1; stack.push(x, H - 1); }
    }
    while (stack.length) {
      const y = stack.pop();
      const x = stack.pop();
      if (x > 0) {
        const i = idx(x-1, y);
        if (!visited[i] && grid[i] === 1) { visited[i] = 1; stack.push(x-1, y); }
      }
      if (x < WORLD_W-1) {
        const i = idx(x+1, y);
        if (!visited[i] && grid[i] === 1) { visited[i] = 1; stack.push(x+1, y); }
      }
      if (y > 0) {
        const i = idx(x, y-1);
        if (!visited[i] && grid[i] === 1) { visited[i] = 1; stack.push(x, y-1); }
      }
      if (y < H-1) {
        const i = idx(x, y+1);
        if (!visited[i] && grid[i] === 1) { visited[i] = 1; stack.push(x, y+1); }
      }
    }
    const claimed = new Uint8Array(WORLD_W * H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < WORLD_W; x++) {
        const i = idx(x, y);
        if (grid[i] !== 1 || visited[i] || claimed[i]) continue;
        const compPixels = [];
        let minX = x, minY = y;
        const st = [x, y];
        claimed[i] = 1;
        while (st.length) {
          const py = st.pop(), px = st.pop();
          compPixels.push(px, py);
          if (px < minX) minX = px;
          if (py < minY) minY = py;
          const neigh = [[px-1,py],[px+1,py],[px,py-1],[px,py+1]];
          for (const [nx, ny] of neigh) {
            if (nx < 0 || nx >= WORLD_W || ny < 0 || ny >= H) continue;
            const ni = idx(nx, ny);
            if (grid[ni] === 1 && !visited[ni] && !claimed[ni]) {
              claimed[ni] = 1; st.push(nx, ny);
            }
          }
        }
        const pixelCount = compPixels.length / 2;
        if (pixelCount > MAX_CHUNK_PIXELS) continue;
        const heavy = pixelCount > MAX_CHUNK_PIXELS / 2;
        const pixels = new Int16Array(compPixels.length);
        for (let k = 0; k < compPixels.length; k += 2) {
          const gx = compPixels[k], gy = compPixels[k+1];
          pixels[k]   = gx - minX;
          pixels[k+1] = gy - minY;
          grid[idx(gx, gy)] = 0;
        }
        chunks.push({ pixels, x: minX, y: minY, vy: 0, heavy });
        terrainDirty = true;
      }
    }
  }

  function chunkCollides(chunk, ox, oy) {
    const p = chunk.pixels;
    for (let k = 0; k < p.length; k += 2) {
      const gx = ox + p[k], gy = oy + p[k+1];
      if (gy >= H) return true;
      if (gx < 0 || gx >= WORLD_W) return true;
      if (gy >= 0 && grid[idx(gx, gy)] === 1) return true;
    }
    return false;
  }

  function stampChunk(chunk) {
    const p = chunk.pixels;
    const colData = new Map();
    for (let k = 0; k < p.length; k += 2) {
      const gx = chunk.x + p[k];
      if (gx < 0 || gx >= WORLD_W) continue;
      const relY = p[k+1];
      const existing = colData.get(gx);
      if (existing) {
        existing.count++;
        if (relY > existing.maxRelY) existing.maxRelY = relY;
      } else {
        colData.set(gx, { count: 1, maxRelY: relY });
      }
    }
    for (const [gx, data] of colData) {
      const startY = chunk.y + data.maxRelY + 1;
      let groundTop = H;
      for (let y = Math.max(0, startY); y < H; y++) {
        if (grid[idx(gx, y)] === 1) { groundTop = y; break; }
      }
      const stampCount = chunk.heavy ? Math.max(1, Math.floor(data.count * 0.25)) : data.count;
      for (let i = 1; i <= stampCount; i++) {
        const ny = groundTop - i;
        if (ny >= 0 && ny < H) grid[idx(gx, ny)] = 1;
      }
    }
    terrainDirty = true;
  }

  function updateChunks() {
    for (let i = chunks.length - 1; i >= 0; i--) {
      const c = chunks[i];
      c.vy += 0.35;
      if (c.vy > 6) c.vy = 6;
      let remaining = c.vy;
      while (remaining > 0) {
        if (chunkCollides(c, c.x, c.y + 1)) {
          stampChunk(c);
          chunks.splice(i, 1);
          detachFloatingChunks();
          break;
        }
        c.y += 1;
        remaining -= 1;
      }
    }
  }

  const casings = [];
  function spawnCasing(x, y, facing) {
    casings.push({
      x,
      y,
      vx: -facing * (0.8 + Math.random() * 1.3) + (Math.random() - 0.5) * 0.3,
      vy: -1.2 - Math.random() * 1.1,
      angle: Math.random() * Math.PI * 2,
      angVel: (Math.random() - 0.5) * 0.45,
      landed: false,
    });
  }

  function updateCasings() {
    for (let i = casings.length - 1; i >= 0; i--) {
      const c = casings[i];
      if (c.landed) {
        const gx = Math.floor(c.x), gy = Math.floor(c.y);
        if (gx < 0 || gx >= WORLD_W || gy >= H || grid[idx(gx, gy)] !== 1) {
          casings.splice(i, 1);
        }
        continue;
      }

      c.vy += 0.18;
      if (c.vy > 5) c.vy = 5;
      c.vx *= 0.99;
      c.angle += c.angVel;

      const steps = Math.max(1, Math.ceil(Math.max(Math.abs(c.vx), Math.abs(c.vy))));
      for (let s = 0; s < steps; s++) {
        c.x += c.vx / steps;
        c.y += c.vy / steps;
        const gx = Math.floor(c.x), gy = Math.floor(c.y);
        if (gx < 0 || gx >= WORLD_W || gy >= H) {
          casings.splice(i, 1);
          break;
        }
        if (gy >= 0 && grid[idx(gx, gy)] === 1) {
          if (Math.abs(c.vy) > 0.8) {
            c.vy = -c.vy * 0.35;
            c.vx *= 0.6;
            c.angVel = (Math.random() - 0.5) * 0.2;
          } else {
            c.landed = true;
            c.vx = 0;
            c.vy = 0;
            c.angVel = 0;
            break;
          }
        }
      }
    }
  }

  function renderCasings() {
    for (const c of casings) {
      ctx.save();
      ctx.translate(Math.floor(c.x), Math.floor(c.y));
      ctx.rotate(c.angle);
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(-1, 0, 2, 1);
      ctx.fillStyle = '#b8860b';
      ctx.fillRect(0, 0, 1, 1);
      ctx.restore();
    }
  }

  const MAX_HP = 100;
  let playerHitFlash = 0;
  let introTimer = 240;
  let paused = false;
  let waveBannerText = '';
  let waveBannerTime = 0;
  let dayProgress = 0;
  let hitStopFrames = 0;
  let lastTapLeft = 0, lastTapRight = 0;
  const DASH_WINDOW_MS = 250;
  const DASH_COOLDOWN = 90;
  const DASH_IMPULSE = 4.0;
  let dashCooldown = 0;
  const player = {
    x: W / 2, y: 20,
    w: 6, h: 10,
    vx: 0, vy: 0,
    onGround: false,
    facing: 1,
    hp: MAX_HP,
    dead: false,
    deathTimer: 0,
    walkPhase: 0,
    jumpCharge: 0,
    breathT: 0,
    ducking: false,
    cooking: false,
    cookTime: 0,
  };
  const GRENADE_FUSE = 120;
  const STAND_H = 10;
  const DUCK_H  = 6;
  const JUMP_CHARGE_FRAMES = 6;

  function playerCollidesAt(px, py) {
    const x0 = Math.floor(px - player.w / 2);
    const x1 = Math.floor(px + player.w / 2 - 0.001);
    const y0 = Math.floor(py - player.h);
    const y1 = Math.floor(py - 0.001);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (solid(x, y)) return true;
      }
    }
    return false;
  }

  function updatePlayer() {
    if (player.dead) {
      player.vy += 0.18;
      if (player.vy > 5) player.vy = 5;
      let my = player.vy;
      const ydir = my > 0 ? 1 : -1;
      let ysteps = Math.ceil(Math.abs(my));
      for (let s = 0; s < ysteps; s++) {
        const tryY = player.y + ydir;
        if (!playerCollidesAt(player.x, tryY)) player.y = tryY;
        else { player.vy = 0; break; }
      }
      if (player.deathTimer === 0) {
        for (let k = 0; k < 70; k++) {
          const ang = Math.random() * Math.PI * 2;
          const sp = 1.2 + Math.random() * 2.8;
          bloods.push({
            x: player.x + (Math.random() - 0.5) * player.h,
            y: player.y - player.h / 2 + (Math.random() - 0.5) * 4,
            vx: Math.cos(ang) * sp,
            vy: Math.sin(ang) * sp - 1.2,
            life: 90 + (Math.random() * 60) | 0,
            green: false,
          });
        }
        const py = Math.floor(player.y);
        for (let dx = -4; dx <= 4; dx++) {
          const tx = Math.floor(player.x) + dx;
          if (tx < 0 || tx >= WORLD_W) continue;
          for (let y = py; y < Math.min(H, py + 2); y++) {
            if (grid[idx(tx, y)] === 1) {
              tctx.fillStyle = '#a01020';
              tctx.fillRect(tx, y, 1, 1);
              break;
            }
          }
        }
      }
      player.deathTimer++;
      const bleedRate = player.deathTimer < 90 ? 3 : 15;
      if ((player.deathTimer % bleedRate) === 0) {
        bloods.push({
          x: player.x + (Math.random() - 0.5) * player.h,
          y: player.y - 1,
          vx: (Math.random() - 0.5) * 0.6,
          vy: 0.3 + Math.random() * 0.6,
          life: 90,
          green: false,
        });
      }
      return;
    }

    if (controlMode === 'contra') {
      let aimX = 0, aimY = 0;
      if (keys['arrowleft']  || keys['a']) aimX -= 1;
      if (keys['arrowright'] || keys['d']) aimX += 1;
      if (keys['arrowup']    || keys['w']) aimY -= 1;
      if (keys['arrowdown']  || keys['s']) aimY += 1;

      if (aimX === 0 && aimY === 0) {
        aimX = player.facing;
      } else if (aimX !== 0) {
        player.facing = aimX;
      }
      contraAimAngle = Math.atan2(aimY, aimX);
      const aimDist = 120;
      mouseX = player.x + Math.cos(contraAimAngle) * aimDist;
      mouseY = (player.y - player.h / 2) + Math.sin(contraAimAngle) * aimDist;
    } else {
      player.facing = (mouseX >= player.x) ? 1 : -1;
    }

    player.breathT++;
    const wantDuck = (controlMode === 'contra' ? keys['c'] : (keys['s'] || keys['arrowdown'])) && player.onGround;
    if (wantDuck) {
      player.h = DUCK_H;
      player.ducking = true;
    } else if (player.ducking) {
      player.h = STAND_H;
      if (playerCollidesAt(player.x, player.y)) {
        player.h = DUCK_H;
      } else {
        player.ducking = false;
      }
    }

    let ax = 0;
    if (keys['arrowleft'] || keys['a']) ax -= 1;
    if (keys['arrowright'] || keys['d']) ax += 1;
    if (player.jumpCharge > 0) ax = 0;

    const moveBoost = slowmoActive() ? 2.2 : 1;
    player.vx = ax * (player.ducking ? 0.45 : 0.7) * moveBoost;
    if (ax !== 0 && player.onGround) player.walkPhase++;
    else player.walkPhase = 0;

    player.vy += 0.18;
    if (player.vy > 5) player.vy = 5;

    let mx = player.vx;
    const stepDir = mx > 0 ? 1 : -1;
    let steps = Math.ceil(Math.abs(mx));
    for (let s = 0; s < steps; s++) {
      const tryX = player.x + stepDir;
      if (!playerCollidesAt(tryX, player.y)) {
        player.x = tryX;
      } else {
        let climbed = false;
        for (let up = 1; up <= 4; up++) {
          if (!playerCollidesAt(tryX, player.y - up)) {
            player.x = tryX;
            player.y -= up;
            climbed = true;
            break;
          }
        }
        if (!climbed) { player.vx = 0; break; }
      }
    }

    let my = player.vy;
    const ydir = my > 0 ? 1 : -1;
    let ysteps = Math.ceil(Math.abs(my));
    player.onGround = false;
    for (let s = 0; s < ysteps; s++) {
      const tryY = player.y + ydir;
      if (!playerCollidesAt(player.x, tryY)) {
        player.y = tryY;
      } else {
        if (ydir > 0) player.onGround = true;
        player.vy = 0;
        break;
      }
    }

    if (player.cooking) {
      player.cookTime++;
      if (player.cookTime >= GRENADE_FUSE) {
        throwGrenade(0.2, 1);
        player.cooking = false;
        player.cookTime = 0;
      }
    }

    if (jumpQueued > 0 && player.onGround && !player.ducking && player.jumpCharge === 0) {
      player.jumpCharge = JUMP_CHARGE_FRAMES;
      jumpQueued = 0;
    } else if (jumpQueued > 0) {
      jumpQueued--;
    }
    if (player.jumpCharge > 0 && player.onGround) {
      player.jumpCharge--;
      if (player.jumpCharge === 0) {
        player.vy = -2.8;
        player.onGround = false;
      }
    } else if (!player.onGround) {
      player.jumpCharge = 0;
    }

    if (player.y > H + 50) {
      player.x = W / 2; player.y = 20; player.vx = 0; player.vy = 0;
    }
  }

  function updateCamera() {
    const targetX = Math.max(0, Math.min(WORLD_W - W, player.x - W / 2));
    cameraX = targetX;
    if (controlMode !== 'contra' && typeof mouseScreenX === 'number') {
      mouseX = mouseScreenX + cameraX;
    }
  }

  function renderTerrain() {
    const d = terrainImg.data;
    for (let i = 0; i < d.length; i += 4) {
      d[i] = 0; d[i+1] = 0; d[i+2] = 0; d[i+3] = 0;
    }
    for (let x = 0; x < WORLD_W; x++) {
      let topY = -1;
      for (let y = 0; y < H; y++) {
        if (grid[idx(x, y)] === 1) { topY = y; break; }
      }
      if (topY < 0) continue;
      for (let y = topY; y < H; y++) {
        if (grid[idx(x, y)] !== 1) continue;
        const di = (y * WORLD_W + x) * 4;
        let col;
        const depth = y - topY;
        if (depth === 0)        col = COL_GRASS;
        else if (depth === 1)   col = COL_GRASS;
        else if (depth === 2)   col = COL_GRASS_DK;
        else if ((x + y) & 1)   col = COL_DIRT;
        else                    col = COL_DIRT2;
        d[di]   = col[0];
        d[di+1] = col[1];
        d[di+2] = col[2];
        d[di+3] = col[3];
      }
    }
    for (let x = 0; x < WORLD_W; x++) {
      for (let y = 0; y < H; y++) {
        if (grid[idx(x, y)] !== 1) continue;
        const di = (y * WORLD_W + x) * 4;
        if (d[di+1] > 160 && d[di] < 100) continue;
        const hasAir = (x > 0   && grid[idx(x-1, y)] !== 1) ||
                       (x < WORLD_W-1 && grid[idx(x+1, y)] !== 1) ||
                       (y > 0   && grid[idx(x, y-1)] !== 1) ||
                       (y < H-1 && grid[idx(x, y+1)] !== 1);
        if (hasAir) {
          d[di]   = COL_DIRT2[0];
          d[di+1] = COL_DIRT2[1];
          d[di+2] = COL_DIRT2[2];
        }
      }
    }
    tctx.putImageData(terrainImg, 0, 0);
    terrainDirty = false;
  }

  /* ----------------------------------------------------
     GROUND ALIEN ENEMIES (COMPACT HITBOX & WIDE TUNNELING)
  ---------------------------------------------------- */
  const groundAliens = [];
  const alienGibs = [];

  function alienCollidesAt(x, y, w, h) {
    const x0 = Math.floor(x - w / 2);
    const x1 = Math.floor(x + w / 2 - 0.001);
    const y0 = Math.floor(y - h);
    const y1 = Math.floor(y - 0.001);
    for (let py = y0; py <= y1; py++) {
      for (let px = x0; px <= x1; px++) {
        if (solid(px, py)) return true;
      }
    }
    return false;
  }

  function groundAlienAt(x, y) {
    for (const a of groundAliens) {
      if (a.dead) continue;
      if (Math.abs(x - a.x) <= a.w / 2 + 1.5 && y <= a.y && y >= a.y - a.h - 1.5) return a;
    }
    return null;
  }

  function spawnGroundAlien(x, y, vx = 0, vy = 0, hp = 12) {
    let startY = y;
    if (startY === undefined) {
      const top = groundTopAt(Math.floor(x));
      startY = top >= 0 ? top : 20;
    }
    const facing = vx !== 0 ? Math.sign(vx) : (Math.random() < 0.5 ? 1 : -1);
    groundAliens.push({
      x,
      y: startY,
      w: 5,
      h: 7,
      vx,
      vy,
      facing,
      aimAngle: facing > 0 ? 0 : Math.PI,
      hp,
      maxHp: hp,
      shootCd: 40 + ((Math.random() * 60) | 0),
      digCd: 0,
      patrolTimer: 60 + ((Math.random() * 90) | 0),
      walkPhase: 0,
      jumpCharge: 0,
      breathT: Math.random() * 100,
      onGround: false,
      hitFlash: 0,
      dead: false,
    });
  }

  function findFirstTerrainHit(x0, y0, x1, y1) {
    const dist = Math.hypot(x1 - x0, y1 - y0);
    const steps = Math.ceil(dist / 2);
    for (let s = 1; s <= steps; s++) {
      const px = Math.floor(x0 + (x1 - x0) * (s / steps));
      const py = Math.floor(y0 + (y1 - y0) * (s / steps));
      if (solid(px, py)) return { x: px, y: py };
    }
    return null;
  }

  function hasLineOfSight(x0, y0, x1, y1) {
    return findFirstTerrainHit(x0, y0, x1, y1) === null;
  }

  function spawnAlienGibs(a, impactVx = 0, impactVy = -1) {
    const parts = [
      { type: 'head',   w: 4, h: 3, ox: 0,  oy: -6 },
      { type: 'body',   w: 5, h: 4, ox: 0,  oy: -3 },
      { type: 'cannon', w: 4, h: 2, ox: a.facing * 2, oy: -4 },
      { type: 'legL',   w: 1, h: 3, ox: -1.5, oy: -1 },
      { type: 'legR',   w: 1, h: 3, ox: 1.5,  oy: -1 },
    ];
    for (const p of parts) {
      const spreadX = (Math.random() - 0.5) * 2.5;
      const spreadY = -Math.random() * 2.2 - 0.5;
      alienGibs.push({
        type: p.type,
        x: a.x + p.ox,
        y: a.y + p.oy,
        w: p.w,
        h: p.h,
        vx: impactVx * 0.4 + spreadX,
        vy: impactVy * 0.4 + spreadY,
        angle: Math.random() * Math.PI * 2,
        angVel: (Math.random() - 0.5) * 0.35,
        landed: false,
        facing: a.facing,
      });
    }
  }

  function damageGroundAlien(a, dmg, knockX, knockY) {
    if (a.dead) return;
    a.hp -= dmg;
    a.hitFlash = 6;
    hits++;
    if (knockX !== undefined) a.vx += knockX;
    if (knockY !== undefined) a.vy += knockY;

    for (let k = 0; k < 12; k++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 1.2 + Math.random() * 2.8;
      bloods.push({
        x: a.x + (Math.random() - 0.5) * 3,
        y: a.y - a.h / 2 + (Math.random() - 0.5) * 3,
        vx: Math.cos(ang) * sp + (knockX || 0) * 0.2,
        vy: Math.sin(ang) * sp - 0.8,
        life: 60 + (Math.random() * 40) | 0,
        green: true,
      });
    }

    if (a.hp <= 0) {
      a.dead = true;
      killCount++;
      hitStopFrames = Math.max(hitStopFrames, 2);
      flashes.push({ x: a.x, y: a.y - a.h / 2, r: 10, maxLife: 10, life: 10, color: '#a0e040', explosion: true });

      for (let k = 0; k < 55; k++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 1.2 + Math.random() * 3.8;
        bloods.push({
          x: a.x + (Math.random() - 0.5) * 4,
          y: a.y - a.h / 2 + (Math.random() - 0.5) * 3,
          vx: Math.cos(ang) * sp + (knockX || 0) * 0.3,
          vy: Math.sin(ang) * sp - 1.8,
          life: 90 + (Math.random() * 70) | 0,
          green: true,
        });
      }

      spawnAlienGibs(a, knockX || 0, knockY || -1);

      // Dead aliens drop health packs
      spawnPack(a.x, 'health', a.y - a.h / 2);

      if (!DEBUG && nextDropIndex < WEAPON_DROPS.length && killCount >= WEAPON_DROPS[nextDropIndex].kill) {
        spawnPack(a.x + (Math.random() - 0.5) * 15, WEAPON_DROPS[nextDropIndex].kind, a.y - a.h / 2);
        nextDropIndex++;
      }
    }
  }

  function updateAlienGibs() {
    for (let i = alienGibs.length - 1; i >= 0; i--) {
      const g = alienGibs[i];
      if (g.landed) {
        const gx = Math.floor(g.x), gy = Math.floor(g.y);
        if (gx >= 0 && gx < WORLD_W && gy < H && grid[idx(gx, gy)] !== 1) {
          g.landed = false;
        }
        continue;
      }

      g.vy += 0.2;
      if (g.vy > 5) g.vy = 5;
      g.vx *= 0.985;
      g.angle += g.angVel;

      const steps = Math.max(1, Math.ceil(Math.max(Math.abs(g.vx), Math.abs(g.vy))));
      for (let s = 0; s < steps; s++) {
        g.x += g.vx / steps;
        g.y += g.vy / steps;
        const gx = Math.floor(g.x), gy = Math.floor(g.y);
        if (gx < 0 || gx >= WORLD_W || gy >= H) {
          if (gy >= H) { g.y = H - 1; g.landed = true; }
          break;
        }
        if (gy >= 0 && grid[idx(gx, gy)] === 1) {
          if (Math.abs(g.vy) > 1.0) {
            g.vy = -g.vy * 0.35;
            g.vx *= 0.6;
            g.angVel = (Math.random() - 0.5) * 0.25;
          } else {
            g.landed = true;
            g.vx = 0; g.vy = 0; g.angVel = 0;
            break;
          }
        }
      }
    }
  }

  function renderAlienGibs() {
    for (const g of alienGibs) {
      ctx.save();
      ctx.translate(Math.floor(g.x), Math.floor(g.y));
      ctx.rotate(g.angle);

      if (g.type === 'head') {
        ctx.fillStyle = '#0a200d'; ctx.fillRect(-2, -1.5, 4, 3);
        ctx.fillStyle = '#1d5a22'; ctx.fillRect(-1.5, -1.5, 3, 2);
        ctx.fillStyle = '#ff2a30'; ctx.fillRect(g.facing > 0 ? 1 : -1.5, -1, 1, 1);
      } else if (g.type === 'body') {
        ctx.fillStyle = '#08170b'; ctx.fillRect(-2.5, -2, 5, 4);
        ctx.fillStyle = '#2ea034'; ctx.fillRect(-2, -1.5, 4, 3);
        ctx.fillStyle = '#144018'; ctx.fillRect(-2, 0, 4, 1);
      } else if (g.type === 'cannon') {
        ctx.fillStyle = '#0d2810'; ctx.fillRect(-2, -1, 4, 2);
        ctx.fillStyle = '#80ff40'; ctx.fillRect(1, -0.5, 1, 1);
      } else {
        ctx.fillStyle = '#0f3314'; ctx.fillRect(-0.5, -1.5, 1, 3);
        ctx.fillStyle = '#80ff40'; ctx.fillRect(-0.5, 1.5, 1, 1);
      }

      ctx.restore();
    }
  }

  function ejectCrewFromUfo(u) {
    const crewCount = 1 + (Math.random() < 0.45 ? 1 : 0);
    for (let c = 0; c < crewCount; c++) {
      const ejectSpeed = 1.6 + Math.random() * 1.5;
      const angle = -Math.PI * 0.5 + (Math.random() - 0.5) * 1.2;
      const vx = Math.cos(angle) * ejectSpeed + (u.vx || 0) * 0.4;
      const vy = Math.sin(angle) * ejectSpeed - 1.5;
      spawnGroundAlien(u.x + (Math.random() - 0.5) * 8, u.y, vx, vy, 12 + waveIndex * 2);
      
      for (let k = 0; k < 5; k++) {
        flashes.push({
          x: u.x + (Math.random() - 0.5) * 6,
          y: u.y + (Math.random() - 0.5) * 6,
          r: 2 + Math.random(),
          maxLife: 10,
          life: 10,
          color: '#80ff40',
        });
      }
    }
  }

  function updateGroundAliens() {
    const pcx = player.x, pcy = player.y - player.h / 2;

    for (let i = groundAliens.length - 1; i >= 0; i--) {
      const a = groundAliens[i];
      if (a.dead) {
        groundAliens.splice(i, 1);
        continue;
      }
      if (a.hitFlash > 0) a.hitFlash--;
      if (a.digCd > 0) a.digCd--;
      a.breathT++;

      const acy = a.y - a.h / 2;
      const dx = pcx - a.x;
      const dy = pcy - acy;
      const distToPlayer = Math.hypot(dx, dy);

      let moveDir = 0;
      let wantJump = false;
      const playerAware = !player.dead && distToPlayer < 280;
      const canSeePlayer = playerAware && hasLineOfSight(a.x, acy, pcx, pcy);

      if (playerAware) {
        a.aimAngle = Math.atan2(dy, dx);
        a.facing = dx >= 0 ? 1 : -1;

        if (canSeePlayer) {
          if (distToPlayer > 80) moveDir = a.facing;
          else if (distToPlayer < 35) moveDir = -a.facing;

          a.shootCd--;
          if (a.shootCd <= 0) {
            const spd = 2.5;
            const cosA = Math.cos(a.aimAngle);
            const sinA = Math.sin(a.aimAngle);
            const muzzleX = a.x + cosA * 6;
            const muzzleY = acy + sinA * 6;

            lasers.push({
              x: muzzleX,
              y: muzzleY,
              vx: cosA * spd,
              vy: sinA * spd,
              life: 200,
              green: true,
            });
            flashes.push({
              x: muzzleX,
              y: muzzleY,
              r: 2.5, maxLife: 5, life: 5,
              color: '#80ff40',
            });
            a.shootCd = 60 + ((Math.random() * 45) | 0);
          }
        } else {
          moveDir = a.facing;

          if (a.digCd <= 0) {
            const hit = findFirstTerrainHit(a.x, acy, pcx, pcy);
            if (hit) {
              const digDist = Math.hypot(hit.x - a.x, hit.y - acy);
              if (digDist < 80) {
                const hx = hit.x, hy = hit.y;
                carveCircle(hx, hy, 10, true);
                flashes.push({ x: hx, y: hy, r: 8, maxLife: 7, life: 7, color: '#90ff40' });
                addShake(0.04);
                a.digCd = 20 + ((Math.random() * 16) | 0);

                const cosA = Math.cos(a.aimAngle);
                const sinA = Math.sin(a.aimAngle);
                flashes.push({
                  x: a.x + cosA * 6,
                  y: acy + sinA * 6,
                  r: 3, maxLife: 4, life: 4,
                  color: '#80ff40'
                });
              }
            }
          }
        }
      } else {
        a.patrolTimer--;
        if (a.patrolTimer <= 0) {
          a.facing = Math.random() < 0.5 ? 1 : -1;
          a.patrolTimer = 90 + ((Math.random() * 120) | 0);
        }
        moveDir = a.facing;
        a.aimAngle = a.facing > 0 ? 0 : Math.PI;
      }

      const checkFrontX = a.x + a.facing * 5;
      const frontBlocked = alienCollidesAt(checkFrontX, a.y, a.w, a.h);
      if (moveDir !== 0 && a.onGround) {
        if (frontBlocked) {
          wantJump = true;
          if (playerAware && a.digCd <= 0) {
            const digX = a.x + a.facing * 7;
            const digY = a.y - a.h / 2;
            carveCircle(digX, digY, 11, true);
            flashes.push({ x: digX, y: digY, r: 9, maxLife: 6, life: 6, color: '#80ff40' });
            addShake(0.05);
            a.digCd = 16;
          }
        }
        const frontGroundY = groundTopAt(Math.floor(checkFrontX));
        if (frontGroundY > a.y + 12 || frontGroundY < 0) {
          wantJump = true;
        }
      }

      if (wantJump && a.onGround && a.jumpCharge === 0) {
        a.jumpCharge = 4;
      }
      if (a.jumpCharge > 0 && a.onGround) {
        a.jumpCharge--;
        if (a.jumpCharge === 0) {
          a.vy = -2.8;
          a.onGround = false;
        }
      }

      const targetVx = moveDir * 0.5;
      a.vx = a.vx * 0.8 + targetVx * 0.2;

      if (Math.abs(a.vx) > 0.1 && a.onGround) a.walkPhase++;
      else if (a.onGround) a.walkPhase = 0;

      a.vy += 0.18;
      if (a.vy > 5) a.vy = 5;

      let mx = a.vx;
      const stepDir = mx > 0 ? 1 : -1;
      let steps = Math.ceil(Math.abs(mx));
      for (let s = 0; s < steps; s++) {
        const tryX = a.x + stepDir;
        if (!alienCollidesAt(tryX, a.y, a.w, a.h)) {
          a.x = tryX;
        } else {
          let climbed = false;
          for (let up = 1; up <= 4; up++) {
            if (!alienCollidesAt(tryX, a.y - up, a.w, a.h)) {
              a.x = tryX;
              a.y -= up;
              climbed = true;
              break;
            }
          }
          if (!climbed) {
            a.vx = 0;
            if (!playerAware) {
              a.facing = -a.facing;
              a.patrolTimer = 80;
            }
            break;
          }
        }
      }

      let my = a.vy;
      const ydir = my > 0 ? 1 : -1;
      let ysteps = Math.ceil(Math.abs(my));
      a.onGround = false;
      for (let s = 0; s < ysteps; s++) {
        const tryY = a.y + ydir;
        if (!alienCollidesAt(a.x, tryY, a.w, a.h)) {
          a.y = tryY;
        } else {
          if (ydir > 0) a.onGround = true;
          a.vy = 0;
          break;
        }
      }

      if (a.y > H + 40) {
        groundAliens.splice(i, 1);
        continue;
      }
      if (a.x < 10) { a.x = 10; a.facing = 1; }
      if (a.x > WORLD_W - 10) { a.x = WORLD_W - 10; a.facing = -1; }
    }
  }

  function renderGroundAliens() {
    for (const a of groundAliens) {
      const flash = a.hitFlash > 0;
      const crouched = a.jumpCharge > 0;
      const squish = crouched ? 1 : 0;
      const calm = !crouched && a.onGround;
      const breathCycle = Math.sin(a.breathT * 0.08);
      const breathBob = calm && breathCycle > 0.5 ? 1 : 0;
      const walking = a.walkPhase > 0 && a.onGround && !crouched;
      const walkBob = walking && (((a.walkPhase >> 2) % 4) === 1) ? -1 : 0;

      const ax = Math.floor(a.x - a.w / 2);
      const ay = Math.floor(a.y - a.h) + squish + breathBob + walkBob;

      ctx.fillStyle = flash ? '#fff' : '#0a200d';
      ctx.fillRect(ax - 1, ay - 1, a.w + 2, 4);
      ctx.fillStyle = flash ? '#fff' : '#1d5a22';
      ctx.fillRect(ax, ay, a.w, 3);

      const bodyTop = ay + 3;
      const bodyBottom = Math.floor(a.y) - 2;
      const bodyH = Math.max(1, bodyBottom - bodyTop);

      ctx.fillStyle = flash ? '#fff' : '#08170b';
      ctx.fillRect(ax - 1, bodyTop - 1, a.w + 2, bodyH + 2);
      ctx.fillStyle = flash ? '#fff' : '#2ea034';
      ctx.fillRect(ax, bodyTop, a.w, bodyH);

      ctx.fillStyle = flash ? '#fff' : '#144018';
      for (let r = 0; r < bodyH; r += 2) {
        ctx.fillRect(ax + 1, bodyTop + r, a.w - 2, 1);
      }

      const eyeX = a.facing > 0 ? ax + a.w - 2 : ax + 1;
      const blink = Math.sin(a.breathT * 0.05) > 0.96;
      if (!blink) {
        ctx.fillStyle = flash ? '#fff' : '#ff2a30';
        ctx.fillRect(eyeX, ay + 1, 1, 1);
      } else {
        ctx.fillStyle = '#0a200d';
        ctx.fillRect(eyeX, ay + 1, 1, 1);
      }

      const shoulderX = a.x;
      const shoulderY = bodyTop + 1;
      const drilling = a.digCd > 10;

      ctx.save();
      ctx.translate(shoulderX, shoulderY);
      ctx.rotate(a.aimAngle);
      if (Math.cos(a.aimAngle) < 0) {
        ctx.scale(1, -1);
      }
      ctx.fillStyle = flash ? '#fff' : (drilling ? '#185020' : '#0d2810');
      ctx.fillRect(0, -1.5, 5, 2.5);
      ctx.fillStyle = flash ? '#fff' : (drilling ? '#c0ff60' : '#80ff40');
      ctx.fillRect(3, -0.5, 2, 1.5);
      ctx.restore();

      ctx.fillStyle = flash ? '#fff' : '#0f3314';
      const legY = bodyBottom;
      const baseBottom = Math.floor(a.y);
      const legLeftX  = ax + 1;
      const legRightX = ax + a.w - 2;

      function alienLegFootY(col, top) {
        if (!a.onGround) return baseBottom;
        if (col < 0 || col >= WORLD_W) return baseBottom;
        const minY = top + 1;
        const maxY = baseBottom + 3;
        for (let yy = minY; yy <= maxY; yy++) {
          if (yy >= H) return yy;
          if (yy >= 0 && grid[idx(col, yy)] === 1) return yy;
        }
        return baseBottom;
      }

      function drawAlienLeg(col, top) {
        const foot = alienLegFootY(col, top);
        const h = Math.max(1, foot - top);
        ctx.fillRect(col, top, 1, h);
        ctx.fillStyle = flash ? '#fff' : '#80ff40';
        ctx.fillRect(col + a.facing, top + h - 1, 1, 1);
        ctx.fillStyle = flash ? '#fff' : '#0f3314';
      }

      if (crouched) {
        drawAlienLeg(legLeftX,  legY + 1);
        drawAlienLeg(legRightX, legY + 1);
      } else if (!a.onGround) {
        ctx.fillRect(legLeftX,  legY + 1, 1, 2);
        ctx.fillRect(legRightX, legY + 1, 1, 2);
      } else if (Math.abs(a.vx) > 0.05) {
        const phase = (a.walkPhase >> 2) & 1;
        const frontDX = a.facing;
        const backDX  = -a.facing;
        if (phase === 0) {
          drawAlienLeg(legLeftX  + frontDX, legY);
          drawAlienLeg(legRightX + backDX,  legY + 1);
        } else {
          drawAlienLeg(legLeftX  + backDX,  legY + 1);
          drawAlienLeg(legRightX + frontDX, legY);
        }
      } else {
        drawAlienLeg(legLeftX,  legY);
        drawAlienLeg(legRightX, legY);
      }

      if (a.hp < a.maxHp) {
        const hpW = a.w + 3;
        const hpx = Math.floor(a.x - hpW / 2);
        const hpy = ay - 4;
        ctx.fillStyle = '#000';
        ctx.fillRect(hpx - 1, hpy - 1, hpW + 2, 3);
        ctx.fillStyle = '#40ff50';
        ctx.fillRect(hpx, hpy, Math.round((a.hp / a.maxHp) * hpW), 1);
      }
    }
  }

  function render() {
    if (!controlMode) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 20px monospace';
      ctx.fillStyle = '#000';
      ctx.fillText("TRY 'N' SURVIVE", W / 2 + 1, H / 2 - 49);
      ctx.fillStyle = '#ffe060';
      ctx.fillText("TRY 'N' SURVIVE", W / 2, H / 2 - 50);

      ctx.font = 'bold 13px monospace';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('SELECT CONTROLS', W / 2, H / 2 - 18);

      ctx.font = '9px monospace';
      ctx.fillStyle = '#80d0ff';
      ctx.fillText('[ 1 ]  MOUSE AIM  (WASD Move + Mouse Shoot/Aim)', W / 2, H / 2 + 10);
      ctx.fillStyle = '#ff9040';
      ctx.fillText('[ 2 ]  CONTRA ARCADE  (WASD 8-Way Aim • J Shoot • K Jump)', W / 2, H / 2 + 28);

      ctx.font = '8px monospace';
      ctx.fillStyle = '#888';
      ctx.fillText('Press 1 or 2 to start playing', W / 2, H / 2 + 58);
      ctx.textAlign = 'start';
      ctx.textBaseline = 'alphabetic';
      return;
    }

    const SHAKE_MAX = 1.2;
    const s = shakeTrauma * shakeTrauma;
    const shakeX = (Math.random() * 2 - 1) * SHAKE_MAX * s;
    const shakeY = (Math.random() * 2 - 1) * SHAKE_MAX * s;
    const scale = 1 + 0.01 * s;
    ctx.setTransform(scale, 0, 0, scale,
      shakeX - (scale - 1) * (W / 2),
      shakeY - (scale - 1) * (H / 2));

    const dayTarget = Math.min(1, waveIndex / 8);
    dayProgress += (dayTarget - dayProgress) * 0.005;
    const dayT = dayProgress;
    const skyR = Math.round(135 * (1 - dayT) + 12 * dayT);
    const skyG = Math.round(206 * (1 - dayT) + 10 * dayT);
    const skyB = Math.round(235 * (1 - dayT) + 28 * dayT);
    const purpleT = Math.sin(dayT * Math.PI);
    const sr = Math.min(255, Math.round(skyR + purpleT * 40));
    const sg = Math.max(0,   Math.round(skyG - purpleT * 50));
    const sb = Math.round(skyB * (1 - purpleT * 0.15) + purpleT * 30);
    const br = Math.max(0, Math.round(sr * 0.75));
    const bg = Math.max(0, Math.round(sg * 0.65));
    const bb = Math.max(0, Math.round(sb * 0.8));
    const grad = ctx.createLinearGradient(0, -SHAKE_MAX, 0, H + SHAKE_MAX);
    if (slowmoActive()) {
      grad.addColorStop(0,   `rgba(${sr},${sg},${sb},0.25)`);
      grad.addColorStop(0.85, `rgba(${sr},${sg},${sb},0.25)`);
      grad.addColorStop(1,   `rgba(${br},${bg},${bb},0.25)`);
    } else {
      grad.addColorStop(0,   `rgb(${sr},${sg},${sb})`);
      grad.addColorStop(0.85, `rgb(${sr},${sg},${sb})`);
      grad.addColorStop(1,   `rgb(${br},${bg},${bb})`);
    }
    ctx.fillStyle = grad;
    ctx.fillRect(-SHAKE_MAX, -SHAKE_MAX, W + SHAKE_MAX * 2, H + SHAKE_MAX * 2);

    if (dayT > 0.15) {
      const starAlpha = Math.min(1, (dayT - 0.15) / 0.25);
      ctx.fillStyle = `rgba(255,255,255,${starAlpha.toFixed(2)})`;
      let seed = 12345;
      for (let i = 0; i < 80; i++) {
        seed = (seed * 16807 + 7) % 2147483647;
        const sx = (seed % W);
        seed = (seed * 16807 + 7) % 2147483647;
        const sy = (seed % Math.floor(H * 0.55));
        seed = (seed * 16807 + 7) % 2147483647;
        const sz = (seed % 3 === 0) ? 2 : 1;
        ctx.fillRect(sx, sy, sz, sz);
      }
    }

    const sunY = 40 + dayT * 100;
    const sunOrange = dayT;
    const sunRc = Math.round(255 * (1 - sunOrange) + 255 * sunOrange);
    const sunGc = Math.round(247 * (1 - sunOrange) + 140 * sunOrange);
    const sunBc = Math.round(204 * (1 - sunOrange) + 30 * sunOrange);
    const sunAlpha = Math.max(0, 1 - Math.max(0, (dayT - 0.7) / 0.3));
    if (sunAlpha > 0) {
      ctx.globalAlpha = sunAlpha;
      ctx.strokeStyle = `rgb(${Math.round(sunRc*0.85)},${Math.round(sunGc*0.75)},${Math.round(sunBc*0.5)})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(W - 50, sunY, 18, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = `rgb(${sunRc},${sunGc},${sunBc})`;
      ctx.beginPath(); ctx.arc(W - 50, sunY, 18, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1;
      ctx.globalAlpha = 1;
    }

    renderClouds();

    if (terrainDirty) renderTerrain();

    ctx.save();
    ctx.translate(-cameraX, 0);

    for (const f of flashes) {
      if (!f.explosion) continue;
      const t = f.life / f.maxLife;
      ctx.globalAlpha = t;
      ctx.fillStyle = f.color;
      ctx.beginPath();

      const walking = player.walkPhase > 0 && player.onGround && !crouched;

      const px = Math.floor(player.x - player.w / 2);

        if (!player.onGround) return baseBottom;

        }

      function drawLeg(col, top) {

    if (!player.dead && player.cooking) {

      ctx.strokeStyle = '#cc3030';

    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    for (const g of grenades) {

    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';

    if (!player.dead && !player.cooking) {
      const gx0 = player.x;
      const gy0 = player.y - player.h / 2;
      const adx = mouseX - gx0, ady = mouseY - gy0;
      const ang = Math.atan2(ady, adx);
      const recoilT = Math.min(1, fireShakeRamp / FIRE_RAMP_TICKS);
      const jitterAmt = recoilT * 0.4;

      const jr = (Math.random() * 2 - 1) * recoilT * 0.04;
      ctx.save();
      ctx.translate(gx0 + jx, gy0 + jy);
      ctx.rotate(ang + jr);
      if (adx < 0) ctx.scale(1, -1);
      if (weapon === 'pistol') {
        ctx.fillStyle = '#444'; ctx.fillRect(0, -1, 5, 2);
        ctx.fillStyle = '#222'; ctx.fillRect(1, 0, 2, 3);
      } else if (weapon === 'mg') {
        ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0, -1, 9, 2);
        ctx.fillStyle = '#555'; ctx.fillRect(7, -2, 2, 1);
        ctx.fillStyle = '#222'; ctx.fillRect(2, 1, 3, 3);
      } else if (weapon === 'bazooka') {
        ctx.fillStyle = '#3a2a1a'; ctx.fillRect(-1, -1, 8, 3);
        ctx.fillStyle = '#5a3a20'; ctx.fillRect(6, -2, 2, 4);
        ctx.fillStyle = '#222'; ctx.fillRect(1, 2, 2, 2);
      } else if (weapon === 'laser') {
        ctx.fillStyle = '#1a1a22'; ctx.fillRect(0, -1, 7, 2);
        ctx.fillStyle = '#5a0010'; ctx.fillRect(6, -2, 2, 4);

        ctx.fillStyle = '#ffd820'; ctx.fillRect(7, -2, 2, 1); ctx.fillRect(7, 1, 2, 1);

        ctx.fillStyle = '#ff8020'; ctx.fillRect(7, -3, 2, 1); ctx.fillRect(7, 0, 2, 1); ctx.fillRect(7, 3, 2, 1);

        ctx.fillStyle = '#555'; ctx.fillRect(0, -2, 8, 1); ctx.fillRect(0, 0, 8, 1); ctx.fillRect(0, 2, 8, 1);
        ctx.fillStyle = '#222'; ctx.fillRect(1, 4, 4, 3);
      } else if (weapon === 'bluelaser') {

        ctx.fillStyle = '#40a0ff'; ctx.fillRect(8, -2, 2, 4);

        ctx.fillStyle = '#3a3a5a'; ctx.fillRect(0, -3, 4, 1);
        ctx.fillStyle = '#222'; ctx.fillRect(2, 2, 3, 3);

    }
    ctx.restore();

    if (controlMode !== 'contra') {
      const mx = Math.floor(mouseX - cameraX), my = Math.floor(mouseY);
      ctx.lineWidth = 1;

        ctx.fillStyle = '#fff'; ctx.fillRect(mx, my, 1, 1);
      } else if (weapon === 'dualmg') {
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 5, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 4, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.fillRect(mx - 1, my, 1, 1); ctx.fillRect(mx + 1, my, 1, 1);
      } else if (weapon === 'bazooka') {
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 7, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,140,50,0.9)'; ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 6, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#ff8c32'; ctx.fillRect(mx, my, 1, 1);

        ctx.moveTo(mx + 0.5, my - 5); ctx.lineTo(mx + 5, my + 0.5); ctx.lineTo(mx + 0.5, my + 6); ctx.lineTo(mx - 4, my + 0.5); ctx.closePath(); ctx.stroke();

      } else if (weapon === 'builder') {
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.strokeRect(mx - 3, my - 3, 7, 7);
        ctx.strokeStyle = 'rgba(202,160,112,0.9)'; ctx.strokeRect(mx - 2, my - 2, 5, 5);
      } else if (weapon === 'triplemg') {
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 6, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,128,32,0.9)'; ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 5, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#ff8020'; ctx.fillRect(mx - 1, my, 1, 1); ctx.fillRect(mx, my, 1, 1); ctx.fillRect(mx + 1, my, 1, 1);

        ctx.strokeStyle = 'rgba(255,48,48,0.9)'; ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 6, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#ff3030'; ctx.fillRect(mx - 1, my - 1, 1, 1); ctx.fillRect(mx + 1, my - 1, 1, 1); ctx.fillRect(mx - 1, my + 1, 1, 1); ctx.fillRect(mx + 1, my + 1, 1, 1);

        ctx.strokeStyle = 'rgba(64,160,255,0.9)'; ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 7, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(64,160,255,0.6)'; ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 4, 0, Math.PI * 2); ctx.stroke();

    if (weapon === 'builder' && !player.dead) {

      ctx.textBaseline = 'alphabetic';

    if (slowmoActive()) {
      const guiding = guidedRocket !== null;
      if (guiding) {
        ctx.fillStyle = 'rgba(20,180,40,0.12)'; ctx.fillRect(0, 0, W, H);
        const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
        vg.addColorStop(0, 'rgba(0,40,0,0)'); vg.addColorStop(1, 'rgba(0,40,0,0.5)');
        ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

        const flashAlpha = 0.4 + 0.6 * Math.sin(windT * 0.5);
        ctx.save();
        ctx.translate(-cameraX, 0);

          const dist = Math.floor(Math.hypot(u.x - guidedRocket.x, u.y - guidedRocket.y));

          const ty = Math.floor(u.y + hh) + 2;
          ctx.fillStyle = '#000'; ctx.fillText(dist + 'm', tx + 1, ty + 1);

          ctx.strokeStyle = '#40ff50'; ctx.lineWidth = 1;
          drawTargetBox(a.x, a.y - a.h / 2, hw, hh, 2);
          ctx.globalAlpha = 1;
          const dist = Math.floor(Math.hypot(a.x - guidedRocket.x, a.y - guidedRocket.y));
          const tx = Math.floor(a.x);

  const WEAPONS = {

  function slowmoActive() {

  function updateSlowmoEnergy() {
    const now = Date.now();
    const dt = now - slowmoLastMs;
    slowmoLastMs = now;

    if (slowmoActive()) {
      slowmoEnergy = Math.max(0, slowmoEnergy - dt);
      if (slowmoEnergy === 0) slowmoLocked = true;
    } else {
      slowmoEnergy = Math.min(SLOWMO_MAX_MS, slowmoEnergy + dt * (SLOWMO_MAX_MS / SLOWMO_RECHARGE_MS));

  function addShake(amount) {

  function addFireShake(amount) {
    const t = Math.min(1, fireShakeRamp / FIRE_RAMP_TICKS);

  function fireBullet() {
    const muzzleX = player.x;
    const muzzleY = player.y - player.h / 2;
    const dx = mouseX - muzzleX;
    const dy = mouseY - muzzleY;
    const len = Math.hypot(dx, dy) || 1;
    const speed = 4.5;
    bullets.push({
      x: muzzleX,
      y: muzzleY,
      vx: (dx / len) * speed,
      vy: (dy / len) * speed,
      life: 120,
    });
    flashes.push({
      x: muzzleX + (dx / len) * 7,
      y: muzzleY + (dy / len) * 7,
      r: 3, maxLife: 4, life: 4,
      color: '#ffe066',

    spawnCasing(muzzleX, muzzleY, dx >= 0 ? 1 : -1);
    addFireShake(0.15);

  function fillCircle(cx, cy, r) {
    const r2 = r * r;
    const x0 = Math.max(0, Math.floor(cx - r));
    const x1 = Math.min(WORLD_W - 1, Math.ceil(cx + r));
    const y0 = Math.max(0, Math.floor(cy - r));
    const y1 = Math.min(H - 1, Math.ceil(cy + r));
    const pad = 1;
    const pxL = Math.floor(player.x - player.w / 2) - pad;
    const pxR = Math.floor(player.x + player.w / 2) + pad;
    const pyT = Math.floor(player.y - player.h) - pad;
    const pyB = Math.floor(player.y) + pad;
    const candidates = [];
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy > r2) continue;
        if (grid[idx(x, y)] !== 0) continue;
        if (!player.dead && x >= pxL && x <= pxR && y >= pyT && y <= pyB) continue;
        candidates.push(x, y);
      }
    }
    let changed = true;
    while (changed) {
      changed = false;
      for (let k = candidates.length - 2; k >= 0; k -= 2) {
        const x = candidates[k], y = candidates[k + 1];
        if (grid[idx(x, y)] === 1) continue;
        if ((x > 0     && grid[idx(x - 1, y)] === 1) ||
            (x < WORLD_W - 1 && grid[idx(x + 1, y)] === 1) ||
            (y > 0     && grid[idx(x, y - 1)] === 1) ||
            (y < H - 1 && grid[idx(x, y + 1)] === 1)) {
          grid[idx(x, y)] = 1;
          changed = true;
        }
      }
    }
    terrainDirty = true;
  }

  function bisectUfo(u, beamX, beamY, beamUx, beamUy) {
    const idx2 = ufos.indexOf(u);

  function fillBlock(cx, cy, half) {
    const x0 = Math.max(0, Math.floor(cx - half));
    const x1 = Math.min(WORLD_W - 1, Math.floor(cx + half));
    const y0 = Math.max(0, Math.floor(cy - half));
    const y1 = Math.min(H - 1, Math.floor(cy + half));
    const pad = 1;
    const pxL = Math.floor(player.x - player.w / 2) - pad;
    const pxR = Math.floor(player.x + player.w / 2) + pad;
    const pyT = Math.floor(player.y - player.h) - pad;
    const pyB = Math.floor(player.y) + pad;
    const candidates = [];
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (grid[idx(x, y)] !== 0) continue;
        if (!player.dead && x >= pxL && x <= pxR && y >= pyT && y <= pyB) continue;
        candidates.push(x, y);
      }
    }
    let changed = true;
    while (changed) {
      changed = false;
      for (let k = candidates.length - 2; k >= 0; k -= 2) {
        const x = candidates[k], y = candidates[k + 1];
        if (grid[idx(x, y)] === 1) continue;
        if ((x > 0     && grid[idx(x - 1, y)] === 1) ||
            (x < WORLD_W - 1 && grid[idx(x + 1, y)] === 1) ||
            (y > 0     && grid[idx(x, y - 1)] === 1) ||
            (y < H - 1 && grid[idx(x, y + 1)] === 1)) {
          grid[idx(x, y)] = 1;
          changed = true;
        }
      }
    }
    terrainDirty = true;
  }

  const BUILDER_MAX_MS = 3500;

  let builderLastMs = Date.now();

  function builderHeldNow() {
    return firingHeld && weapon === 'builder' && !player.dead && !paused && !builderLocked;
  }

  function updateBuilderEnergy() {
    const now = Date.now();
    const dt = now - builderLastMs;
    builderLastMs = now;
    if (builderHeldNow() && builderEnergy > 0) {
      builderEnergy = Math.max(0, builderEnergy - dt);
      if (builderEnergy === 0) builderLocked = true;
    } else {
      builderEnergy = Math.min(BUILDER_MAX_MS,
        builderEnergy + dt * (BUILDER_MAX_MS / BUILDER_RECHARGE_MS));
      if (builderLocked && builderEnergy >= BUILDER_MAX_MS * BUILDER_RELOCK_FRAC) {
        builderLocked = false;
      }
    }
  }

  const bloods = [];

    for (let i = bloods.length - 1; i >= 0; i--) {
      const b = bloods[i];
      b.vy += 0.18;
      if (b.vy > 5) b.vy = 5;
      b.vx *= 0.995;
      const steps = Math.max(1, Math.ceil(Math.max(Math.abs(b.vx), Math.abs(b.vy))));
      let dead = false;
      for (let s = 0; s < steps; s++) {
        const nx = b.x + b.vx / steps;
        const ny = b.y + b.vy / steps;
        const gx = Math.floor(nx), gy = Math.floor(ny);
        if (gx < 0 || gx >= WORLD_W || gy >= H) { dead = true; break; }
        if (gy >= 0 && grid[idx(gx, gy)] === 1) {
          const px = Math.floor(b.x), py = Math.floor(b.y);
          if (inBounds(px, py)) {
            tctx.fillStyle = b.green ? '#20a010' : '#a01020';
            tctx.fillRect(px, py, 1, 1);
          }
          dead = true; break;
        }
        b.x = nx; b.y = ny;
      }
      b.life--;
      if (dead || b.life <= 0) bloods.splice(i, 1);
