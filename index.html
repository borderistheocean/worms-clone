  function explode(x, y, craterR, blastR, maxDmg, shake) {
    carveCircle(x, y, craterR, true);
    flashes.push({ x, y, r: craterR * 0.65, maxLife: 14, life: 14, color: '#fff2a8', explosion: true });
    flashes.push({ x, y, r: craterR * 0.82, maxLife: 18, life: 18, color: '#ff8a3a', explosion: true });
    addShake(shake * 0.3);
    explodeAffectBalls(x, y, blastR);

    // Damage player
    const pcx = player.x, pcy = player.y - player.h / 2;
    const ddx = pcx - x, ddy = pcy - y;
    const dist = Math.hypot(ddx, ddy);
    if (dist < blastR && !player.dead) {
      const intensity = 1 - dist / blastR;
      const dmg = Math.round(maxDmg * intensity * intensity + 5 * intensity);
      player.hp = Math.max(0, player.hp - dmg);
      playerHitFlash = Math.min(1, playerHitFlash + 0.4 + intensity * 0.4);
      const knock = Math.hypot(ddx, ddy) || 1;
      player.vx += (ddx / knock) * (1.0 + intensity * 1.8);
      player.vy -= 0.4 + intensity * 1.2;
      if (player.hp === 0) { player.dead = true; player.deathTimer = 0; if (finalElapsedMs === null) finalElapsedMs = Date.now() - gameStartMs; }
      const count = 14 + Math.floor(intensity * 26);
      for (let k = 0; k < count; k++) {
        const ang = Math.atan2(ddy || (Math.random() - 0.5), ddx || (Math.random() - 0.5)) + (Math.random() - 0.5) * 1.4;
        const speed = 1 + Math.random() * 3 + intensity * 1.5;
        bloods.push({
          x: pcx + (Math.random() - 0.5) * 2,
          y: pcy + (Math.random() - 0.5) * 4,
          vx: Math.cos(ang) * speed,
          vy: Math.sin(ang) * speed - Math.random() * 1.5,
          life: 60 + (Math.random() * 40) | 0,
          green: false,
        });
      }
    }

    // Damage Ground Aliens
    for (const a of groundAliens) {
      if (a.dead) continue;
      const adx = a.x - x;
      const ady = (a.y - a.h / 2) - y;
      const adist = Math.hypot(adx, ady);
      if (adist < blastR) {
        const intensity = 1 - adist / blastR;
        const dmg = Math.round(maxDmg * intensity * 0.8 + 2);
        const knock = adist || 1;
        damageGroundAlien(a, dmg, (adx / knock) * (2 + intensity * 3), -1.5 - intensity * 2);
      }
    }

    // Affect severed alien gibs
    for (const g of alienGibs) {
      const gdx = g.x - x, gdy = g.y - y;
      const gdist = Math.hypot(gdx, gdy);
      if (gdist < blastR) {
        const intensity = 1 - gdist / blastR;
        const gLen = gdist || 1;
        g.vx += (gdx / gLen) * (2 + intensity * 4);
        g.vy -= 1 + intensity * 3;
        g.angVel += (Math.random() - 0.5) * 0.5;
        g.landed = false;
      }
    }

    for (let i = packs.length - 1; i >= 0; i--) {
      const p = packs[i];
      if (p.kind !== 'health') continue;
      const pdist = Math.hypot(p.x - x, p.y - y);
      if (pdist < blastR) {
        for (let k = 0; k < 6; k++) {
          flashes.push({
            x: p.x + (Math.random() - 0.5) * 4,
            y: p.y + (Math.random() - 0.5) * 4,
            r: 1 + Math.random(), maxLife: 10, life: 10,
            color: '#90ff90',
          });
        }
        packs.splice(i, 1);
      }
    }
    const detonateQueue = [];
    for (let i = lasers.length - 1; i >= 0; i--) {
      const L = lasers[i];
      const ldist = Math.hypot(L.x - x, L.y - y);
      if (ldist < blastR) {
        detonateQueue.push({ x: L.x, y: L.y });
        lasers.splice(i, 1);
      }
    }
    for (const det of detonateQueue) {
      explode(det.x, det.y, 8, 25, 20, 0.1);
    }
  }

  const rockets = [];
  let guidedRocket = null;
  function fireRocket() {
    const mx0 = player.x;
    const my0 = player.y - player.h / 2;
    const dx = mouseX - mx0, dy = mouseY - my0;
    const len = Math.hypot(dx, dy) || 1;
    const speed = 3.0;
    const r = {
      x: mx0 + (dx / len) * 7,
      y: my0 + (dy / len) * 7,
      vx: (dx / len) * speed,
      vy: (dy / len) * speed,
      life: 200,
    };
    rockets.push(r);
    guidedRocket = r;
    player.facing = dx >= 0 ? 1 : -1;
    addFireShake(0.1);
  }

  function updateRockets() {
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      if (r === guidedRocket && slowmoActive()) {
        const sp = Math.hypot(r.vx, r.vy) || 1;

        if (controlMode === 'contra') {
          let steerX = 0, steerY = 0;
          if (keys['arrowleft']  || keys['a']) steerX -= 1;
          if (keys['arrowright'] || keys['d']) steerX += 1;
          if (keys['arrowup']    || keys['w']) steerY -= 1;
          if (keys['arrowdown']  || keys['s']) steerY += 1;

          if (steerX !== 0 || steerY !== 0) {
            const targetAngle = Math.atan2(steerY, steerX);
            const currentAngle = Math.atan2(r.vy, r.vx);

            let diff = targetAngle - currentAngle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI)  diff -= Math.PI * 2;

            const turnRate = 0.12;
            const newAngle = currentAngle + Math.sign(diff) * Math.min(Math.abs(diff), turnRate);

            r.vx = Math.cos(newAngle) * sp;
            r.vy = Math.sin(newAngle) * sp;
          }
        } else {
          const targetVx = (mouseX >= r.x ? 1 : -1) * sp;
          r.vx = r.vx * 0.92 + targetVx * 0.08;
          const newSp = Math.hypot(r.vx, r.vy) || 1;
          const scale = sp / newSp;
          r.vx *= scale; r.vy *= scale;
        }

        for (let j = lasers.length - 1; j >= 0; j--) {
          const L = lasers[j];
          if (Math.abs(L.x - r.x) < 4 && Math.abs(L.y - r.y) < 4) {
            flashes.push({ x: L.x, y: L.y, r: 3, maxLife: 8, life: 8, color: '#ffd0d0' });
            lasers.splice(j, 1);
          }
        }
      }

      const steps = Math.max(1, Math.ceil(Math.max(Math.abs(r.vx), Math.abs(r.vy))));
      let hit = false;
      for (let s = 0; s < steps; s++) {
        r.x += r.vx / steps;
        r.y += r.vy / steps;
        const gx = Math.floor(r.x), gy = Math.floor(r.y);
        if (gx < 0 || gx >= WORLD_W || gy >= H) { hit = true; break; }
        {
          const a = groundAlienAt(r.x, r.y);
          if (a) {
            damageGroundAlien(a, 35, r.vx * 0.5, -1);
            hit = true; break;
          }
        }
        {
          const u = ufoAt(r.x, r.y);
          if (u) {
            const biteR = 2.0 + Math.random() * 1.5;
            u.bites.push({ lx: r.x - u.x, ly: r.y - u.y, r: biteR });
            for (let k = 0; k < 4 + Math.floor(Math.random() * 3); k++) {
              spawnHullChunk(r.x, r.y, (Math.random() - 0.5) * 2.0, 0.3 + Math.random() * 1.2);
            }
            const rsp = Math.hypot(r.vx, r.vy) || 1;
            const shuntX = (r.vx / rsp) * 1.8;
            const shuntY = (r.vy / rsp) * 0.8;
            damageUfo(u, Math.ceil(u.maxHp * 0.8), shuntX, shuntY);
            hit = true; break;
          }
        }
        if (gy >= 0 && grid[idx(gx, gy)] === 1) { hit = true; break; }
      }
      r.life--;
      if (hit || r.life <= 0) {
        explode(r.x, r.y, 15, 45, 55, 0.25);
        if (r === guidedRocket) guidedRocket = null;
        rockets.splice(i, 1);
      }
    }
  }

  const grenades = [];
  function throwGrenade(power, fuse) {
    const mx0 = player.x;
    const my0 = player.y - player.h / 2;
    const dx = mouseX - mx0, dy = mouseY - my0;
    const len = Math.hypot(dx, dy) || 1;
    grenades.push({
      x: mx0,
      y: my0,
      vx: (dx / len) * power,
      vy: (dy / len) * power - 0.5,
      fuse,
    });
    player.facing = dx >= 0 ? 1 : -1;
  }

  function grenadeSolidAt(gx, gy) {
    if (gx < 0 || gx >= WORLD_W) return true;
    if (gy >= H) return true;
    if (gy < 0) return false;
    return grid[idx(gx, gy)] === 1;
  }

  function updateGrenades() {
    for (let i = grenades.length - 1; i >= 0; i--) {
      const g = grenades[i];
      g.vy += 0.18;
      if (g.vy > 5) g.vy = 5;

      const steps = Math.max(1, Math.ceil(Math.max(Math.abs(g.vx), Math.abs(g.vy))));
      for (let s = 0; s < steps; s++) {
        const nx = g.x + g.vx / steps;
        if (grenadeSolidAt(Math.floor(nx), Math.floor(g.y))) {
          g.vx = -g.vx * 0.5;
        } else {
          g.x = nx;
        }
        const ny = g.y + g.vy / steps;
        if (grenadeSolidAt(Math.floor(g.x), Math.floor(ny))) {
          if (g.vy > 0) g.vy = -g.vy * 0.45;
          else g.vy = -g.vy * 0.5;
          g.vx *= 0.8;
        } else {
          g.y = ny;
        }
      }

      g.fuse--;
      if (g.fuse <= 0) {
        explode(g.x, g.y, 22, 60, 70, 0.28);
        grenades.splice(i, 1);
      }
    }
  }

  const physBalls = [];
  const PHYS_GRAVITY = 0.18;
  const PHYS_RESTITUTION = 0.55;
  const PHYS_FRICTION = 0.985;
  const PHYS_GROUND_FRICTION = 0.88;

  function spawnBall(x, y, r, vx, vy) {
    physBalls.push({
      x, y, r: r || 4,
      vx: vx || 0, vy: vy || 0,
      angle: 0,
      angVel: 0,
      mass: r ? r * r : 16,
    });
  }

  function ballTerrainCollide(ball) {
    const samples = 12;
    let pushX = 0, pushY = 0, contacts = 0;
    for (let i = 0; i < samples; i++) {
      const ang = (i / samples) * Math.PI * 2;
      const sx = Math.floor(ball.x + Math.cos(ang) * ball.r);
      const sy = Math.floor(ball.y + Math.sin(ang) * ball.r);
      if (sx < 0 || sx >= WORLD_W) { pushX -= Math.cos(ang); contacts++; continue; }
      if (sy >= H) { pushY -= Math.sin(ang); contacts++; continue; }
      if (sy >= 0 && grid[idx(sx, sy)] === 1) {
        pushX -= Math.cos(ang);
        pushY -= Math.sin(ang);
        contacts++;
      }
    }
    if (contacts === 0) return null;
    const len = Math.hypot(pushX, pushY) || 1;
    return { nx: pushX / len, ny: pushY / len, contacts };
  }

  function updatePhysBalls() {
    for (const ball of physBalls) {
      ball.vy += PHYS_GRAVITY;
      ball.vx *= PHYS_FRICTION;
      ball.vy *= PHYS_FRICTION;

      const speed = Math.hypot(ball.vx, ball.vy);
      const steps = Math.max(1, Math.ceil(speed / (ball.r * 0.5)));
      for (let s = 0; s < steps; s++) {
        ball.x += ball.vx / steps;
        ball.y += ball.vy / steps;

        const col = ballTerrainCollide(ball);
        if (col) {
          ball.x += col.nx * 0.8;
          ball.y += col.ny * 0.8;
          const vDotN = ball.vx * col.nx + ball.vy * col.ny;
          if (vDotN < 0) {
            ball.vx -= (1 + PHYS_RESTITUTION) * vDotN * col.nx;
            ball.vy -= (1 + PHYS_RESTITUTION) * vDotN * col.ny;
            const tx = -col.ny, ty = col.nx;
            const vDotT = ball.vx * tx + ball.vy * ty;
            ball.vx -= vDotT * (1 - PHYS_GROUND_FRICTION) * tx;
            ball.vy -= vDotT * (1 - PHYS_GROUND_FRICTION) * ty;
            ball.angVel = vDotT / ball.r * 0.3;
          }
        }
      }

      ball.angle += ball.angVel;
      ball.angVel *= 0.98;

      if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx) * PHYS_RESTITUTION; }
      if (ball.x > WORLD_W - ball.r) { ball.x = WORLD_W - ball.r; ball.vx = -Math.abs(ball.vx) * PHYS_RESTITUTION; }
      if (ball.y > H + 50) { ball.y = -10; ball.vy = 0; }
    }

    for (let i = 0; i < physBalls.length; i++) {
      for (let j = i + 1; j < physBalls.length; j++) {
        const a = physBalls[i], b = physBalls[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy);
        const minDist = a.r + b.r;
        if (dist < minDist && dist > 0.01) {
          const overlap = minDist - dist;
          const nx = dx / dist, ny = dy / dist;
          const totalMass = a.mass + b.mass;
          a.x -= nx * overlap * (b.mass / totalMass);
          a.y -= ny * overlap * (b.mass / totalMass);
          b.x += nx * overlap * (a.mass / totalMass);
          b.y += ny * overlap * (a.mass / totalMass);

          const relVx = a.vx - b.vx, relVy = a.vy - b.vy;
          const relVdotN = relVx * nx + relVy * ny;
          if (relVdotN > 0) {
            const impulse = (relVdotN * (1 + PHYS_RESTITUTION)) / totalMass;
            a.vx -= impulse * b.mass * nx;
            a.vy -= impulse * b.mass * ny;
            b.vx += impulse * a.mass * nx;
            b.vy += impulse * a.mass * ny;
            const crossA = (b.x - a.x) * ny - (b.y - a.y) * nx;
            const crossB = (a.x - b.x) * ny - (a.y - b.y) * nx;
            a.angVel += crossA * impulse * 0.1;
            b.angVel += crossB * impulse * 0.1;
          }
        }
      }
    }

    if (!player.dead) {
      const pcx = player.x, pcy = player.y - player.h / 2;
      for (const ball of physBalls) {
        const dx = ball.x - pcx, dy = ball.y - pcy;
        const dist = Math.hypot(dx, dy);
        const minDist = ball.r + player.w / 2;
        if (dist < minDist && dist > 0.01) {
          const nx = dx / dist, ny = dy / dist;
          const overlap = minDist - dist;
          ball.x += nx * overlap * 0.7;
          ball.y += ny * overlap * 0.7;
          const vDotN = ball.vx * nx + ball.vy * ny;
          if (vDotN < 0) {
            ball.vx -= (1 + 0.4) * vDotN * nx;
            ball.vy -= (1 + 0.4) * vDotN * ny;
          }
          player.vx -= nx * 0.3;
        }
      }
    }
  }

  function explodeAffectBalls(ex, ey, blastR) {
    for (const ball of physBalls) {
      const dx = ball.x - ex, dy = ball.y - ey;
      const dist = Math.hypot(dx, dy);
      if (dist < blastR && dist > 0.01) {
        const intensity = 1 - dist / blastR;
        const force = 4 + intensity * 6;
        const nx = dx / dist, ny = dy / dist;
        ball.vx += nx * force;
        ball.vy += ny * force - 2 * intensity;
        ball.angVel += (Math.random() - 0.5) * intensity * 0.5;
      }
    }
  }

  function renderPhysBalls() {
    for (const ball of physBalls) {
      ctx.save();
      ctx.translate(ball.x, ball.y);
      ctx.rotate(ball.angle);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#c04040';
      ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-ball.r * 0.6, 0); ctx.lineTo(ball.r * 0.6, 0); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.arc(-ball.r * 0.3, -ball.r * 0.3, ball.r * 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      const steps = Math.ceil(Math.max(Math.abs(b.vx), Math.abs(b.vy)));
      let hit = false;
      for (let s = 0; s < steps; s++) {
        b.x += b.vx / steps;
        b.y += b.vy / steps;
        const gx = Math.floor(b.x), gy = Math.floor(b.y);
        if (gx < 0 || gx >= WORLD_W || gy >= H) { hit = true; break; }
        {
          let ballHit = false;
          for (const ball of physBalls) {
            const dx = b.x - ball.x, dy = b.y - ball.y;
            if (Math.hypot(dx, dy) < ball.r) {
              const sp = Math.hypot(b.vx, b.vy) || 1;
              ball.vx += (b.vx / sp) * 1.5;
              ball.vy += (b.vy / sp) * 1.5;
              ball.angVel += (Math.random() - 0.5) * 0.3;
              ballHit = true; break;
            }
          }
          if (ballHit) { hit = true; break; }
        }
        {
          const a = groundAlienAt(b.x, b.y);
          if (a) {
            damageGroundAlien(a, 1, b.vx * 0.2, -0.4);
            hit = true; break;
          }
        }
        {
          const u = ufoAt(b.x, b.y);
          if (u) {
            const biteR = 1.0 + Math.random() * 1.0;
            u.bites.push({ lx: b.x - u.x, ly: b.y - u.y, r: biteR });
            const chunkCount = 1 + Math.floor(Math.random() * 3);
            for (let k = 0; k < chunkCount; k++) {
              spawnHullChunk(b.x, b.y, (Math.random() - 0.5) * 1.2, 0.5 + Math.random() * 0.8);
            }
            for (let k = 0; k < 3; k++) {
              const ang = Math.atan2(b.vy, b.vx) + (Math.random() - 0.5) * 1.8;
              flashes.push({
                x: b.x + (Math.random() - 0.5) * 2,
                y: b.y + (Math.random() - 0.5) * 2,
                r: 0.8 + Math.random(),
                maxLife: 6 + ((Math.random() * 6) | 0),
                life: 6 + ((Math.random() * 6) | 0),
                color: Math.random() < 0.5 ? '#888' : '#555',
              });
            }
            if (u.state === 'falling') {
              const bsp = Math.hypot(b.vx, b.vy) || 1;
              u.vx += (b.vx / bsp) * 0.7;
              u.vy += (b.vy / bsp) * 0.4 - 0.15;
              u.spinSpeed += (b.vx / bsp) * 0.04;
            } else {
              damageUfo(u, 1);
            }
            hit = true; break;
          }
        }
        {
          let laserHit = false;
          for (let li = lasers.length - 1; li >= 0; li--) {
            const L = lasers[li];
            if (Math.abs(b.x - L.x) < 3 && Math.abs(b.y - L.y) < 3) {
              const lx = L.x, ly = L.y;
              lasers.splice(li, 1);
              explode(lx, ly, 8, 25, 20, 0.1);
              laserHit = true; break;
            }
          }
          if (laserHit) { hit = true; break; }
        }
        {
          let packHit = false;
          for (let pi = packs.length - 1; pi >= 0; pi--) {
            const p = packs[pi];
            if (p.kind !== 'health') continue;
            if (Math.abs(b.x - p.x) < 4 && Math.abs(b.y - p.y) < 4) {
              for (let k = 0; k < 6; k++) {
                flashes.push({ x: p.x + (Math.random() - 0.5) * 4, y: p.y + (Math.random() - 0.5) * 4,
                  r: 1 + Math.random(), maxLife: 10, life: 10, color: '#90ff90' });
              }
              packs.splice(pi, 1);
              packHit = true; break;
            }
          }
          if (packHit) { hit = true; break; }
        }
        if (gy >= 0 && grid[idx(gx, gy)] === 1) {
          if (b.kind === 'build') {
            fillCircle(gx, gy, 4);
            flashes.push({ x: gx, y: gy, r: 3, maxLife: 6, life: 6, color: '#caa070' });
          } else {
            carveCircle(gx, gy, 7, true);
          }
          hit = true;
          break;
        }
      }
      b.life--;
      if (hit || b.life <= 0) bullets.splice(i, 1);
    }
  }

  function updateWeaponHud() {}

  let windT = 0;
  function windNow() {
    return Math.sin(windT * 0.006) * 1.0 + Math.sin(windT * 0.021) * 0.4;
  }

  const clouds = [];
  function makeCloud(startX) {
    return {
      x: startX,
      y: 8 + Math.random() * 110,
      scale: 0.7 + Math.random() * 0.9,
      speed: 0.04 + Math.random() * 0.06,
    };
  }
  function spawnClouds() {
    clouds.length = 0;
    for (let i = 0; i < 22; i++) clouds.push(makeCloud(Math.random() * (W + 60) - 30));
  }

  const trees = [];
  function spawnTrees() {
    trees.length = 0;
    const count = 12 + ((Math.random() * 6) | 0);
    for (let i = 0; i < count; i++) {
      const tx = Math.floor(20 + Math.random() * (WORLD_W - 40));
      const top = groundTopAt(tx);
      if (top < 0) continue;
      const tcw = 4 + ((Math.random() * 6) | 0);
      trees.push({
        x: tx, rootY: top, vy: 0,
        h:   5 + ((Math.random() * 7) | 0),
        cw:  tcw, ch:  Math.round(tcw * 0.8),
        sway: Math.random() * 6.28,
        falling: false, fallen: false,
        angle: 0, angVel: 0, dir: 1,
      });
    }
  }
  function groundTopAt(x) {
    if (x < 0 || x >= WORLD_W) return -1;
    for (let y = 0; y < H; y++) if (grid[idx(x, y)] === 1) return y;
    return -1;
  }
  const bushes = [];
  const grassBlades = [];
  function spawnBushesAndGrass() {
    bushes.length = 0;
    grassBlades.length = 0;
    for (let i = 0; i < 18; i++) {
      const bx = Math.floor(10 + Math.random() * (WORLD_W - 20));
      const top = groundTopAt(bx);
      if (top < 0) continue;
      bushes.push({
        x: bx, y: top,
        w: 3 + ((Math.random() * 4) | 0),
        h: 2 + ((Math.random() * 3) | 0),
        sway: Math.random() * 6.28,
        dead: false, fadeT: 0,
      });
    }
    for (let i = 0; i < 50; i++) {
      const gx = Math.floor(5 + Math.random() * (WORLD_W - 10));
      const top = groundTopAt(gx);
      if (top < 0) continue;
      grassBlades.push({
        x: gx, y: top,
        h: 2 + ((Math.random() * 3) | 0),
        sway: Math.random() * 6.28,
      });
    }
  }
  function updateBushes() {
    for (let i = bushes.length - 1; i >= 0; i--) {
      const b = bushes[i];
      if (b.dead) {
        b.fadeT++;
        if (b.fadeT > 60) bushes.splice(i, 1);
        continue;
      }
      const top = groundTopAt(b.x);
      if (top < 0 || top > b.y + 4) {
        b.dead = true; b.fadeT = 0;
      } else {
        b.y = top;
      }
    }
  }
  function renderBushes() {
    ctx.fillStyle = '#1a5a22';
    for (const b of bushes) {
      if (b.dead) ctx.globalAlpha = Math.max(0, 1 - b.fadeT / 60);
      for (let y = -b.h - 1; y <= b.h + 1; y++) {
        for (let x = -b.w - 1; x <= b.w + 1; x++) {
          const d = (x * x) / ((b.w+1) * (b.w+1)) + (y * y) / ((b.h+1) * (b.h+1));
          if (d <= 1) ctx.fillRect(b.x + x, b.y + y - 1, 1, 1);
        }
      }
      if (b.dead) ctx.globalAlpha = 1;
    }
    ctx.fillStyle = '#38a848';
    for (const b of bushes) {
      if (b.dead) ctx.globalAlpha = Math.max(0, 1 - b.fadeT / 60);
      for (let y = -b.h; y <= b.h; y++) {
        for (let x = -b.w; x <= b.w; x++) {
          const d = (x * x) / (b.w * b.w) + (y * y) / (b.h * b.h);
          if (d <= 1) ctx.fillRect(b.x + x, b.y + y - 1, 1, 1);
        }
      }
      if (b.dead) ctx.globalAlpha = 1;
    }
  }
  function renderGrassBlades(w) {
    for (const g of grassBlades) {
      const top = groundTopAt(g.x);
      if (top < 0 || top > g.y + 6) continue;
      g.y = top;
      const sw = Math.round(w * 1.8 * Math.sin(windT * 0.05 + g.sway));
      ctx.fillStyle = '#2a7a32';
      for (let i = 0; i < g.h; i++) {
        const dx = Math.round((i / g.h) * sw);
        ctx.fillRect(g.x + dx, g.y - i - 1, 1, 1);
      }
      ctx.fillStyle = '#4cb850';
      ctx.fillRect(g.x + Math.round(sw), g.y - g.h, 1, 1);
    }
  }
  function renderClouds() {
    const grey = Math.round(255 - dayProgress * 140);
    const edgeGrey = Math.max(0, grey - 50);
    for (const c of clouds) {
      const r = 6 * c.scale;
      ctx.beginPath();
      ctx.arc(c.x - r*1.2, c.y + r*0.1, r*0.6,  0, Math.PI * 2);
      ctx.arc(c.x - r*0.5, c.y,         r*0.8,   0, Math.PI * 2);
      ctx.arc(c.x,          c.y,         r,       0, Math.PI * 2);
      ctx.arc(c.x + r,      c.y - r*0.3, r*0.9,  0, Math.PI * 2);
      ctx.arc(c.x + r*1.8,  c.y + r*0.1, r*0.7,  0, Math.PI * 2);
      ctx.arc(c.x + r*2.5,  c.y + r*0.15,r*0.55, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${edgeGrey},${edgeGrey},${edgeGrey},0.6)`;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = `rgba(${grey},${grey},${grey},0.85)`;
      ctx.fill();
    }
  }
  function updateTrees() {
    for (let i = trees.length - 1; i >= 0; i--) {
      const t = trees[i];
      if (t.canopyDetached) {
        if (!t.canopyLanded) {
          t.canopyVy += 0.18;
          if (t.canopyVy > 5) t.canopyVy = 5;
          let groundTop = H;
          for (let x = Math.floor(t.canopyX - t.cw); x <= Math.floor(t.canopyX + t.cw); x++) {
            if (x < 0 || x >= WORLD_W) continue;
            const gt = groundTopAt(x);
            if (gt >= 0 && gt < groundTop) groundTop = gt;
          }
          const nextY = t.canopyY + t.canopyVy;
          if (nextY + t.ch >= groundTop) {
            t.canopyY = groundTop - t.ch;
            t.canopyLanded = true;
            t.canopyVy = 0;
          } else {
            t.canopyY = nextY;
            t.canopyX += t.canopyVx;
          }
          if (t.canopyY > H + 20) t.canopyLanded = true;
        } else {
          t.canopyFadeT = (t.canopyFadeT || 0) + 1;
        }
      }

      if (t.fallen) {
        t.fadeT = (t.fadeT || 0) + 1;
        const trunkGone  = true;
        const canopyGone = !t.canopyDetached || t.canopyFadeT > 90;
        if (trunkGone && canopyGone) trees.splice(i, 1);
        continue;
      }

      const top = groundTopAt(t.x);
      if (top < 0) {
        t.vy += 0.18;
        if (t.vy > 5) t.vy = 5;
        t.rootY += t.vy;
        if (t.rootY > H + 20) { trees.splice(i, 1); continue; }
      } else if (top > t.rootY) {
        t.vy += 0.18;
        if (t.vy > 5) t.vy = 5;
        t.rootY = Math.min(top, t.rootY + t.vy);
        if (t.rootY === top) t.vy = 0;
      } else {
        t.vy = 0;
        t.rootY = top;
      }

      const leftTop  = groundTopAt(t.x - 3);
      const rightTop = groundTopAt(t.x + 3);
      const leftBad  = leftTop  < 0 || leftTop  > t.rootY + 4;
      const rightBad = rightTop < 0 || rightTop > t.rootY + 4;
      if (leftBad || rightBad) {
        let dir;
        if (leftBad && !rightBad) dir = -1;
        else if (rightBad && !leftBad) dir = 1;
        else dir = windNow() >= 0 ? 1 : -1;
        t.fallen = true;
        t.canopyDetached = true;
        t.canopyX = t.x;
        t.canopyY = t.rootY - t.h - t.ch + 1;
        t.canopyVy = -0.5;
        t.canopyVx = dir * 0.3;
        t.canopyLanded = false;
        t.canopyFadeT = 0;
      }
    }
  }

  function updateClouds() {
    const waveSpeed = 1 + waveIndex * 0.15;
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      c.x += c.speed * waveSpeed;
      const span = 30 * c.scale;
      if (c.x - span > W) {
        clouds[i] = makeCloud(-span - Math.random() * 40);
      }
    }
  }

  function renderTrees(w) {
    for (const t of trees) {
      const baseY = t.rootY;
      const sway = t.fallen ? 0 : Math.round(w * 0.6 * Math.sin(windT * 0.025 + t.sway));

      ctx.save();
      ctx.translate(t.x, baseY);
      if (!t.fallen) {
        ctx.fillStyle = '#3a2208';
        for (let i = 0; i < t.h; i++) {
          ctx.fillRect(-1, -i - 2, 4, 3);
        }
        ctx.fillStyle = '#5a3a18';
        for (let i = 0; i < t.h; i++) {
          ctx.fillRect(0,  -i - 1, 1, 1);
          ctx.fillRect(1,  -i - 1, 1, 1);
        }
      }
      ctx.restore();

      let canopyAlpha = 1;
      let cwx = t.x + sway;
      let cwy = baseY - t.h - t.ch + 1;
      if (t.canopyDetached) {
        cwx = t.canopyX;
        cwy = t.canopyY;
        if (t.canopyLanded) {
          canopyAlpha = Math.max(0, 1 - (t.canopyFadeT || 0) / 90);
        }
      }
      if (canopyAlpha <= 0) continue;
      ctx.globalAlpha = canopyAlpha;
      ctx.fillStyle = '#1a5a22';
      for (let y = -t.ch - 1; y <= t.ch + 1; y++) {
        for (let x = -t.cw - 1; x <= t.cw + 1; x++) {
          const d = (x * x) / ((t.cw+1) * (t.cw+1)) + (y * y) / ((t.ch+1) * (t.ch+1));
          if (d <= 1) ctx.fillRect(Math.floor(cwx) + x, Math.floor(cwy) + y, 1, 1);
        }
      }
      ctx.fillStyle = '#2c8a3a';
      for (let y = -t.ch; y <= t.ch; y++) {
        for (let x = -t.cw; x <= t.cw; x++) {
          const d = (x * x) / (t.cw * t.cw) + (y * y) / (t.ch * t.ch);
          if (d <= 1) ctx.fillRect(Math.floor(cwx) + x, Math.floor(cwy) + y, 1, 1);
        }
      }
      ctx.fillStyle = '#4cb050';
      ctx.fillRect(Math.floor(cwx) - 1, Math.floor(cwy) - t.ch + 1, 1, 1);
      ctx.fillRect(Math.floor(cwx) + 1, Math.floor(cwy) - t.ch + 2, 1, 1);
      ctx.globalAlpha = 1;
    }
  }

  const HEAL_AMOUNT = 35;
  const packs = [];
  function spawnPack(x, kind, y) {
    packs.push({
      x: Math.max(8, Math.min(WORLD_W - 8, x | 0)),
      y: y !== undefined ? y : -6,
      vy: y !== undefined ? -1.0 : 0,
      bob: Math.random() * 6.28,
      idle: 0,
      landed: false,
      kind: kind || 'health',
    });
  }
  function packSolidAt(gx, gy) {
    if (gx < 0 || gx >= WORLD_W) return true;
    if (gy >= H) return true;
    if (gy < 0) return false;
    return grid[idx(gx, gy)] === 1;
  }
  function updatePacks() {
    for (let i = packs.length - 1; i >= 0; i--) {
      const p = packs[i];
      if (p.landed && !packSolidAt(Math.floor(p.x), Math.floor(p.y + 2))) {
        p.landed = false;
        p.vy = 0;
      }
      if (!p.landed) {
        p.vy = Math.min(1.1, p.vy + 0.05);
        let remaining = p.vy;
        while (remaining > 0) {
          const step = Math.min(1, remaining);
          if (packSolidAt(Math.floor(p.x), Math.floor(p.y + 2))) {
            p.landed = true;
            p.vy = 0;
            break;
          }
          p.y += step;
          remaining -= step;
        }
      } else {
        p.idle++;
        p.bob += 0.05;
      }
      if (!player.dead) {
        const dx = Math.abs(p.x - player.x);
        const dy = Math.abs(p.y - (player.y - player.h / 2));
        if (dx < 4 && dy < player.h / 2 + 2) {
          if (p.kind.startsWith('weapon-')) {
            const newWeapon = p.kind.replace('weapon-', '');
            const sparkColors = { bazooka: '#ff8a3a', dualmg: '#ffdc40', builder: '#caa070', laser: '#ff2030' };
            const sparkColor = sparkColors[newWeapon] || '#ffdc40';
            if (!unlockedWeapons.has(newWeapon)) { unlockedWeapons.add(newWeapon); weaponOrder.push(newWeapon); }
            flashWeaponPickup(newWeapon);
            for (let k = 0; k < 12; k++) {
              const ang = Math.random() * Math.PI * 2;
              flashes.push({
                x: player.x + Math.cos(ang) * 3,
                y: player.y - player.h / 2 + Math.sin(ang) * 3,
                r: 1.5, maxLife: 16, life: 16,
                color: sparkColor,
              });
            }
          } else {
            if (player.hp >= MAX_HP) continue;
            player.hp = Math.min(MAX_HP, player.hp + HEAL_AMOUNT);
            for (let k = 0; k < 10; k++) {
              const ang = Math.random() * Math.PI * 2;
              flashes.push({
                x: player.x + Math.cos(ang) * 3,
                y: player.y - player.h / 2 + Math.sin(ang) * 3,
                r: 1.5, maxLife: 14, life: 14,
                color: '#9aff90',
              });
            }
          }
          packs.splice(i, 1);
          continue;
        }
      }
      if (p.y > H + 20) packs.splice(i, 1);
    }
  }

  const WEAPON_PACK_LABEL = {
    'weapon-dualmg':  'DUAL MG',
    'weapon-bazooka': 'BAZOOKA',
    'weapon-builder': 'BUILDER',
    'weapon-laser':   'LASER',
  };
  function renderPacks() {
    for (const p of packs) {
      const x = Math.floor(p.x), y = Math.floor(p.y + (p.landed ? Math.sin(p.bob) * 0.5 : 0));
      const label = WEAPON_PACK_LABEL[p.kind];
      if (label) {
        ctx.font = '6px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = '#000'; ctx.fillText(label, x + 1, y - 4);
        ctx.fillStyle = '#ffffff'; ctx.fillText(label, x, y - 5);
        ctx.textAlign = 'start';
        ctx.textBaseline = 'alphabetic';
      }
      if (!p.landed) {
        ctx.fillStyle = '#e0e0e0';
        ctx.fillRect(x - 4, y - 5, 9, 1);
        ctx.fillRect(x - 3, y - 6, 7, 1);
        ctx.fillStyle = '#666';
        ctx.fillRect(x - 3, y - 4, 1, 2);
        ctx.fillRect(x + 3, y - 4, 1, 2);
      }
      ctx.fillStyle = '#000';
      ctx.fillRect(x - 3, y - 2, 7, 5);
      if (p.kind === 'weapon-bazooka') {
        ctx.fillStyle = '#5a3a20'; ctx.fillRect(x - 2, y - 1, 5, 3);
        ctx.fillStyle = '#3a2a1a'; ctx.fillRect(x - 1, y, 3, 1);
        ctx.fillStyle = '#5a3a20'; ctx.fillRect(x + 1, y - 1, 1, 1);
      } else if (p.kind === 'weapon-dualmg') {
        ctx.fillStyle = '#ffd820'; ctx.fillRect(x - 2, y - 1, 5, 3);
        ctx.fillStyle = '#2a2a2a'; ctx.fillRect(x - 1, y - 1, 1, 1);
        ctx.fillRect(x + 1, y - 1, 1, 1); ctx.fillRect(x - 1, y + 1, 3, 1);
      } else if (p.kind === 'weapon-laser') {
        ctx.fillStyle = '#1a1a22'; ctx.fillRect(x - 2, y - 1, 5, 3);
        ctx.fillStyle = '#ff2030'; ctx.fillRect(x, y, 1, 1);
        ctx.fillStyle = '#5a0010'; ctx.fillRect(x - 1, y, 1, 1); ctx.fillRect(x + 1, y, 1, 1);
      } else if (p.kind === 'weapon-builder') {
        ctx.fillStyle = '#caa070'; ctx.fillRect(x - 2, y - 1, 5, 3);
        ctx.fillStyle = '#7a4818'; ctx.fillRect(x - 2, y - 1, 5, 1);
        ctx.fillRect(x - 1, y + 1, 1, 1); ctx.fillRect(x + 1, y + 1, 1, 1);
      } else {
        ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 2, y - 1, 5, 3);
        ctx.fillStyle = '#d02828'; ctx.fillRect(x, y - 1, 1, 3); ctx.fillRect(x - 1, y, 3, 1);
      }
    }
  }

  const UFO_W = 24, UFO_H = 10;
  const UFO_BASE_HP = 6;
  const ufos = [];
  const lasers = [];

  function waveSpec(i) {
    return {
      count: DEBUG ? 1 : 1 + i * 2,
      hpMult: i + 1,
      groundAliens: 1 + Math.floor(i * 1.5)
    };
  }
  let waveIndex = 0;
  let interWaveDelay = 0;

  function spawnWave(count, hpMult, alienCount) {
    waveBannerText = 'WAVE ' + (waveIndex + 1);
    waveBannerTime = 120;
    const yMin = 14, yMax = 96;
    const ySlot = (yMax - yMin) / count;
    const yJitter = ySlot * 0.15;
    const xSlot = (WORLD_W - 40) / count;
    const xOrder = Array.from({ length: count }, (_, i) => i);
    for (let i = xOrder.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [xOrder[i], xOrder[j]] = [xOrder[j], xOrder[i]];
    }
    for (let i = 0; i < count; i++) {
      const maxHp = UFO_BASE_HP * hpMult;
      const baseY = yMin + i * ySlot + (Math.random() * 2 - 1) * yJitter;
      const slot = xOrder[i];
      const x = 20 + slot * xSlot + Math.random() * xSlot;
      const greenChance = Math.min(0.5, 0.05 + waveIndex * 0.05);
      const isGreen = Math.random() < greenChance;
      ufos.push({
        x, y: -10 - i * 8 - Math.random() * 6,
        vx: (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 0.2),
        bob: Math.random() * 6.28,
        bobSpeed: 0.035 + Math.random() * 0.03,
        baseY, hp: maxHp, maxHp,
        cooldown: 60 + ((Math.random() * 120) | 0),
        hitFlash: 0,
        state: 'entering',
        vy: 0,
        bites: [],
        green: isGreen,
      });
    }

    const gCount = alienCount || 1;
    for (let i = 0; i < gCount; i++) {
      const gx = 40 + Math.random() * (WORLD_W - 80);
      spawnGroundAlien(gx, undefined, 0, 0, 12 + waveIndex * 2);
    }
  }

  function resetWaves() {
    ufos.length = 0;
    ufoDebris.length = 0;
    groundAliens.length = 0;
    alienGibs.length = 0;
    waveIndex = 0;
    dayProgress = 0;
    interWaveDelay = 0;
    const w = waveSpec(0);
    spawnWave(w.count, w.hpMult, w.groundAliens);
  }

  function damageUfo(u, dmg, shuntVx, shuntVy) {
    if (u.state !== 'alive' && u.state !== 'entering') return;
    u.hp -= dmg;
    u.hitFlash = 6;
    hits++;
    if (u.hp <= 0) {
      u.hp = 0;
      u.state = 'falling';
      u.vy = 0.5 + Math.random() * 0.5;
      u.spinAngle = 0;
      if (shuntVx !== undefined) {
        u.vx = shuntVx;
        u.spinSpeed = shuntVx * 0.06 + (Math.random() - 0.5) * 0.02;
      } else {
        u.spinSpeed = u.vx * 0.04 + (Math.random() - 0.5) * 0.02;
      }
      if (shuntVy !== undefined) u.vy += shuntVy;
      killCount++;
      hitStopFrames = Math.max(hitStopFrames, 2);
      if (!DEBUG && nextDropIndex < WEAPON_DROPS.length && killCount >= WEAPON_DROPS[nextDropIndex].kill) {
        spawnPack(u.x + (Math.random() - 0.5) * 20, WEAPON_DROPS[nextDropIndex].kind);
        nextDropIndex++;
      }
      ejectCrewFromUfo(u);
      ufoDeathExplosion(u);
    }
  }

  const UFO_DEATH_BLAST_RADIUS = 60;
  function ufoDeathExplosion(dead) {
    flashes.push({ x: dead.x, y: dead.y, r: 12, maxLife: 10, life: 10, color: '#ffcc44', explosion: true });
    flashes.push({ x: dead.x, y: dead.y, r: 16, maxLife: 14, life: 14, color: '#ff6622', explosion: true });
    addShake(0.12);
    for (const u of ufos) {
      if (u === dead || u.state !== 'alive') continue;
      const dx = u.x - dead.x;
      const dy = u.y - dead.y;
      const dist = Math.hypot(dx, dy);
      if (dist >= UFO_DEATH_BLAST_RADIUS) continue;
      const splashDmg = Math.ceil(u.maxHp * 0.15);
      u.hp -= splashDmg;
      u.hitFlash = 6;
      const knock = dist || 1;
      const intensity = 1 - dist / UFO_DEATH_BLAST_RADIUS;
      u.vx += (dx / knock) * (1.5 + intensity * 2.0);
      u.baseY += (dy / knock) * (8 + intensity * 12);
      u.baseY = Math.max(10, Math.min(H * 0.6, u.baseY));
      if (u.hp <= 0) {
        u.hp = 0;
        u.state = 'falling';
        u.vy = 0.5 + Math.random() * 0.5;
        killCount++;
        hitStopFrames = Math.max(hitStopFrames, 2);
        if (!DEBUG && nextDropIndex < WEAPON_DROPS.length && killCount >= WEAPON_DROPS[nextDropIndex].kill) {
          spawnPack(u.x + (Math.random() - 0.5) * 20, WEAPON_DROPS[nextDropIndex].kind);
          nextDropIndex++;
        }
        ejectCrewFromUfo(u);
      }
    }
  }

  function ufoAt(x, y) {
    for (const u of ufos) {
      if (u.state !== 'alive' && u.state !== 'entering' && u.state !== 'falling') continue;
      if (Math.abs(x - u.x) <= UFO_W / 2 && Math.abs(y - u.y) <= UFO_H / 2 + 1) return u;
    }
    return null;
  }

  function fireLaser(u) {
    const sx = u.x;
    const sy = u.y + UFO_H / 2;
    const tx = player.x;
    const ty = player.y - player.h / 2;
    const dx = tx - sx, dy = ty - sy;
    const len = Math.hypot(dx, dy) || 1;
    const speed = 2.2;
    lasers.push({
      x: sx, y: sy,
      vx: (dx / len) * speed,
      vy: (dy / len) * speed,
      life: 240,
      green: !!u.green,
    });
  }

  function updateUfos() {
    for (let i = ufos.length - 1; i >= 0; i--) {
      const u = ufos[i];
      if (u.hitFlash > 0) u.hitFlash--;
      if (u.state === 'entering') {
        u.y += 0.9;
        if (u.y >= u.baseY) {
          u.y = u.baseY;
          u.state = 'alive';
        }
        continue;
      }
      if (u.state === 'falling') {
        u.vy += 0.05;
        if (u.vy > 2.5) u.vy = 2.5;
        u.vx *= 0.98;
        u.y += u.vy;
        u.x += u.vx;
        if (u.spinAngle !== undefined) u.spinAngle += u.spinSpeed;
        const belly = u.y + UFO_H / 2;
        const gy = Math.floor(belly);
        let inTerrain = gy >= H;
        if (!inTerrain) {
          for (let dx = -UFO_W / 2; dx <= UFO_W / 2; dx += 2) {
            const gx = Math.floor(u.x + dx);
            if (gx >= 0 && gx < WORLD_W && gy >= 0 && grid[idx(gx, gy)] === 1) {
              inTerrain = true; break;
            }
          }
        }
        if (inTerrain || u.y > H + 20) {
          explode(u.x, Math.min(H - 1, belly), 22, 60, 70, 0.3);
          if (Math.random() < 0.6) spawnPack(u.x + (Math.random() - 0.5) * 40);
          ufos.splice(i, 1);
        }
        continue;
      }
      u.bob += u.bobSpeed;
      const desiredX = Math.max(20, Math.min(WORLD_W - 20, player.x));
      const dx = desiredX - u.x;
      if (Math.abs(dx) > 30) u.vx += Math.sign(dx) * 0.008;
      u.vx = Math.max(-0.6, Math.min(0.6, u.vx));
      u.x += u.vx;
      if (u.x < 12) { u.x = 12; u.vx = Math.abs(u.vx); }
      if (u.x > WORLD_W - 12) { u.x = WORLD_W - 12; u.vx = -Math.abs(u.vx); }
      u.y = u.baseY + Math.sin(u.bob) * 6;

      const hpFrac = u.hp / u.maxHp;
      if (hpFrac <= 0.3) {
        if (Math.random() < 0.5) {
          flashes.push({
            x: u.x + (Math.random() - 0.5) * UFO_W * 0.6,
            y: u.y + (Math.random() - 0.5) * 4,
            r: 1.5 + Math.random() * 1.5,
            maxLife: 10 + ((Math.random() * 6) | 0),
            life: 10 + ((Math.random() * 6) | 0),
            color: Math.random() < 0.5 ? '#ff6020' : '#ffd040',
          });
        }
        if (Math.random() < 0.25) {
          flashes.push({
            x: u.x + (Math.random() - 0.5) * UFO_W * 0.5,
            y: u.y - 2 + Math.random() * 3,
            r: 1.5 + Math.random() * 1.5,
            maxLife: 18, life: 18,
            color: 'rgba(30,30,30,0.6)',
          });
        }
      } else if (hpFrac <= 0.5) {
        if (Math.random() < 0.3) {
          flashes.push({
            x: u.x + (Math.random() - 0.5) * UFO_W * 0.5,
            y: u.y - 2 + Math.random() * 3,
            r: 1.5 + Math.random() * 1.5,
            maxLife: 20, life: 20,
            color: 'rgba(40,40,40,0.5)',
          });
        }
      }
      if (!player.dead) {
        u.cooldown--;
        if (u.cooldown <= 0) {
          fireLaser(u);
          u.cooldown = 35 + ((Math.random() * 30) | 0);
        }
      }
    }
    if (ufos.length === 0 && groundAliens.length === 0) {
      if (interWaveDelay <= 0) interWaveDelay = 180;
      else if (--interWaveDelay === 0) {
        waveIndex++;
        const w = waveSpec(waveIndex);
        spawnWave(w.count, w.hpMult, w.groundAliens);
      }
    }
  }

  function updateLasers() {
    for (let i = lasers.length - 1; i >= 0; i--) {
      const L = lasers[i];
      const steps = Math.max(1, Math.ceil(Math.max(Math.abs(L.vx), Math.abs(L.vy))));
      let dead = false;
      const PIERCE_MAX_PX = 4;
      for (let s = 0; s < steps; s++) {
        L.x += L.vx / steps;
        L.y += L.vy / steps;
        const gx = Math.floor(L.x), gy = Math.floor(L.y);
        if (gx < 0 || gx >= WORLD_W || gy >= H) { dead = true; break; }
        for (let pi = packs.length - 1; pi >= 0; pi--) {
          const p = packs[pi];
          if (p.kind !== 'health') continue;
          if (Math.abs(L.x - p.x) < 4 && Math.abs(L.y - p.y) < 4) {
            for (let k = 0; k < 6; k++) {
              flashes.push({ x: p.x + (Math.random() - 0.5) * 4, y: p.y + (Math.random() - 0.5) * 4,
                r: 1 + Math.random(), maxLife: 10, life: 10, color: '#90ff90' });
            }
            packs.splice(pi, 1);
            dead = true; break;
          }
        }
        if (dead) break;
        if (gy >= 0 && grid[idx(gx, gy)] === 1) {
          if (L.green) {
            L.pierced = (L.pierced || 0) + (1 / steps);
            grid[idx(gx, gy)] = 0;
            terrainDirty = true;
            if ((s & 1) === 0) {
              flashes.push({ x: gx, y: gy, r: 1.5, maxLife: 5, life: 5, color: '#80ff80' });
            }
            if (L.pierced >= PIERCE_MAX_PX) {
              flashes.push({ x: gx, y: gy, r: 3, maxLife: 6, life: 6, color: '#80ff80' });
              addShake(0.06);
              dead = true; break;
            }
          } else {
            carveCircle(gx, gy, 4, true);
            flashes.push({ x: gx, y: gy, r: 4, maxLife: 6, life: 6, color: '#ff5050' });
            addShake(0.12);
            dead = true; break;
          }
        }
        if (!player.dead) {
          const pcx = player.x, pcy = player.y - player.h / 2;
          if (Math.abs(L.x - pcx) < 3 && Math.abs(L.y - pcy) < player.h / 2 + 1) {
            const dmg = L.green ? 16 : 12;
            player.hp = Math.max(0, player.hp - dmg);
            playerHitFlash = Math.min(1, playerHitFlash + 0.6);
            const lsp = Math.hypot(L.vx, L.vy) || 1;
            player.vx += (L.vx / lsp) * 1.6;
            player.vy -= 0.6;
            if (player.hp === 0) { player.dead = true; player.deathTimer = 0; if (finalElapsedMs === null) finalElapsedMs = Date.now() - gameStartMs; }
            for (let k = 0; k < 8; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1 + Math.random() * 2;
              bloods.push({
                x: pcx, y: pcy + (Math.random() - 0.5) * 4,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.5,
                life: 60,
                green: false,
              });
            }
            dead = true; break;
          }
        }
      }
      L.life--;
      if (dead || L.life <= 0) lasers.splice(i, 1);
    }
  }

  const ufoBuffer = document.createElement('canvas');
  ufoBuffer.width = UFO_W + 4;
  ufoBuffer.height = UFO_H + 12;
  const ubctx = ufoBuffer.getContext('2d');

  function renderUfos() {
    for (const u of ufos) {
      ctx.save();
      if (u.state === 'falling') {
        ctx.translate(u.x, u.y);
        ctx.rotate(u.spinAngle !== undefined ? u.spinAngle : Math.sin(u.y * 0.1) * 0.6);
        ctx.translate(-u.x, -u.y);
        if (Math.random() < 0.6) {
          flashes.push({
            x: u.x + (Math.random() - 0.5) * 6,
            y: u.y - 2 + Math.random() * 4,
            r: 2 + Math.random() * 1.5,
            maxLife: 20, life: 20,
            color: 'rgba(40,40,40,0.7)',
          });
        }
      }
      const x = u.x, y = u.y;
      const hasBites = u.bites && u.bites.length > 0;
      const baseCol = u.green ? '#1a3a18' : '#222';
      const stripeCol = u.green ? '#2a5a26' : '#3a3a3a';
      const domeCol = u.green ? '#2a8a30' : '#1d3a55';
      const domeHigh = u.green ? '#5ae060' : '#3b6f9c';

      if (hasBites) {
        const bw = ufoBuffer.width, bh = ufoBuffer.height;
        const cx = bw / 2, cy = bh / 2;
        ubctx.clearRect(0, 0, bw, bh);

        ubctx.fillStyle = u.hitFlash > 0 ? '#fff' : baseCol;
        ubctx.beginPath();
        ubctx.ellipse(cx, cy + 2, UFO_W / 2, 3, 0, 0, Math.PI * 2);
        ubctx.fill();
        ubctx.fillStyle = u.hitFlash > 0 ? '#fff' : stripeCol;
        ubctx.fillRect(Math.floor(cx - UFO_W / 2 + 1), Math.floor(cy + 1), UFO_W - 2, 1);
        ubctx.fillStyle = u.hitFlash > 0 ? '#fff' : domeCol;
        ubctx.beginPath();
        ubctx.arc(cx, cy + 1, 5, Math.PI, 0);
        ubctx.fill();
        ubctx.fillStyle = u.hitFlash > 0 ? '#fff' : domeHigh;
        ubctx.fillRect(Math.floor(cx - 2), Math.floor(cy - 3), 1, 1);
        const tt = (windT * 0.15) | 0;
        const cols = u.green
          ? ['#80ff80', '#40e040', '#a0ffa0']
          : ['#ffe040', '#ff4060', '#40e0ff'];
        const lightYs = Math.floor(cy + 4);
        [-7, -2, 3, 8].forEach((dx, i) => {
          ubctx.fillStyle = cols[(tt + i) % cols.length];
          ubctx.fillRect(Math.floor(cx + dx), lightYs, 1, 1);
        });

        ubctx.globalCompositeOperation = 'destination-out';
        for (const bite of u.bites) {
          ubctx.beginPath();
          ubctx.arc(cx + bite.lx, cy + bite.ly, bite.r, 0, Math.PI * 2);
          ubctx.fill();
        }
        ubctx.globalCompositeOperation = 'source-over';

        ctx.drawImage(ufoBuffer, x - bw / 2, y - bh / 2);
      } else {
        ctx.fillStyle = u.hitFlash > 0 ? '#fff' : baseCol;
        ctx.beginPath();
        ctx.ellipse(x, y + 2, UFO_W / 2, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = u.hitFlash > 0 ? '#fff' : stripeCol;
        ctx.fillRect(Math.floor(x - UFO_W / 2 + 1), Math.floor(y + 1), UFO_W - 2, 1);
        ctx.fillStyle = u.hitFlash > 0 ? '#fff' : domeCol;
        ctx.beginPath();
        ctx.arc(x, y + 1, 5, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = u.hitFlash > 0 ? '#fff' : domeHigh;
        ctx.fillRect(Math.floor(x - 2), Math.floor(y - 3), 1, 1);
        const tt = (windT * 0.15) | 0;
        const cols = u.green
          ? ['#80ff80', '#40e040', '#a0ffa0']
          : ['#ffe040', '#ff4060', '#40e0ff'];
        const lightYs = Math.floor(y + 4);
        [-7, -2, 3, 8].forEach((dx, i) => {
          ctx.fillStyle = cols[(tt + i) % cols.length];
          ctx.fillRect(Math.floor(x + dx), lightYs, 1, 1);
        });
      }

      if (u.state === 'alive' || u.state === 'entering') {
        const hpW = UFO_W;
        const hpx = Math.floor(x - hpW / 2);
        const hpy = Math.floor(y - 8);
        ctx.fillStyle = '#000';
        ctx.fillRect(hpx - 1, hpy - 1, hpW + 2, 3);
        ctx.fillStyle = u.hp > u.maxHp * 0.5 ? '#3ad14a'
                       : u.hp > u.maxHp * 0.2 ? '#e0c020'
                       : '#d03030';
        ctx.fillRect(hpx, hpy, Math.round((u.hp / u.maxHp) * hpW), 1);
      }
      ctx.restore();
    }
  }

  function renderLasers() {
    for (const L of lasers) {
      const sp = Math.hypot(L.vx, L.vy) || 1;
      const ux = L.vx / sp, uy = L.vy / sp;
      const hx = Math.floor(L.x), hy = Math.floor(L.y);
      if (L.green) {
        ctx.fillStyle = '#003a00'; ctx.fillRect(hx - 1, hy - 1, 4, 4);
        ctx.fillStyle = '#18a018'; ctx.fillRect(Math.floor(L.x - ux * 4), Math.floor(L.y - uy * 4), 2, 2);
        ctx.fillStyle = '#20e020'; ctx.fillRect(Math.floor(L.x - ux * 2), Math.floor(L.y - uy * 2), 2, 2);
        ctx.fillStyle = '#d0ffd0'; ctx.fillRect(hx, hy, 2, 2);
      } else {
        ctx.fillStyle = '#3a0000'; ctx.fillRect(hx - 1, hy - 1, 4, 4);
        ctx.fillStyle = '#a01818'; ctx.fillRect(Math.floor(L.x - ux * 4), Math.floor(L.y - uy * 4), 2, 2);
        ctx.fillStyle = '#e02020'; ctx.fillRect(Math.floor(L.x - ux * 2), Math.floor(L.y - uy * 2), 2, 2);
        ctx.fillStyle = '#ffd0d0'; ctx.fillRect(hx, hy, 2, 2);
      }
    }
  }

  spawnClouds();

  let gameStartMs = Date.now();
  let finalElapsedMs = null;
  let hits = 0;
  let killCount = 0;
  const WEAPON_DROPS = [
    { kill: 1, kind: 'weapon-bazooka' },
    { kill: 3, kind: 'weapon-dualmg' },
    { kill: 5, kind: 'weapon-builder' },
    { kill: 7, kind: 'weapon-laser' },
  ];
  let nextDropIndex = 0;

  function survivedMs() {
    return finalElapsedMs !== null ? finalElapsedMs : (Date.now() - gameStartMs);
  }
  function survivedString() {
    const total = Math.floor(survivedMs() / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function currentScore() {
    return Math.floor(survivedMs() / 100) + hits * 50;
  }

  function spawnCavePacks(caves) {
    const count = 2 + ((Math.random() * 3) | 0);
    const shuffled = caves.slice().sort(() => Math.random() - 0.5);
    for (let i = 0; i < Math.min(count, shuffled.length); i++) {
      const c = shuffled[i];
      packs.push({
        x: Math.max(8, Math.min(WORLD_W - 8, c.x | 0)),
        y: c.y | 0, vy: 0.4,
        landed: false, idle: 0,
        bob: Math.random() * 6.28,
        kind: 'health',
      });
    }
  }

  const initCaves = generateTerrain();
  spawnTrees(); spawnBushesAndGrass();
  spawnCavePacks(initCaves);
  resetWaves();

  if (DEBUG) {
    for (let i = 0; i < 5; i++) {
      const bx = 40 + Math.random() * (WORLD_W - 80);
      spawnBall(bx, 10 + Math.random() * 20, 3 + Math.floor(Math.random() * 3), (Math.random() - 0.5) * 2, 0);
    }
  }

  const TARGET_FPS = 60;
  const TICK_MS = 1000 / TARGET_FPS;
  const TIME_SCALE = 0.6;
  const SLOWMO_SCALE = 0.15;
  let tickAccum = 0;
  let lastFrameMs = performance.now();

  function loop(nowMs) {
    const elapsed = Math.min(nowMs - lastFrameMs, 100);
    lastFrameMs = nowMs;

    if (!controlMode) {
      render();
      requestAnimationFrame(loop);
      return;
    }

    const frames = elapsed / TICK_MS;
    updateSlowmoEnergy();
    updateBuilderEnergy();
    if (paused) {
      tickAccum = 0;
    } else if (hitStopFrames > 0) {
      hitStopFrames--;
      tickAccum = 0;
    } else {
      tickAccum += frames * (slowmoActive() ? SLOWMO_SCALE : TIME_SCALE);
    }
    while (tickAccum >= 1) {
      tickAccum -= 1;
      const wpn = WEAPONS[weapon];
      if (burstLocked) {
        burstCooldownTimer--;
        if (burstCooldownTimer <= 0) {
          burstLocked = false;
          burstCounter = 0;
        }
      }
      if (firingHeld && wpn.auto && !player.dead && !burstLocked) {
        if (fireCooldown <= 0) { wpn.fire(); fireCooldown = wpn.interval; }
        else fireCooldown--;
        if (wpn.burstMax) {
          burstCounter++;
          if (burstCounter >= wpn.burstMax) {
            burstLocked = true;
            burstCooldownTimer = wpn.burstCooldown;
            fireCooldown = wpn.burstCooldown;
          }
        }
        fireShakeRamp = Math.min(FIRE_RAMP_TICKS, fireShakeRamp + 1);
      } else {
        if (fireCooldown > 0) fireCooldown--;
        fireShakeRamp = Math.max(0, fireShakeRamp - 2);
      }
      for (const k in weaponCooldowns) {
        if (k !== weapon && weaponCooldowns[k] > 0) weaponCooldowns[k]--;
      }
      windT++;
      updateClouds();
      updateTrees();
      updateBushes();
      updateChunks();
      updateCasings();
      updateAlienGibs();
      updatePlayer();
      updateCamera();
      updateBullets();
      updateRockets();
      updateGrenades();
      updatePhysBalls();
      updateGroundAliens();
      updateUfos();
      updateUfoDebris();
      updateHullDebris();
      updateLasers();
      for (let i = playerBeams.length - 1; i >= 0; i--) {
        if (--playerBeams[i].life <= 0) playerBeams.splice(i, 1);
      }
      for (let i = blueBeams.length - 1; i >= 0; i--) {
        if (--blueBeams[i].life <= 0) blueBeams.splice(i, 1);
      }
      updatePacks();
      if (weaponLabelTime > 0) weaponLabelTime--;
      if (playerHitFlash > 0) playerHitFlash = Math.max(0, playerHitFlash - 0.04);
      if (introTimer > 0) introTimer--;
      if (waveBannerTime > 0) waveBannerTime--;
      if (dashCooldown > 0) dashCooldown--;
      if (!player.dead && Math.random() < 0.0007 && packs.length < 4) {
        spawnPack(20 + Math.random() * (WORLD_W - 40));
      }
      updateBloods();
      updateFlashes();
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
