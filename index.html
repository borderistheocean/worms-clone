<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Worms PoC</title>
<style>
  html, body { margin: 0; height: 100%; width: 100%; background: #111; overflow: hidden;
    font-family: monospace; color: #ddd; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
  /* Canvas keeps its 480x270 internal resolution but scales to fill the
     viewport while preserving the 16:9 aspect ratio (letterboxed if the
     window aspect is off). #wrap sizes to match so the HUD overlays it. */
  #wrap { position: relative;
    width:  min(92vw, calc(92vh * 16 / 9));
    height: min(92vh, calc(92vw * 9 / 16)); }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges;
    width: 100%; height: 100%; background: #000; display: block;
    box-shadow: 0 0 20px #000; cursor: none; }
  #hud { margin-top: 8px; text-align: center; font-size: 12px;
    color: #ddd; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="270"></canvas>
</div>
<div id="hud">A/D or ←/→ move • S/↓ duck • W/Space/↑ jump • Left-click shoot • Right-click/Shift slow-mo • Scroll-wheel/Q change weapon • P pause</div>
<script>
(() => {
  const W = 480, H = 270;
  const WORLD_W = 960; // total world width (twice viewport)
  let cameraX = 0; // horizontal scroll offset; left edge of viewport in world coords
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // Terrain grid: 1 = solid, 0 = empty
  let grid = new Uint8Array(WORLD_W * H);
  // Offscreen image for terrain rendering (sized to whole world)
  const terrainCanvas = document.createElement('canvas');
  terrainCanvas.width = WORLD_W; terrainCanvas.height = H;
  const tctx = terrainCanvas.getContext('2d');
  const terrainImg = tctx.createImageData(WORLD_W, H);
  let terrainDirty = true;
  // Offscreen FX canvas — used to mask explosion flashes to terrain shape
  const fxCanvas = document.createElement('canvas');
  fxCanvas.width = WORLD_W; fxCanvas.height = H;
  const fxctx = fxCanvas.getContext('2d');

  // Colors
  const COL_DIRT     = [120, 72, 40, 255];
  const COL_DIRT2    = [96,  56, 28, 255];
  const COL_GRASS    = [70, 170, 60, 255];
  const COL_GRASS_DK = [40, 110, 40, 255];
  const COL_SKY      = [0, 0, 0, 0]; // transparent so canvas bg shows

  function idx(x, y) { return y * WORLD_W + x; }
  function inBounds(x, y) { return x >= 0 && x < WORLD_W && y >= 0 && y < H; }
  function solid(x, y) {
    if (x < 0 || x >= WORLD_W) return true; // walls
    if (y >= H) return true;          // floor
    if (y < 0) return false;          // sky
    return grid[idx(x, y)] === 1;
  }

  function generateTerrain() {
    grid.fill(0);
    // Stacked sines for rolling hills
    const baseY = H * 0.55;
    const seedA = Math.random() * 1000;
    const seedB = Math.random() * 1000;
    const seedC = Math.random() * 1000;
    for (let x = 0; x < WORLD_W; x++) {
      const h = baseY
        + Math.sin((x + seedA) * 0.012) * 40
        + Math.sin((x + seedB) * 0.035) * 15
        + Math.sin((x + seedC) * 0.08)  * 6;
      const top = Math.max(20, Math.min(H - 1, Math.floor(h)));
      for (let y = top; y < H; y++) grid[idx(x, y)] = 1;
    }
    // Carve some random caves so destruction has interesting interior
    const caves = [];
    for (let i = 0; i < 6; i++) {
      const cx = 60 + Math.random() * (WORLD_W - 120);
      const cy = baseY + 20 + Math.random() * 60;
      const r  = 12 + Math.random() * 20;
      carveCircle(cx, cy, r, false);
      caves.push({ x: cx, y: cy });
    }
    terrainDirty = true;
    return caves;
  }

  function carveCircle(cx, cy, r, runIsolation = true) {
    const r2 = r * r;
    const x0 = Math.max(0, Math.floor(cx - r));
    const x1 = Math.min(WORLD_W - 1, Math.ceil(cx + r));
    const y0 = Math.max(0, Math.floor(cy - r));
    const y1 = Math.min(H - 1, Math.ceil(cy + r));
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = x - cx, dy = y - cy;
        if (dx*dx + dy*dy <= r2) grid[idx(x, y)] = 0;
      }
    }
    terrainDirty = true;
    if (runIsolation) detachFloatingChunks();
  }

  // Falling chunks: pixels relative to (x,y) origin
  const chunks = [];

  const MAX_CHUNK_PIXELS = 200; // bigger floating slabs stay suspended until chipped smaller

  function detachFloatingChunks() {
    // Flood-fill from bottom row across all solid pixels
    const visited = new Uint8Array(WORLD_W * H);
    const stack = [];
    for (let x = 0; x < WORLD_W; x++) {
      const i = idx(x, H - 1);
      if (grid[i] === 1) { visited[i] = 1; stack.push(x, H - 1); }
    }
    while (stack.length) {
      const y = stack.pop();
      const x = stack.pop();
      // 4-neighbour
      if (x > 0) {
        const i = idx(x-1, y);
        if (!visited[i] && grid[i] === 1) { visited[i] = 1; stack.push(x-1, y); }
      }
      if (x < WORLD_W-1) {
        const i = idx(x+1, y);
        if (!visited[i] && grid[i] === 1) { visited[i] = 1; stack.push(x+1, y); }
      }
      if (y > 0) {
        const i = idx(x, y-1);
        if (!visited[i] && grid[i] === 1) { visited[i] = 1; stack.push(x, y-1); }
      }
      if (y < H-1) {
        const i = idx(x, y+1);
        if (!visited[i] && grid[i] === 1) { visited[i] = 1; stack.push(x, y+1); }
      }
    }
    // Group unvisited solid pixels into connected components
    const claimed = new Uint8Array(WORLD_W * H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < WORLD_W; x++) {
        const i = idx(x, y);
        if (grid[i] !== 1 || visited[i] || claimed[i]) continue;
        // BFS this component
        const compPixels = [];
        let minX = x, minY = y;
        const st = [x, y];
        claimed[i] = 1;
        while (st.length) {
          const py = st.pop(), px = st.pop();
          compPixels.push(px, py);
          if (px < minX) minX = px;
          if (py < minY) minY = py;
          const neigh = [[px-1,py],[px+1,py],[px,py-1],[px,py+1]];
          for (const [nx, ny] of neigh) {
            if (nx < 0 || nx >= WORLD_W || ny < 0 || ny >= H) continue;
            const ni = idx(nx, ny);
            if (grid[ni] === 1 && !visited[ni] && !claimed[ni]) {
              claimed[ni] = 1; st.push(nx, ny);
            }
          }
        }
        const pixelCount = compPixels.length / 2;
        // Too big to fall — leave it floating in the grid until further damage breaks it up
        if (pixelCount > MAX_CHUNK_PIXELS) continue;
        // Near the limit (>50%) — compact to half height on landing
        const heavy = pixelCount > MAX_CHUNK_PIXELS / 2;
        // Convert to chunk
        const pixels = new Int16Array(compPixels.length);
        for (let k = 0; k < compPixels.length; k += 2) {
          const gx = compPixels[k], gy = compPixels[k+1];
          pixels[k]   = gx - minX;
          pixels[k+1] = gy - minY;
          grid[idx(gx, gy)] = 0; // remove from terrain
        }
        chunks.push({ pixels, x: minX, y: minY, vy: 0, heavy });
        terrainDirty = true;
      }
    }
  }

  function chunkCollides(chunk, ox, oy) {
    const p = chunk.pixels;
    for (let k = 0; k < p.length; k += 2) {
      const gx = ox + p[k], gy = oy + p[k+1];
      if (gy >= H) return true;
      if (gx < 0 || gx >= WORLD_W) return true;
      if (gy >= 0 && grid[idx(gx, gy)] === 1) return true;
    }
    return false;
  }

  function stampChunk(chunk) {
    // For each column of the chunk, preserve its pixel count but re-base it
    // onto the ground directly beneath that column — no air gaps between chunk
    // and existing terrain, no internal gaps within the chunk.
    const p = chunk.pixels;
    const colData = new Map(); // worldX -> { count, maxRelY }
    for (let k = 0; k < p.length; k += 2) {
      const gx = chunk.x + p[k];
      if (gx < 0 || gx >= WORLD_W) continue;
      const relY = p[k+1];
      const existing = colData.get(gx);
      if (existing) {
        existing.count++;
        if (relY > existing.maxRelY) existing.maxRelY = relY;
      } else {
        colData.set(gx, { count: 1, maxRelY: relY });
      }
    }
    for (const [gx, data] of colData) {
      // Ground top = first solid grid pixel below the chunk's lowest pixel in this column
      const startY = chunk.y + data.maxRelY + 1;
      let groundTop = H;
      for (let y = Math.max(0, startY); y < H; y++) {
        if (grid[idx(gx, y)] === 1) { groundTop = y; break; }
      }
      const stampCount = chunk.heavy ? Math.max(1, Math.floor(data.count * 0.25)) : data.count;
      for (let i = 1; i <= stampCount; i++) {
        const ny = groundTop - i;
        if (ny >= 0 && ny < H) grid[idx(gx, ny)] = 1;
      }
    }
    terrainDirty = true;
  }

  function updateChunks() {
    for (let i = chunks.length - 1; i >= 0; i--) {
      const c = chunks[i];
      c.vy += 0.35;
      if (c.vy > 6) c.vy = 6;
      let remaining = c.vy;
      while (remaining > 0) {
        const step = Math.min(1, remaining);
        if (chunkCollides(c, c.x, c.y + 1)) {
          stampChunk(c);
          chunks.splice(i, 1);
          // Cascade: a landed chunk might now anchor or isolate things
          detachFloatingChunks();
          break;
        }
        c.y += 1;
        remaining -= 1;
      }
    }
  }

  // Player
  const MAX_HP = 100;
  let playerHitFlash = 0;   // 0..1, ticks down — drives the red damage overlay
  let introTimer = 240;     // ticks remaining for the "TRY 'N' SURVIVE" intro
  let paused = false;
  // Wave banner — shown briefly when each wave starts.
  let waveBannerText = '';
  let waveBannerTime = 0;
  let dayProgress = 0;
  // Hit-stop — render-frame counter that freezes the world for a moment when
  // the player lands a kill, for impact feedback.
  let hitStopFrames = 0;
  // Dash state — tracks last keydown timestamps per direction for double-tap
  // detection and a cooldown frame counter.
  let lastTapLeft = 0, lastTapRight = 0;
  const DASH_WINDOW_MS = 250;
  const DASH_COOLDOWN = 90;     // ticks before dash is available again
  const DASH_IMPULSE = 4.0;
  let dashCooldown = 0;
  const player = {
    x: W / 2, y: 20,
    w: 6, h: 10,
    vx: 0, vy: 0,
    onGround: false,
    facing: 1,
    hp: MAX_HP,
    dead: false,
    deathTimer: 0,
    walkPhase: 0,
    jumpCharge: 0,
    breathT: 0,
    ducking: false,
    cooking: false,
    cookTime: 0,
  };
  const GRENADE_FUSE = 120; // 2 seconds @ 60fps
  const STAND_H = 10;
  const DUCK_H  = 6;
  const JUMP_CHARGE_FRAMES = 6;

  function playerCollidesAt(px, py) {
    const x0 = Math.floor(px - player.w / 2);
    const x1 = Math.floor(px + player.w / 2 - 0.001);
    const y0 = Math.floor(py - player.h);
    const y1 = Math.floor(py - 0.001);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (solid(x, y)) return true;
      }
    }
    return false;
  }

  function updatePlayer() {
    if (player.dead) {
      // Still subject to gravity so the corpse settles
      player.vy += 0.18;
      if (player.vy > 5) player.vy = 5;
      let my = player.vy;
      const ydir = my > 0 ? 1 : -1;
      let ysteps = Math.ceil(Math.abs(my));
      for (let s = 0; s < ysteps; s++) {
        const tryY = player.y + ydir;
        if (!playerCollidesAt(player.x, tryY)) player.y = tryY;
        else { player.vy = 0; break; }
      }
      // Big initial burst on the first dead-tick: blood spray everywhere plus
      // a stamped pool on the terrain beneath the body.
      if (player.deathTimer === 0) {
        for (let k = 0; k < 70; k++) {
          const ang = Math.random() * Math.PI * 2;
          const sp = 1.2 + Math.random() * 2.8;
          bloods.push({
            x: player.x + (Math.random() - 0.5) * player.h,
            y: player.y - player.h / 2 + (Math.random() - 0.5) * 4,
            vx: Math.cos(ang) * sp,
            vy: Math.sin(ang) * sp - 1.2,
            life: 90 + (Math.random() * 60) | 0,
          });
        }
        // Pool stamp on terrain right beneath the corpse
        const py = Math.floor(player.y);
        for (let dx = -4; dx <= 4; dx++) {
          const tx = Math.floor(player.x) + dx;
          if (tx < 0 || tx >= WORLD_W) continue;
          for (let y = py; y < Math.min(H, py + 2); y++) {
            if (grid[idx(tx, y)] === 1) {
              tctx.fillStyle = '#a01020';
              tctx.fillRect(tx, y, 1, 1);
              break;
            }
          }
        }
      }
      player.deathTimer++;
      // Heavy bleeding for the first ~1 second, then slow drip.
      const bleedRate = player.deathTimer < 90 ? 3 : 15;
      if ((player.deathTimer % bleedRate) === 0) {
        bloods.push({
          x: player.x + (Math.random() - 0.5) * player.h,
          y: player.y - 1,
          vx: (Math.random() - 0.5) * 0.6,
          vy: 0.3 + Math.random() * 0.6,
          life: 90,
        });
      }
      return;
    }
    // Face toward cursor each frame
    player.facing = (mouseX >= player.x) ? 1 : -1;
    // Breathing — always ticks while alive so even an idle worm looks alive
    player.breathT++;
    // Duck input: held while pressing S / down, but only on the ground.
    // Unduck is gated on having free space above so the head doesn't tunnel.
    const wantDuck = (keys['s'] || keys['arrowdown']) && player.onGround;
    if (wantDuck) {
      player.h = DUCK_H;
      player.ducking = true;
    } else if (player.ducking) {
      player.h = STAND_H;
      if (playerCollidesAt(player.x, player.y)) {
        player.h = DUCK_H; // stuck under something, stay ducked
      } else {
        player.ducking = false;
      }
    }
    // Horizontal input — frozen while crouching for the jump
    let ax = 0;
    if (keys['arrowleft'] || keys['a']) ax -= 1;
    if (keys['arrowright'] || keys['d']) ax += 1;
    if (player.jumpCharge > 0) ax = 0;
    // During bullet-time the world ticks slower, which makes the player feel
    // glued to the ground — give them a per-tick boost so they still move at
    // a usable pace through the slow-mo.
    const moveBoost = slowmoActive() ? 2.2 : 1;
    player.vx = ax * (player.ducking ? 0.45 : 0.7) * moveBoost;
    // Advance walk phase only when actually moving on the ground
    if (ax !== 0 && player.onGround) player.walkPhase++;
    else player.walkPhase = 0;

    // Gravity
    player.vy += 0.18;
    if (player.vy > 5) player.vy = 5;

    // Move X with sub-stepping; allow step-up of up to 2px to climb small bumps
    let mx = player.vx;
    const stepDir = mx > 0 ? 1 : -1;
    let steps = Math.ceil(Math.abs(mx));
    for (let s = 0; s < steps; s++) {
      const tryX = player.x + stepDir;
      if (!playerCollidesAt(tryX, player.y)) {
        player.x = tryX;
      } else {
        // Try step-up — generous enough to smooth over jagged pixel slopes,
        // but capped so steep walls still block (Worms-style traversal).
        let climbed = false;
        for (let up = 1; up <= 4; up++) {
          if (!playerCollidesAt(tryX, player.y - up)) {
            player.x = tryX;
            player.y -= up;
            climbed = true;
            break;
          }
        }
        if (!climbed) { player.vx = 0; break; }
      }
    }

    // Move Y
    let my = player.vy;
    const ydir = my > 0 ? 1 : -1;
    let ysteps = Math.ceil(Math.abs(my));
    player.onGround = false;
    for (let s = 0; s < ysteps; s++) {
      const tryY = player.y + ydir;
      if (!playerCollidesAt(player.x, tryY)) {
        player.y = tryY;
      } else {
        if (ydir > 0) player.onGround = true;
        player.vy = 0;
        break;
      }
    }

    // Grenade cook — counts up while G is held. If the fuse runs out before
    // the player releases the key, the grenade detonates in-hand instead.
    if (player.cooking) {
      player.cookTime++;
      if (player.cookTime >= GRENADE_FUSE) {
        // Drop a grenade at the player with fuse 0 so it explodes immediately.
        throwGrenade(0.2, 1);
        player.cooking = false;
        player.cookTime = 0;
      }
    }

    // Jump — small sit-up crouch before launching
    if (jumpQueued > 0 && player.onGround && !player.ducking && player.jumpCharge === 0) {
      player.jumpCharge = JUMP_CHARGE_FRAMES;
      jumpQueued = 0;
    } else if (jumpQueued > 0) {
      jumpQueued--;
    }
    if (player.jumpCharge > 0 && player.onGround) {
      player.jumpCharge--;
      if (player.jumpCharge === 0) {
        player.vy = -2.8;
        player.onGround = false;
      }
    } else if (!player.onGround) {
      player.jumpCharge = 0;
    }

    // Don't fall out of world
    if (player.y > H + 50) {
      player.x = W / 2; player.y = 20; player.vx = 0; player.vy = 0;
    }
  }

  // Camera: follow the player horizontally once they pass the viewport midpoint.
  // Acts like a classic side-scroller — left half of the world acts normally,
  // moving right past the centre scrolls the camera.
  function updateCamera() {
    const targetX = Math.max(0, Math.min(WORLD_W - W, player.x - W / 2));
    cameraX = targetX;
    // Keep mouseX synced to world coords even when the cursor isn't moving.
    if (typeof mouseScreenX === 'number') mouseX = mouseScreenX + cameraX;
  }

  // Rendering
  function renderTerrain() {
    const d = terrainImg.data;
    // Reset to transparent
    for (let i = 0; i < d.length; i += 4) {
      d[i] = 0; d[i+1] = 0; d[i+2] = 0; d[i+3] = 0;
    }
    // Find top-of-column for grass tinting
    for (let x = 0; x < WORLD_W; x++) {
      let topY = -1;
      for (let y = 0; y < H; y++) {
        if (grid[idx(x, y)] === 1) { topY = y; break; }
      }
      if (topY < 0) continue;
      for (let y = topY; y < H; y++) {
        if (grid[idx(x, y)] !== 1) continue;
        const di = (y * WORLD_W + x) * 4;
        let col;
        const depth = y - topY;
        if (depth === 0)        col = COL_GRASS;
        else if (depth === 1)   col = COL_GRASS;
        else if (depth === 2)   col = COL_GRASS_DK;
        else if ((x + y) & 1)   col = COL_DIRT;
        else                    col = COL_DIRT2;
        d[di]   = col[0];
        d[di+1] = col[1];
        d[di+2] = col[2];
        d[di+3] = col[3];
      }
    }
    // Edge border — any non-grass terrain pixel touching air gets a dark tint
    for (let x = 0; x < WORLD_W; x++) {
      for (let y = 0; y < H; y++) {
        if (grid[idx(x, y)] !== 1) continue;
        const di = (y * WORLD_W + x) * 4;
        // Skip grass pixels (bright green top rows)
        if (d[di+1] > 160 && d[di] < 100) continue;
        const hasAir = (x > 0   && grid[idx(x-1, y)] !== 1) ||
                       (x < WORLD_W-1 && grid[idx(x+1, y)] !== 1) ||
                       (y > 0   && grid[idx(x, y-1)] !== 1) ||
                       (y < H-1 && grid[idx(x, y+1)] !== 1);
        if (hasAir) {
          d[di]   = COL_DIRT2[0];
          d[di+1] = COL_DIRT2[1];
          d[di+2] = COL_DIRT2[2];
        }
      }
    }
    tctx.putImageData(terrainImg, 0, 0);
    terrainDirty = false;
  }

  function render() {
    // Screen shake — random offset scaled by trauma² so big hits feel chunky.
    const SHAKE_MAX = 5;
    const s = shakeTrauma * shakeTrauma;
    const shakeX = (Math.random() * 2 - 1) * SHAKE_MAX * s;
    const shakeY = (Math.random() * 2 - 1) * SHAKE_MAX * s;
    // Slight zoom while shaking so the offset doesn't reveal canvas edges
    // (which look like a thin strip of sky/dark beyond the scene).
    const scale = 1 + 0.05 * s;
    ctx.setTransform(scale, 0, 0, scale,
      shakeX - (scale - 1) * (W / 2),
      shakeY - (scale - 1) * (H / 2));

    // Sky — day/night cycle driven by waveIndex
    // Wave 0 = bright day, progresses through sunset to night over ~8 waves
    const dayTarget = Math.min(1, waveIndex / 8);
    dayProgress += (dayTarget - dayProgress) * 0.005;
    const dayT = dayProgress;
    const skyR = Math.round(135 * (1 - dayT) + 12 * dayT);
    const skyG = Math.round(206 * (1 - dayT) + 10 * dayT);
    const skyB = Math.round(235 * (1 - dayT) + 28 * dayT);
    // Mid-transition purple tint (peaks around dayT=0.5)
    const purpleT = Math.sin(dayT * Math.PI);
    const sr = Math.min(255, Math.round(skyR + purpleT * 40));
    const sg = Math.max(0,   Math.round(skyG - purpleT * 50));
    const sb = Math.round(skyB * (1 - purpleT * 0.15) + purpleT * 30);
    const br = Math.max(0, Math.round(sr * 0.75));
    const bg = Math.max(0, Math.round(sg * 0.65));
    const bb = Math.max(0, Math.round(sb * 0.8));
    const grad = ctx.createLinearGradient(0, -SHAKE_MAX, 0, H + SHAKE_MAX);
    if (slowmoActive()) {
      grad.addColorStop(0,   `rgba(${sr},${sg},${sb},0.25)`);
      grad.addColorStop(0.85, `rgba(${sr},${sg},${sb},0.25)`);

      grad.addColorStop(1,   `rgba(${br},${bg},${bb},0.25)`);
    } else {
      grad.addColorStop(0,   `rgb(${sr},${sg},${sb})`);
      grad.addColorStop(0.85, `rgb(${sr},${sg},${sb})`);
      grad.addColorStop(1,   `rgb(${br},${bg},${bb})`);
    }
    ctx.fillStyle = grad;
    ctx.fillRect(-SHAKE_MAX, -SHAKE_MAX, W + SHAKE_MAX * 2, H + SHAKE_MAX * 2);

    // Stars — fade in as night approaches
    if (dayT > 0.15) {
      const starAlpha = Math.min(1, (dayT - 0.15) / 0.25);
      ctx.fillStyle = `rgba(255,255,255,${starAlpha.toFixed(2)})`;
      // Deterministic star field from seed
      let seed = 12345;
      for (let i = 0; i < 80; i++) {
        seed = (seed * 16807 + 7) % 2147483647;
        const sx = (seed % W);
        seed = (seed * 16807 + 7) % 2147483647;
        const sy = (seed % Math.floor(H * 0.55));
        seed = (seed * 16807 + 7) % 2147483647;
        const sz = (seed % 3 === 0) ? 2 : 1;
        ctx.fillRect(sx, sy, sz, sz);
      }
    }

    // Sun — moves down and becomes orange as waves progress
    const sunY = 40 + dayT * 100;
    const sunOrange = dayT;
    const sunRc = Math.round(255 * (1 - sunOrange) + 255 * sunOrange);
    const sunGc = Math.round(247 * (1 - sunOrange) + 140 * sunOrange);
    const sunBc = Math.round(204 * (1 - sunOrange) + 30 * sunOrange);
    const sunAlpha = Math.max(0, 1 - Math.max(0, (dayT - 0.7) / 0.3));
    if (sunAlpha > 0) {
      ctx.globalAlpha = sunAlpha;
      ctx.strokeStyle = `rgb(${Math.round(sunRc*0.85)},${Math.round(sunGc*0.75)},${Math.round(sunBc*0.5)})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(W - 50, sunY, 18, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = `rgb(${sunRc},${sunGc},${sunBc})`;
      ctx.beginPath(); ctx.arc(W - 50, sunY, 18, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1;
      ctx.globalAlpha = 1;
    }

    // Clouds drift in front of the sun but behind everything else
    renderClouds();

    if (terrainDirty) renderTerrain();

    // === BEGIN WORLD-SPACE RENDERING (camera offset applied) ===
    ctx.save();
    ctx.translate(-cameraX, 0);

    // Explosion flashes — drawn BEFORE terrain so they glow from inside the
    // crater. The current (post-carve) terrain then overlays them, so the
    // flash is only visible through the freshly-blown hole, never on top of
    // intact dirt or sky.
    for (const f of flashes) {
      if (!f.explosion) continue;
      const t = f.life / f.maxLife;
      ctx.globalAlpha = t;
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (0.6 + (1 - t) * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Vegetation behind terrain so grass covers stems/roots
    renderTrees(windNow());
    renderBushes();
    renderGrassBlades(windNow());

    ctx.drawImage(terrainCanvas, 0, 0);

    // Falling chunks
    for (const c of chunks) {
      const p = c.pixels;
      ctx.fillStyle = '#8a4828';
      for (let k = 0; k < p.length; k += 2) {
        ctx.fillRect(c.x + p[k], c.y + p[k+1], 1, 1);
      }
    }

    // UFOs + lasers (above clouds/terrain, below player projectiles)
    renderUfos();
    renderUfoDebris();
    renderHullDebris();
    renderLasers();
    renderPacks();

    // Player laser beam — thick red glow with bright core, fades over life.
    for (const beam of playerBeams) {
      const t = beam.life / beam.maxLife;
      ctx.globalAlpha = t;
      ctx.strokeStyle = '#5a0010';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(beam.x0, beam.y0); ctx.lineTo(beam.x1, beam.y1); ctx.stroke();
      ctx.strokeStyle = '#ff2030';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(beam.x0, beam.y0); ctx.lineTo(beam.x1, beam.y1); ctx.stroke();
      ctx.strokeStyle = '#fff0f0';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(beam.x0, beam.y0); ctx.lineTo(beam.x1, beam.y1); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Blue laser beam — wide cyan/blue glow with white core
    for (const beam of blueBeams) {
      const t = beam.life / beam.maxLife;
      ctx.globalAlpha = t;
      ctx.strokeStyle = '#001a5a';
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(beam.x0, beam.y0); ctx.lineTo(beam.x1, beam.y1); ctx.stroke();
      ctx.strokeStyle = '#2080ff';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(beam.x0, beam.y0); ctx.lineTo(beam.x1, beam.y1); ctx.stroke();
      ctx.strokeStyle = '#80d0ff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(beam.x0, beam.y0); ctx.lineTo(beam.x1, beam.y1); ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(beam.x0, beam.y0); ctx.lineTo(beam.x1, beam.y1); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Bullets — small round pellet inside a dark ring for visibility.
    // Builder bullets are tan/brown so the player can tell construction shots
    // apart from regular fire.
    for (const b of bullets) {
      const isBuild = b.kind === 'build';
      ctx.fillStyle = isBuild ? '#3a1f00' : '#3a1f00';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 1.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = isBuild ? '#caa070' : '#ffaa10';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 0.9, 0, Math.PI * 2);
      ctx.fill();
    }

    // Blood pixels in flight
    ctx.fillStyle = '#c8121a';
    for (const b of bloods) {
      ctx.fillRect(Math.floor(b.x), Math.floor(b.y), 1, 1);
    }

    // Rockets — chunky dark body with a flickering flame tail
    for (const r of rockets) {
      const sp = Math.hypot(r.vx, r.vy) || 1;
      const ux = r.vx / sp, uy = r.vy / sp;
      // Two-pixel flame tail
      const t1x = Math.floor(r.x - ux * 3), t1y = Math.floor(r.y - uy * 3);
      const t2x = Math.floor(r.x - ux * 5), t2y = Math.floor(r.y - uy * 5);
      ctx.fillStyle = (Math.random() < 0.5) ? '#ffd040' : '#ff7020';
      ctx.fillRect(t1x, t1y, 2, 2);
      ctx.fillStyle = (Math.random() < 0.5) ? '#ff5010' : '#a03000';
      ctx.fillRect(t2x, t2y, 1, 1);
      // Outline + body
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.floor(r.x) - 1, Math.floor(r.y) - 1, 4, 4);
      ctx.fillStyle = '#5a5a5a';
      ctx.fillRect(Math.floor(r.x), Math.floor(r.y), 2, 2);
    }

    // Muzzle flashes (drawn over everything, including sky)
    for (const f of flashes) {
      if (f.explosion) continue;
      const t = f.life / f.maxLife;
      ctx.globalAlpha = t;
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (0.6 + (1 - t) * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Grenades (blink faster as fuse runs out)
    for (const g of grenades) {
      const blink = g.fuse < 30 ? (g.fuse >> 1) & 1 : ((g.fuse >> 3) & 1);
      ctx.fillStyle = blink ? '#ff4444' : '#2a2a2a';
      ctx.fillRect(Math.floor(g.x) - 1, Math.floor(g.y) - 1, 3, 3);
    }

    // Physics balls
    renderPhysBalls();

    // Player
    if (player.dead) {
      // Lying on side: swap width/height, head at facing end
      const lw = player.h, lh = player.w;
      const lx = Math.floor(player.x - lw / 2);
      const ly = Math.floor(player.y - lh);
      const headRight = player.facing > 0;
      // Outline
      ctx.fillStyle = '#1a0a0a';
      ctx.fillRect(lx - 1, ly - 1, lw + 2, lh + 2);
      // Body — duller, slightly stained red so it reads as a corpse
      ctx.fillStyle = '#7a1818';
      ctx.fillRect(lx, ly, lw, lh);
      // Head — pale skin
      ctx.fillStyle = '#e6b894';
      ctx.fillRect(headRight ? lx + lw - 4 : lx, ly, 4, lh);
      // Mouth — a tiny dark line, slack
      ctx.fillStyle = '#3a1010';
      ctx.fillRect(headRight ? lx + lw - 2 : lx + 1, ly + lh - 1, 1, 1);
      // X eye — 2px cross to sell "dead worm"
      ctx.fillStyle = '#000';
      const exC = headRight ? lx + lw - 2 : lx + 1;
      const eyC = ly;
      ctx.fillRect(exC,     eyC,     1, 1);
      ctx.fillRect(exC + 1, eyC + 1, 1, 1);
      ctx.fillRect(exC,     eyC + 1, 0, 0); // placeholder for clarity
      ctx.fillRect(exC + 1, eyC,     1, 1);
      ctx.fillRect(exC,     eyC + 1, 1, 1);
      // Stuck-out tongue pixel near the mouth for added drama
      ctx.fillStyle = '#c83040';
      ctx.fillRect(headRight ? lx + lw : lx - 1, ly + lh - 1, 1, 1);
    } else {
      const crouched = player.jumpCharge > 0;
      const squish = crouched ? 2 : 0;             // body compresses by 2px when crouching
      // Breathing: 1px head bob + 1px shoulder shift on slow alternating cycle.
      // Suppressed while crouching / airborne so it only reads on idle/walk.
      const calm = !crouched && player.onGround;
      const breathCycle = Math.sin(player.breathT * 0.06);  // ~17 frame period each half
      const breathBob = calm && breathCycle > 0.5 ? 1 : 0;  // head dips 1px on exhale
      const shoulderShift = calm && breathCycle < -0.5 ? 1 : 0; // body inhale lift
      // Walk bob: 1px lift at the peak of each stride. Synced to the leg
      // animation (which switches every 4 frames) so the lift only happens
      // briefly mid-step rather than constantly.
      const walking = player.walkPhase > 0 && player.onGround && !crouched;
      const walkBob = walking && (((player.walkPhase >> 2) % 4) === 1) ? -1 : 0;
      const px = Math.floor(player.x - player.w / 2);
      const py = Math.floor(player.y - player.h) + squish + breathBob + walkBob;
      // Outline
      ctx.fillStyle = '#1a0a0a';
      ctx.fillRect(px - 1, py - 1, player.w + 2, 4 + 2);
      // Head
      ctx.fillStyle = '#ffd9b3';
      ctx.fillRect(px, py, player.w, 4);
      // Body (shorter when crouched; leave 3px for legs at the bottom)
      const bodyTop = py + 4 - shoulderShift;
      const bodyBottom = Math.floor(player.y) - 3; // 3 px reserved for legs
      const bodyH = Math.max(1, bodyBottom - bodyTop);
      ctx.fillStyle = '#1a0a0a';
      ctx.fillRect(px - 1, bodyTop - 1, player.w + 2, bodyH + 2);
      ctx.fillStyle = '#cc3030';
      ctx.fillRect(px, bodyTop, player.w, bodyH);
      // Eye
      ctx.fillStyle = '#000';
      ctx.fillRect(px + (player.facing > 0 ? player.w - 2 : 1), py + 1, 1, 1);

      // Legs
      ctx.fillStyle = '#2a2a2a';
      const legY = bodyBottom;
      const baseBottom = Math.floor(player.y);
      const legLeftX  = px + 2;
      const legRightX = px + player.w - 3;
      // Per-column ground probe: scan downward from the leg's top until we
      // find the first solid pixel, so each leg stands on its own surface
      // even on steep slopes. Wide vertical window so adjacent columns
      // (which may differ by several pixels) are still reached.
      function legFootY(col, top) {
        if (!player.onGround) return baseBottom;
        if (col < 0 || col >= WORLD_W) return baseBottom;
        const minY = top + 1;
        const maxY = baseBottom + 4;
        for (let yy = minY; yy <= maxY; yy++) {
          if (yy >= H) return yy;
          if (yy >= 0 && grid[idx(col, yy)] === 1) return yy;
        }
        return baseBottom;
      }
      // Draw a single leg from y=top down to its column's ground (or to baseBottom in air).
      function drawLeg(col, top) {
        const foot = legFootY(col, top);
        const h = Math.max(1, foot - top);
        ctx.fillRect(col, top, 1, h);
      }
      if (crouched) {
        drawLeg(legLeftX,  legY + 1);
        drawLeg(legRightX, legY + 1);
      } else if (!player.onGround) {
        // Mid-air: tucked legs (fixed short stubs, no ground probe)
        ctx.fillRect(legLeftX,  legY + 1, 1, 2);
        ctx.fillRect(legRightX, legY + 1, 1, 2);
      } else if (Math.abs(player.vx) > 0.01) {
        const phase = (player.walkPhase >> 2) & 1; // 0 or 1
        const frontDX = player.facing;
        const backDX  = -player.facing;
        if (phase === 0) {
          drawLeg(legLeftX  + frontDX, legY);
          drawLeg(legRightX + backDX,  legY + 1);
        } else {
          drawLeg(legLeftX  + backDX,  legY + 1);
          drawLeg(legRightX + frontDX, legY);
        }
      } else {
        drawLeg(legLeftX,  legY);
        drawLeg(legRightX, legY);
      }
    }
    // Grenade cook — a little arm holds the grenade up over the shoulder.
    // The hand pose stays held while G is down; on release the grenade flies
    // off so we don't animate a forward flick here.
    if (!player.dead && player.cooking) {
      const t = Math.min(1, player.cookTime / 18); // ease-in over the first ~0.3s
      const back = -player.facing;
      const handX = player.x + back * (0.5 + t * 1.5);
      const handY = (player.y - player.h) - 1 - t * 2;
      // Shoulder anchor (top of body)
      const shX = player.x + back * 0.5;
      const shY = player.y - player.h + 4;
      // Short arm
      ctx.strokeStyle = '#cc3030';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(shX + 0.5, shY + 0.5);
      ctx.lineTo(handX + 0.5, handY + 1.5);
      ctx.stroke();
      // Hand
      ctx.fillStyle = '#ffd9b3';
      ctx.fillRect(Math.floor(handX), Math.floor(handY) + 1, 1, 1);
      // Grenade in the hand
      ctx.fillStyle = '#222';
      ctx.fillRect(Math.floor(handX), Math.floor(handY) - 1, 2, 2);
      // Fuse spark — flickers faster as the fuse runs down
      const flickRate = player.cookTime > GRENADE_FUSE - 30 ? 2 : 6;
      if (((windT / flickRate) | 0) & 1) {
        ctx.fillStyle = '#ffe060';
        ctx.fillRect(Math.floor(handX) + (back > 0 ? -1 : 2), Math.floor(handY) - 1, 1, 1);
      }
      // Countdown number above the held grenade
      const remain = Math.max(0, (GRENADE_FUSE - player.cookTime) / 60);
      ctx.font = '5px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillStyle = '#000';
      ctx.fillText(remain.toFixed(1), Math.floor(handX) + 1, Math.floor(handY) - 2);
      ctx.fillStyle = remain < 0.6 ? '#ff5050' : '#ffffff';
      ctx.fillText(remain.toFixed(1), Math.floor(handX), Math.floor(handY) - 3);
      ctx.textAlign = 'start';
      ctx.textBaseline = 'alphabetic';
    }

    // Countdown over every in-flight grenade
    ctx.font = '5px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    for (const g of grenades) {
      const remain = Math.max(0, g.fuse / 60);
      const tx = Math.floor(g.x), ty = Math.floor(g.y) - 3;
      ctx.fillStyle = '#000';
      ctx.fillText(remain.toFixed(1), tx + 1, ty + 1);
      ctx.fillStyle = remain < 0.6 ? '#ff5050' : '#ffffff';
      ctx.fillText(remain.toFixed(1), tx, ty);
    }
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';

    if (!player.dead && !player.cooking) {
      // Weapon — rotated to aim, shape per weapon
      const gx0 = player.x;
      const gy0 = player.y - player.h / 2;
      const adx = mouseX - gx0, ady = mouseY - gy0;
      const ang = Math.atan2(ady, adx);
      ctx.save();
      ctx.translate(gx0, gy0);
      ctx.rotate(ang);
    // When aiming to the left the sprite is rotated past vertical, which puts
    // grip/mag on top. Flip the local Y so "down" of the weapon stays toward
    // the player's feet regardless of facing.
    if (adx < 0) ctx.scale(1, -1);
    if (weapon === 'pistol') {
      // Short stubby grey pistol — barrel + small grip
      ctx.fillStyle = '#444';
      ctx.fillRect(0, -1, 5, 2);              // barrel
      ctx.fillStyle = '#222';
      ctx.fillRect(1, 0, 2, 3);               // grip stub
    } else if (weapon === 'mg') {
      // Longer barrel, mag underneath
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(0, -1, 9, 2);              // long barrel
      ctx.fillStyle = '#555';
      ctx.fillRect(7, -2, 2, 1);              // front sight
      ctx.fillStyle = '#222';
      ctx.fillRect(2, 1, 3, 3);               // magazine
    } else if (weapon === 'bazooka') {
      // Compact tube with muzzle ring and small handgrip
      ctx.fillStyle = '#3a2a1a';
      ctx.fillRect(-1, -1, 8, 3);             // tube
      ctx.fillStyle = '#5a3a20';
      ctx.fillRect(6, -2, 2, 4);              // muzzle ring
      ctx.fillStyle = '#222';
      ctx.fillRect(1, 2, 2, 2);               // grip
    } else if (weapon === 'laser') {
      // Sleek dark emitter with a glowing red lens at the tip
      ctx.fillStyle = '#1a1a22';
      ctx.fillRect(0, -1, 7, 2);              // emitter body
      ctx.fillStyle = '#5a0010';
      ctx.fillRect(6, -2, 2, 4);              // lens housing
      ctx.fillStyle = '#ff2030';
      ctx.fillRect(7, -1, 1, 2);              // glowing lens
      ctx.fillStyle = '#3a3a4a';
      ctx.fillRect(0, -2, 3, 1);              // top rail
      ctx.fillStyle = '#222';
      ctx.fillRect(2, 1, 2, 3);               // grip
    } else if (weapon === 'builder') {
      // Stubby tan funnel — barrel + wider muzzle
      ctx.fillStyle = '#7a4818';
      ctx.fillRect(0, -1, 5, 2);              // barrel
      ctx.fillStyle = '#caa070';
      ctx.fillRect(5, -2, 2, 4);              // wider muzzle
      ctx.fillStyle = '#222';
      ctx.fillRect(1, 1, 2, 3);               // grip
    } else if (weapon === 'dualmg') {
      // Two stacked barrels, yellow accents, mag underneath
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(0, -2, 9, 1);              // upper barrel
      ctx.fillRect(0,  1, 9, 1);              // lower barrel
      ctx.fillStyle = '#ffd820';
      ctx.fillRect(7, -2, 2, 1);              // upper barrel tip
      ctx.fillRect(7,  1, 2, 1);              // lower barrel tip
      ctx.fillStyle = '#444';
      ctx.fillRect(0, -1, 9, 2);              // receiver between barrels
      ctx.fillStyle = '#222';
      ctx.fillRect(2, 2, 3, 3);               // magazine
    } else if (weapon === 'triplemg') {
      // Three stacked barrels, orange accents
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(0, -3, 9, 1);              // upper barrel
      ctx.fillRect(0,  0, 9, 1);              // middle barrel
      ctx.fillRect(0,  3, 9, 1);              // lower barrel
      ctx.fillStyle = '#ff8020';
      ctx.fillRect(7, -3, 2, 1);              // upper tip
      ctx.fillRect(7,  0, 2, 1);              // middle tip
      ctx.fillRect(7,  3, 2, 1);              // lower tip
      ctx.fillStyle = '#444';
      ctx.fillRect(0, -2, 8, 1);              // upper receiver
      ctx.fillRect(0,  1, 8, 2);              // lower receiver
      ctx.fillStyle = '#222';
      ctx.fillRect(2, 4, 3, 3);               // magazine
    } else if (weapon === 'quadmg') {
      // Four barrels in a square pattern, red accents
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(0, -3, 10, 1);             // top-left barrel
      ctx.fillRect(0, -1, 10, 1);             // top-right barrel
      ctx.fillRect(0,  1, 10, 1);             // bottom-left barrel
      ctx.fillRect(0,  3, 10, 1);             // bottom-right barrel
      ctx.fillStyle = '#ff3030';
      ctx.fillRect(8, -3, 2, 1);
      ctx.fillRect(8, -1, 2, 1);
      ctx.fillRect(8,  1, 2, 1);
      ctx.fillRect(8,  3, 2, 1);
      ctx.fillStyle = '#555';
      ctx.fillRect(0, -2, 8, 1);              // spacer
      ctx.fillRect(0,  0, 8, 1);              // spacer
      ctx.fillRect(0,  2, 8, 1);              // spacer
      ctx.fillStyle = '#222';
      ctx.fillRect(1, 4, 4, 3);               // big magazine
    } else if (weapon === 'bluelaser') {
      // Chunky emitter with glowing blue lens
      ctx.fillStyle = '#1a1a2a';
      ctx.fillRect(0, -2, 9, 4);              // wide emitter body
      ctx.fillStyle = '#0a1040';
      ctx.fillRect(7, -3, 3, 6);              // lens housing
      ctx.fillStyle = '#40a0ff';
      ctx.fillRect(8, -2, 2, 4);              // glowing blue lens
      ctx.fillStyle = '#2060cc';
      ctx.fillRect(9, -1, 1, 2);              // bright core
      ctx.fillStyle = '#3a3a5a';
      ctx.fillRect(0, -3, 4, 1);              // top rail
      ctx.fillStyle = '#222';
      ctx.fillRect(2, 2, 3, 3);               // grip
    }
    ctx.restore();

    // === END WORLD-SPACE RENDERING (back to screen space for HUD) ===
    ctx.restore();

    // Aim reticle — per-weapon style, with dark outline for visibility
    const mx = Math.floor(mouseX - cameraX), my = Math.floor(mouseY);
    ctx.lineWidth = 1;
    if (weapon === 'mg') {
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 5, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 4, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillRect(mx, my, 1, 1);
    } else if (weapon === 'dualmg') {
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 5, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 4, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillRect(mx - 1, my, 1, 1);
      ctx.fillRect(mx + 1, my, 1, 1);
    } else if (weapon === 'bazooka') {
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 7, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,140,50,0.9)';
      ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 6, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#ff8c32';
      ctx.fillRect(mx, my, 1, 1);
    } else if (weapon === 'laser') {
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.moveTo(mx + 0.5, my - 5); ctx.lineTo(mx + 5, my + 0.5);
      ctx.lineTo(mx + 0.5, my + 6); ctx.lineTo(mx - 4, my + 0.5);
      ctx.closePath(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,32,48,0.9)';
      ctx.beginPath();
      ctx.moveTo(mx + 0.5, my - 4); ctx.lineTo(mx + 4, my + 0.5);
      ctx.lineTo(mx + 0.5, my + 5); ctx.lineTo(mx - 3, my + 0.5);
      ctx.closePath(); ctx.stroke();
    } else if (weapon === 'builder') {
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.strokeRect(mx - 3, my - 3, 7, 7);
      ctx.strokeStyle = 'rgba(202,160,112,0.9)';
      ctx.strokeRect(mx - 2, my - 2, 5, 5);
    } else if (weapon === 'triplemg') {
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 6, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,128,32,0.9)';
      ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 5, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#ff8020';
      ctx.fillRect(mx - 1, my, 1, 1);
      ctx.fillRect(mx, my, 1, 1);
      ctx.fillRect(mx + 1, my, 1, 1);
    } else if (weapon === 'quadmg') {
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 7, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,48,48,0.9)';
      ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 6, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#ff3030';
      ctx.fillRect(mx - 1, my - 1, 1, 1);
      ctx.fillRect(mx + 1, my - 1, 1, 1);
      ctx.fillRect(mx - 1, my + 1, 1, 1);
      ctx.fillRect(mx + 1, my + 1, 1, 1);
    } else if (weapon === 'bluelaser') {
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 8, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(64,160,255,0.9)';
      ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 7, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(64,160,255,0.6)';
      ctx.beginPath(); ctx.arc(mx + 0.5, my + 0.5, 4, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#80d0ff';
      ctx.fillRect(mx, my, 1, 1);
    }
    }
    else {
      // === END WORLD-SPACE RENDERING (back to screen space for HUD) ===
      ctx.restore();
    }

    // Builder energy meter — only while BUILDER is equipped.
    if (weapon === 'builder' && !player.dead) {
      const mW = 80, mH = 4;
      const mx = Math.floor((W - mW) / 2);
      const my = H - 38;
      const frac = builderEnergy / BUILDER_MAX_MS;
      ctx.fillStyle = '#000';
      ctx.fillRect(mx - 1, my - 1, mW + 2, mH + 2);
      ctx.fillStyle = builderLocked ? '#7a4818'
                     : frac < 0.2    ? '#a04040'
                                     : '#caa070';
      ctx.fillRect(mx, my, Math.round(mW * frac), mH);
      ctx.font = '7px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillStyle = '#000';
      ctx.fillText('BUILD', W / 2 + 1, my);
      ctx.fillStyle = '#ffe0b0';
      ctx.fillText('BUILD', W / 2, my - 1);
      ctx.textAlign = 'start';
      ctx.textBaseline = 'alphabetic';
    }

    // Slow-mo screen filter — green sci-fi HUD when guiding a rocket, blue otherwise
    if (slowmoActive()) {
      const guiding = guidedRocket !== null;
      if (guiding) {
        // Green sci-fi tint
        ctx.fillStyle = 'rgba(20,180,40,0.12)';
        ctx.fillRect(0, 0, W, H);
        const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
        vg.addColorStop(0, 'rgba(0,40,0,0)');
        vg.addColorStop(1, 'rgba(0,40,0,0.5)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);

        // Flashing alpha for all targeting boxes (fast pulse)
        const flashAlpha = 0.4 + 0.6 * Math.sin(windT * 0.5);

        // Boxes are placed at world coords; shift into screen space.
        ctx.save();
        ctx.translate(-cameraX, 0);

        // Helper: draw a box made of 4 separate lines with gaps at the corners
        function drawTargetBox(cx, cy, hw, hh, gap) {
          // Top edge (inset from corners by gap)
          ctx.beginPath();
          ctx.moveTo(cx - hw + gap, cy - hh);
          ctx.lineTo(cx + hw - gap, cy - hh);
          ctx.stroke();
          // Bottom edge
          ctx.beginPath();
          ctx.moveTo(cx - hw + gap, cy + hh);
          ctx.lineTo(cx + hw - gap, cy + hh);
          ctx.stroke();
          // Left edge
          ctx.beginPath();
          ctx.moveTo(cx - hw, cy - hh + gap);
          ctx.lineTo(cx - hw, cy + hh - gap);
          ctx.stroke();
          // Right edge
          ctx.beginPath();
          ctx.moveTo(cx + hw, cy - hh + gap);
          ctx.lineTo(cx + hw, cy + hh - gap);
          ctx.stroke();
        }

        // Red box centred on the guided rocket
        ctx.globalAlpha = flashAlpha;
        ctx.strokeStyle = '#ff2020';
        ctx.lineWidth = 1;
        drawTargetBox(guidedRocket.x, guidedRocket.y, 7, 7, 3);
        ctx.globalAlpha = 1;

        // Yellow boxes around enemy laser bolts
        for (const L of lasers) {
          ctx.globalAlpha = flashAlpha;
          ctx.strokeStyle = '#ffe030';
          ctx.lineWidth = 1;
          drawTargetBox(L.x, L.y, 4, 4, 2);
          ctx.globalAlpha = 1;
        }

        // White targeting boxes around UFOs with distance readout
        ctx.font = '5px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        for (const u of ufos) {
          if (u.state === 'falling') continue;
          const hw = (UFO_W + 4) / 2, hh = (UFO_H + 4) / 2;
          ctx.globalAlpha = flashAlpha;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1;
          drawTargetBox(u.x, u.y, hw, hh, 3);
          ctx.globalAlpha = 1;
          // Distance from rocket to this UFO
          const dist = Math.floor(Math.hypot(u.x - guidedRocket.x, u.y - guidedRocket.y));
          const tx = Math.floor(u.x);
          const ty = Math.floor(u.y + hh) + 2;
          ctx.fillStyle = '#000';
          ctx.fillText(dist + 'm', tx + 1, ty + 1);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(dist + 'm', tx, ty);
        }
        ctx.textAlign = 'start';
        ctx.textBaseline = 'alphabetic';
        ctx.restore(); // end world-space transform for targeting boxes
      } else {
        // Standard blue slow-mo filter
        ctx.fillStyle = 'rgba(80,140,220,0.18)';
        ctx.fillRect(0, 0, W, H);
        const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
        vg.addColorStop(0, 'rgba(0,0,40,0)');
        vg.addColorStop(1, 'rgba(0,0,40,0.45)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
      }
    }

    // Bullet-time meter — bottom-centre. Only visible when charging or when
    // slow-mo is on; fades away when fully charged and idle.
    {
      const mW = 80, mH = 4;
      const mx = Math.floor((W - mW) / 2);
      const my = H - 24;
      const frac = slowmoEnergy / SLOWMO_MAX_MS;
      const needed = slowmoActive() || frac < 0.999;
      if (needed) slowmoBarAlpha = 1;
      else        slowmoBarAlpha = Math.max(0, slowmoBarAlpha - 0.04);
      if (slowmoBarAlpha > 0.01) {
        ctx.globalAlpha = slowmoBarAlpha;
        ctx.fillStyle = '#000';
        ctx.fillRect(mx - 1, my - 1, mW + 2, mH + 2);
        ctx.fillStyle = slowmoActive() ? '#60c0ff'
                       : frac < 0.2     ? '#a04040'
                                         : '#3070a0';
        ctx.fillRect(mx, my, Math.round(mW * frac), mH);
        ctx.font = '7px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = '#000';
        ctx.fillText('SLO MO', W / 2 + 1, my);
        ctx.fillStyle = '#cfe8ff';
        ctx.fillText('SLO MO', W / 2, my - 1);
        ctx.textAlign = 'start';
        ctx.textBaseline = 'alphabetic';
        ctx.globalAlpha = 1;
      }
    }

    // Weapon-name flash near the bottom — appears for ~1.5s on switch and
    // fades out over the last ~0.3s of that.
    if (weaponLabelTime > 0 && weaponLabelText) {
      const alpha = Math.min(1, weaponLabelTime / 20);
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.font = 'bold 14px monospace';
      ctx.fillStyle = '#000';
      ctx.fillText(weaponLabelText, W / 2 + 1, H - 11);
      ctx.fillStyle = '#ffe060';
      ctx.fillText(weaponLabelText, W / 2, H - 12);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'start';
      ctx.textBaseline = 'alphabetic';
    }

    // Red damage flash — vignette-style overlay that fades fast.
    if (playerHitFlash > 0.01) {
      ctx.globalAlpha = Math.min(0.6, playerHitFlash);
      const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.15, W / 2, H / 2, H * 0.8);
      vg.addColorStop(0, 'rgba(180,0,0,0.0)');
      vg.addColorStop(1, 'rgba(180,0,0,1.0)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    // Intro title — big bold "TRY 'N' SURVIVE" that fades out over the last
    // ~1s of the intro timer.
    // Wave banner — large title that fades over the last ~0.5s of its life.
    if (waveBannerTime > 0 && introTimer <= 0) {
      const alpha = Math.min(1, waveBannerTime / 30);
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 22px monospace';
      ctx.fillStyle = '#000';
      ctx.fillText(waveBannerText, W / 2 + 2, H / 2 + 2);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(waveBannerText, W / 2, H / 2);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'start';
      ctx.textBaseline = 'alphabetic';
    }

    // Active weapon HUD — top-left icon + name
    if (!player.dead) {
      const hx = 10, hy = 10;
      ctx.save();
      ctx.translate(hx + 2, hy + 2);
      if (weapon === 'mg') {
        ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0, -1, 9, 2);
        ctx.fillStyle = '#555';    ctx.fillRect(7, -2, 2, 1);
        ctx.fillStyle = '#222';    ctx.fillRect(2, 1, 3, 3);
      } else if (weapon === 'bazooka') {
        ctx.fillStyle = '#3a2a1a'; ctx.fillRect(-1, -1, 8, 3);
        ctx.fillStyle = '#5a3a20'; ctx.fillRect(6, -2, 2, 4);
        ctx.fillStyle = '#222';    ctx.fillRect(1, 2, 2, 2);
      } else if (weapon === 'dualmg') {
        ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0, -2, 9, 1); ctx.fillRect(0, 1, 9, 1);
        ctx.fillStyle = '#ffd820'; ctx.fillRect(7, -2, 2, 1); ctx.fillRect(7, 1, 2, 1);
        ctx.fillStyle = '#444';    ctx.fillRect(0, -1, 9, 2);
        ctx.fillStyle = '#222';    ctx.fillRect(2, 2, 3, 3);
      } else if (weapon === 'builder') {
        ctx.fillStyle = '#7a4818'; ctx.fillRect(0, -1, 5, 2);
        ctx.fillStyle = '#caa070'; ctx.fillRect(5, -2, 2, 4);
        ctx.fillStyle = '#222';    ctx.fillRect(1, 1, 2, 3);
      } else if (weapon === 'laser') {
        ctx.fillStyle = '#1a1a22'; ctx.fillRect(0, -1, 7, 2);
        ctx.fillStyle = '#5a0010'; ctx.fillRect(6, -2, 2, 4);
        ctx.fillStyle = '#ff2030'; ctx.fillRect(7, -1, 1, 2);
        ctx.fillStyle = '#3a3a4a'; ctx.fillRect(0, -2, 3, 1);
        ctx.fillStyle = '#222';    ctx.fillRect(2, 1, 2, 3);
      } else if (weapon === 'triplemg') {
        ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0, -3, 9, 1); ctx.fillRect(0, 0, 9, 1); ctx.fillRect(0, 3, 9, 1);
        ctx.fillStyle = '#ff8020'; ctx.fillRect(7, -3, 2, 1); ctx.fillRect(7, 0, 2, 1); ctx.fillRect(7, 3, 2, 1);
        ctx.fillStyle = '#222';    ctx.fillRect(2, 4, 3, 2);
      } else if (weapon === 'quadmg') {
        ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0, -3, 10, 1); ctx.fillRect(0, -1, 10, 1); ctx.fillRect(0, 1, 10, 1); ctx.fillRect(0, 3, 10, 1);
        ctx.fillStyle = '#ff3030'; ctx.fillRect(8, -3, 2, 1); ctx.fillRect(8, -1, 2, 1); ctx.fillRect(8, 1, 2, 1); ctx.fillRect(8, 3, 2, 1);
        ctx.fillStyle = '#222';    ctx.fillRect(1, 4, 4, 2);
      } else if (weapon === 'bluelaser') {
        ctx.fillStyle = '#1a1a2a'; ctx.fillRect(0, -2, 9, 4);
        ctx.fillStyle = '#0a1040'; ctx.fillRect(7, -3, 3, 6);
        ctx.fillStyle = '#40a0ff'; ctx.fillRect(8, -2, 2, 4);
        ctx.fillStyle = '#222';    ctx.fillRect(2, 2, 3, 2);
      }
      ctx.restore();
      ctx.font = '5px monospace';
      ctx.fillStyle = '#000';
      ctx.fillText(WEAPONS[weapon].name, hx + 15, hy + 5);
      ctx.fillStyle = '#fff';
      ctx.fillText(WEAPONS[weapon].name, hx + 14, hy + 4);
    }

    if (introTimer > 0 && !paused) {
      const alpha = Math.min(1, introTimer / 60);
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 26px monospace';
      ctx.fillStyle = '#000';
      ctx.fillText("TRY 'N' SURVIVE", W / 2 + 2, H / 2 + 2);
      ctx.fillStyle = '#ffe060';
      ctx.fillText("TRY 'N' SURVIVE", W / 2, H / 2);
      ctx.font = '8px monospace';
      ctx.fillStyle = '#000';
      ctx.fillText('© 2005', W / 2 + 2, H / 2 + 24);
      ctx.fillStyle = '#fff';
      ctx.fillText('© 2005', W / 2, H / 2 + 22);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'start';
      ctx.textBaseline = 'alphabetic';
    }

    // Game-over overlay — title + stat lines + reload hint, centred as a block.
    if (player.dead) {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const stats = [
        'Survived: ' + survivedString(),
        'Hits: ' + hits,
        'Score: ' + currentScore(),
      ];
      const titleH = 32, gapAfterTitle = 16, statH = 12, gapAfterStats = 14, hintH = 10;
      const blockH = titleH + gapAfterTitle + stats.length * statH + gapAfterStats + hintH;
      let y = H / 2 - blockH / 2 + titleH / 2;
      ctx.font = 'bold 32px monospace';
      ctx.fillStyle = '#000';
      ctx.fillText('GAME OVER', W / 2 + 1, y + 1);
      ctx.fillStyle = '#ff3030';
      ctx.fillText('GAME OVER', W / 2, y);
      y += titleH / 2 + gapAfterTitle;
      ctx.font = '10px monospace';
      stats.forEach(line => {
        ctx.fillStyle = '#000';
        ctx.fillText(line, W / 2 + 1, y + 1);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(line, W / 2, y);
        y += statH;
      });
      y += gapAfterStats - statH;
      ctx.fillStyle = '#000';
      ctx.fillText('Press R to reload', W / 2 + 1, y + 1);
      ctx.fillStyle = '#ffe060';
      ctx.fillText('Press R to reload', W / 2, y);
      ctx.textAlign = 'start';
      ctx.textBaseline = 'alphabetic';
    }

    // HP bar above player
    if (!player.dead) {
      const hpW = 16;
      const hpx = Math.floor(player.x - hpW / 2 - cameraX);
      const hpy = Math.floor(player.y - player.h) - 4;
      ctx.fillStyle = '#000';
      ctx.fillRect(hpx - 1, hpy - 1, hpW + 2, 3);
      ctx.fillStyle = player.hp > 50 ? '#3ad14a' : player.hp > 20 ? '#e0c020' : '#d03030';
      ctx.fillRect(hpx, hpy, Math.round((player.hp / MAX_HP) * hpW), 1);

      // Reload bar — appears above the HP bar while the active weapon is on
      // cooldown. Blue fill that grows from empty back to full.
      const wpnDef = WEAPONS[weapon];
      const reloadTotal = burstLocked ? (wpnDef.burstCooldown || wpnDef.interval) : wpnDef.interval;
      if (fireCooldown > 0 && reloadTotal > 0) {
        const filled = Math.max(0, Math.min(1, 1 - fireCooldown / reloadTotal));
        ctx.fillStyle = '#000';
        ctx.fillRect(hpx - 1, hpy - 6, hpW + 2, 3);
        ctx.fillStyle = '#3ab0ff';
        ctx.fillRect(hpx, hpy - 5, Math.round(filled * hpW), 1);
      }
    }

    // Pause overlay — block of "PAUSED" + hint centred around the middle.
    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const blockH = 28 + 8 + 10;
      const titleY = H / 2 - blockH / 2 + 14;
      const hintY  = titleY + 28;
      ctx.font = 'bold 28px monospace';
      ctx.fillStyle = '#000';
      ctx.fillText('PAUSED', W / 2 + 2, titleY + 2);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('PAUSED', W / 2, titleY);
      ctx.font = '10px monospace';
      ctx.fillStyle = '#000';
      ctx.fillText('Press P to resume', W / 2 + 1, hintY + 1);
      ctx.fillStyle = '#cfe8ff';
      ctx.fillText('Press P to resume', W / 2, hintY);
      ctx.textAlign = 'start';
      ctx.textBaseline = 'alphabetic';
    }
  }

  // Weapons
  const WEAPONS = {
    mg:      { name: 'MG',      fire: fireBullet, interval: 5,  auto: true  },
    bazooka: { name: 'BAZOOKA', fire: fireRocket, interval: 55, auto: false },
    dualmg:  { name: 'DUAL MG', fire: fireDualBullet, interval: 6,  auto: true  },
    builder: { name: 'BUILDER', fire: fireBuildBullet, interval: 6, auto: true  },
    laser:   { name: 'LASER',   fire: firePlayerLaser, interval: 150, auto: false },
    triplemg:  { name: 'TRIPLE MG',  fire: fireTripleBullet, interval: 5, auto: true },
    quadmg:    { name: 'QUAD MG',    fire: fireQuadBullet, interval: 4, auto: true },
    bluelaser: { name: 'BLUE LASER', fire: fireBlueLaser, interval: 3, auto: true, burstMax: 60, burstCooldown: 240 },
  };
  const DEBUG = new URLSearchParams(location.search).get('debug') === 'true';
  let weaponOrder = DEBUG ? ['mg', 'bazooka', 'dualmg', 'builder', 'laser', 'triplemg', 'quadmg', 'bluelaser'] : ['mg'];
  let unlockedWeapons = DEBUG ? new Set(['mg', 'bazooka', 'dualmg', 'builder', 'laser', 'triplemg', 'quadmg', 'bluelaser']) : new Set(['mg']);
  let weapon = 'mg';
  let weaponLabelTime = 0; // ticks remaining for the on-screen weapon name
  let weaponLabelText = '';
  function switchWeapon(name) {
    if (!WEAPONS[name] || weapon === name || !unlockedWeapons.has(name)) return;
    // Save current weapon's cooldown
    weaponCooldowns[weapon] = fireCooldown;
    weapon = name;
    // Restore the new weapon's cooldown (0 if never set)
    fireCooldown = weaponCooldowns[name] || 0;
    weaponLabelText = WEAPONS[name].name;
    weaponLabelTime = 90; // ~1.5s visible before fading
    updateWeaponHud();
  }
  function flashWeaponPickup(name) {
    weaponLabelText = 'PICKED UP ' + WEAPONS[name].name.toUpperCase();
    weaponLabelTime = 120;
  }
  function cycleWeapon(dir) {
    const order = weaponOrder;
    const i = order.indexOf(weapon);
    const next = order[(i + dir + order.length) % order.length];
    switchWeapon(next);
  }

  // Input
  const keys = Object.create(null);
  // Jump input buffer: frames remaining where a queued jump is still valid.
  // Lets you press jump slightly before/after leaving the ground while walking
  // over uneven terrain (a brief step-up can put you off-ground for a tick).
  let jumpQueued = 0;
  const JUMP_BUFFER = 8;
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const wasDown = keys[k];
    // P toggles pause. Everything else is suppressed while paused, so a held
    // key from before the pause doesn't keep moving the player on resume.
    if (!wasDown && k === 'p' && !player.dead) { paused = !paused; keys[k] = true; return; }
    if (paused) { if (e.key === ' ') e.preventDefault(); return; }
    if (!wasDown && k === 'q' && !player.dead) cycleWeapon(1);
    if (!wasDown && !player.dead && (k === ' ' || k === 'w' || k === 'arrowup')) jumpQueued = JUMP_BUFFER;
    // Double-tap A/D (or arrows) for a quick dash. Records the moment each
    // direction key was pressed; a second press inside DASH_WINDOW_MS while
    // dash is off cooldown applies an impulse.
    if (!wasDown && !player.dead && dashCooldown === 0) {
      const now = Date.now();
      if (k === 'a' || k === 'arrowleft') {
        if (now - lastTapLeft < DASH_WINDOW_MS) {
          player.vx = -DASH_IMPULSE;
          dashCooldown = DASH_COOLDOWN;
        }
        lastTapLeft = now;
      } else if (k === 'd' || k === 'arrowright') {
        if (now - lastTapRight < DASH_WINDOW_MS) {
          player.vx = DASH_IMPULSE;
          dashCooldown = DASH_COOLDOWN;
        }
        lastTapRight = now;
      }
    }
    if (!wasDown && !player.dead && k === 'e' && !player.cooking) {
      player.cooking = true;
      player.cookTime = 0;
    }
    // Debug number-key shortcuts (only when ?debug=true). Otherwise weapons
    // are cycled exclusively with the mouse wheel.
    if (DEBUG && !wasDown && k === '1') { if (!unlockedWeapons.has('builder')) { unlockedWeapons.add('builder'); weaponOrder.push('builder'); } switchWeapon('builder'); }
    if (DEBUG && !wasDown && k === '2') { if (!unlockedWeapons.has('laser'))   { unlockedWeapons.add('laser');   weaponOrder.push('laser'); }   switchWeapon('laser'); }
    keys[k] = true;
    if (k === 'r' && player.dead) {
      const caves = generateTerrain();
      spawnTrees(); spawnBushesAndGrass();
      resetWaves();
      lasers.length = 0;
      packs.length = 0;
      spawnCavePacks(caves);
      gameStartMs = Date.now();
      finalElapsedMs = null;
      hits = 0;
      slowmoEnergy = SLOWMO_MAX_MS;
      builderEnergy = BUILDER_MAX_MS;
      builderLocked = false;
      playerHitFlash = 0;
      introTimer = 240;
      waveBannerTime = 0;
      hitStopFrames = 0;
      dashCooldown = 0;
      lastTapLeft = lastTapRight = 0;
      killCount = 0;
      nextDropIndex = 0;
      weaponOrder = DEBUG ? ['mg', 'bazooka', 'dualmg', 'builder', 'laser', 'triplemg', 'quadmg', 'bluelaser'] : ['mg'];
      unlockedWeapons = DEBUG ? new Set(['mg', 'bazooka', 'dualmg', 'builder', 'laser', 'triplemg', 'quadmg', 'bluelaser']) : new Set(['mg']);
      if (!unlockedWeapons.has(weapon)) { weapon = 'mg'; updateWeaponHud(); }
      player.hp = MAX_HP;
      player.dead = false;
      player.deathTimer = 0;
      player.x = W / 2; player.y = 20; player.vx = 0; player.vy = 0;
    }
    if (e.key === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    keys[k] = false;
    if (k === 'e' && player.cooking) releaseCook();
  });
  function releaseCook() {
    if (!player.cooking) return;
    const remaining = Math.max(1, GRENADE_FUSE - player.cookTime);
    // Power scales with cook time so longer holds throw further.
    const power = 1.8 + Math.min(1, player.cookTime / GRENADE_FUSE) * 3.0;
    throwGrenade(power, remaining);
    player.cooking = false;
    player.cookTime = 0;
  }

  let mouseX = 0, mouseY = 0;       // world-space coordinates of the cursor
  let mouseScreenX = 0;              // screen-space x for the reticle drawing
  function setMouseFromEvent(e) {
    if (paused) return;
    const rect = canvas.getBoundingClientRect();
    mouseScreenX = Math.floor((e.clientX - rect.left) * (W / rect.width));
    mouseX = mouseScreenX + cameraX;
    mouseY = Math.floor((e.clientY - rect.top)  * (H / rect.height));
  }
  window.addEventListener('mousemove', setMouseFromEvent);
  window.addEventListener('wheel', e => {
    if (player.dead || paused) return;
    cycleWeapon(e.deltaY > 0 ? 1 : -1);
    e.preventDefault();
  }, { passive: false });
  let firingHeld = false;
  let fireCooldown = 0;
  let burstCounter = 0;        // ticks fired in current burst
  let burstLocked = false;     // true = burst exhausted, waiting for cooldown
  let burstCooldownTimer = 0;  // ticks remaining until burst resets
  const weaponCooldowns = {}; // per-weapon cooldown tracking
  let slowmoHeld = false;
  // Bullet-time meter: 10s of use, 5s to recharge from empty.
  const SLOWMO_MAX_MS = 10000;
  const SLOWMO_RECHARGE_MS = 5000;
  const SLOWMO_RELOCK_FRAC = 0.5; // must recharge to 50% before usable again
  let slowmoEnergy = SLOWMO_MAX_MS;
  let slowmoLastMs = Date.now();
  let slowmoBarAlpha = 0;
  // When the meter hits 0 it locks out and can't be triggered again until it
  // recharges past SLOWMO_RELOCK_FRAC — otherwise the meter just jitters at
  // zero while the button stays held.
  let slowmoLocked = false;
  function slowmoActive() {
    const held = slowmoHeld || keys['shift'];
    return held && !slowmoLocked && slowmoEnergy > 0 && !player.dead && !paused;
  }
  function updateSlowmoEnergy() {
    const now = Date.now();
    const dt = now - slowmoLastMs;
    slowmoLastMs = now;
    // While paused, don't drain or recharge — just freeze the meter.
    if (paused) return;
    if (slowmoActive()) {
      slowmoEnergy = Math.max(0, slowmoEnergy - dt);
      if (slowmoEnergy === 0) slowmoLocked = true;
    } else {
      slowmoEnergy = Math.min(SLOWMO_MAX_MS, slowmoEnergy + dt * (SLOWMO_MAX_MS / SLOWMO_RECHARGE_MS));
      if (slowmoLocked && slowmoEnergy >= SLOWMO_MAX_MS * SLOWMO_RELOCK_FRAC) {
        slowmoLocked = false;
      }
    }
  }
  window.addEventListener('mousedown', e => {
    setMouseFromEvent(e);
    if (paused) return;
    if (e.button === 2) {
      slowmoHeld = true;
    } else if (!player.dead) {
      const w = WEAPONS[weapon];
      if (fireCooldown <= 0) { w.fire(); fireCooldown = w.interval; }
      firingHeld = true;
    }
  });
  window.addEventListener('mouseup', e => {
    if (e.button === 2) slowmoHeld = false;
    else firingHeld = false;
  });
  window.addEventListener('contextmenu', e => e.preventDefault());

  // Bullets
  const bullets = [];
  // Visual flashes: { x, y, r, life, maxLife, color }
  const flashes = [];
  // Screen shake: trauma in [0..1]; shake offset = trauma^2 * SHAKE_MAX
  let shakeTrauma = 0;
  let fireShakeRamp = 0;
  const FIRE_RAMP_TICKS = 120;
  function addShake(amount) { shakeTrauma = Math.min(1, shakeTrauma + amount); }
  function addFireShake(amount) {
    const t = Math.min(1, fireShakeRamp / FIRE_RAMP_TICKS);
    addShake(amount * (0.05 + 0.95 * t));
  }
  function fireBullet() {
    const muzzleX = player.x;
    const muzzleY = player.y - player.h / 2;
    const dx = mouseX - muzzleX;
    const dy = mouseY - muzzleY;
    const len = Math.hypot(dx, dy) || 1;
    const speed = 4.5;
    bullets.push({
      x: muzzleX,
      y: muzzleY,
      vx: (dx / len) * speed,
      vy: (dy / len) * speed,
      life: 120,
    });
    // Muzzle flash at the gun tip
    flashes.push({
      x: muzzleX + (dx / len) * 7,
      y: muzzleY + (dy / len) * 7,
      r: 3, maxLife: 4, life: 4,
      color: '#ffe066',
    });
    addFireShake(0.75);
    player.facing = dx >= 0 ? 1 : -1;
  }

  // Paint a disc of terrain — but only pixels that end up connected (directly
  // or transitively) to existing terrain inside the disc, so the placed dirt
  // is always anchored to something solid.
  function fillCircle(cx, cy, r) {
    const r2 = r * r;
    const x0 = Math.max(0, Math.floor(cx - r));
    const x1 = Math.min(WORLD_W - 1, Math.ceil(cx + r));
    const y0 = Math.max(0, Math.floor(cy - r));
    const y1 = Math.min(H - 1, Math.ceil(cy + r));
    // Exclude pixels overlapping the player so building near yourself can't
    // entomb you. Inflate the box by 1px for breathing room.
    const pad = 1;
    const pxL = Math.floor(player.x - player.w / 2) - pad;
    const pxR = Math.floor(player.x + player.w / 2) + pad;
    const pyT = Math.floor(player.y - player.h) - pad;
    const pyB = Math.floor(player.y) + pad;
    const candidates = [];
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy > r2) continue;
        if (grid[idx(x, y)] !== 0) continue;
        if (!player.dead && x >= pxL && x <= pxR && y >= pyT && y <= pyB) continue;
        candidates.push(x, y);
      }
    }
    let changed = true;
    while (changed) {
      changed = false;
      for (let k = candidates.length - 2; k >= 0; k -= 2) {
        const x = candidates[k], y = candidates[k + 1];
        if (grid[idx(x, y)] === 1) continue;
        if ((x > 0     && grid[idx(x - 1, y)] === 1) ||
            (x < WORLD_W - 1 && grid[idx(x + 1, y)] === 1) ||
            (y > 0     && grid[idx(x, y - 1)] === 1) ||
            (y < H - 1 && grid[idx(x, y + 1)] === 1)) {
          grid[idx(x, y)] = 1;
          changed = true;
        }
      }
    }
    terrainDirty = true;
  }

  // Player laser beam: visible for a few frames so the player sees the cut.
  const playerBeams = [];
  // UFO debris halves — created when the laser bisects a ship
  const ufoDebris = [];

  function bisectUfo(u, beamX, beamY, beamUx, beamUy) {
    // Remove the UFO from the active list
    const idx2 = ufos.indexOf(u);
    if (idx2 !== -1) ufos.splice(idx2, 1);
    // Trigger death explosion for nearby ships
    ufoDeathExplosion(u);
    killCount++;
    hits++;
    hitStopFrames = Math.max(hitStopFrames, 3);
    if (!DEBUG && nextDropIndex < WEAPON_DROPS.length && killCount >= WEAPON_DROPS[nextDropIndex].kill) {
      spawnPack(u.x + (Math.random() - 0.5) * 20, WEAPON_DROPS[nextDropIndex].kind);
      nextDropIndex++;
    }
    // Determine cut position relative to UFO center (local X offset)
    const cutLocalX = beamX - u.x;
    // Perpendicular to beam direction for the shunt
    const perpX = -beamUy;
    const perpY = beamUx;
    // Create two halves: left and right of the cut line
    const leftW = Math.max(2, Math.floor(UFO_W / 2 + cutLocalX));
    const rightW = Math.max(2, UFO_W - leftW);
    // Left half
    ufoDebris.push({
      x: u.x - (UFO_W / 2 - leftW / 2),
      y: u.y,
      vx: -0.8 - Math.random() * 0.5 + perpX * 0.5,
      vy: -0.5 - Math.random() * 0.8,
      rot: 0,
      rotSpeed: -0.04 - Math.random() * 0.06,
      side: 'left',
      clipW: leftW,
      fullW: UFO_W,
      life: 300,
    });
    // Right half
    ufoDebris.push({
      x: u.x + (UFO_W / 2 - rightW / 2),
      y: u.y,
      vx: 0.8 + Math.random() * 0.5 - perpX * 0.5,
      vy: -0.5 - Math.random() * 0.8,
      rot: 0,
      rotSpeed: 0.04 + Math.random() * 0.06,
      side: 'right',
      clipW: rightW,
      fullW: UFO_W,
      life: 300,
    });
    // Sparks at the cut point
    for (let k = 0; k < 12; k++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 2.5;
      flashes.push({
        x: beamX + (Math.random() - 0.5) * 4,
        y: u.y + (Math.random() - 0.5) * 6,
        r: 1 + Math.random() * 1.5,
        maxLife: 8 + (Math.random() * 8) | 0,
        life: 8 + (Math.random() * 8) | 0,
        color: Math.random() < 0.5 ? '#ffe060' : '#ff8030',
      });
    }
    // Health pack drop chance
    if (Math.random() < 0.6) spawnPack(u.x + (Math.random() - 0.5) * 40);
  }

  function updateUfoDebris() {
    for (let i = ufoDebris.length - 1; i >= 0; i--) {
      const d = ufoDebris[i];
      d.vy += 0.12;
      if (d.vy > 3) d.vy = 3;
      d.x += d.vx;
      d.y += d.vy;
      d.rot += d.rotSpeed;
      d.life--;
      // Hit terrain or floor — small explosion and remove
      const gx = Math.floor(d.x), gy = Math.floor(d.y + UFO_H / 2);
      let hitGround = gy >= H;
      if (!hitGround && gy >= 0 && gx >= 0 && gx < WORLD_W) {
        if (grid[idx(gx, gy)] === 1) hitGround = true;
      }
      if (hitGround || d.life <= 0 || d.x < -30 || d.x > WORLD_W + 30) {
        if (hitGround) {
          // Small impact explosion
          explode(d.x, Math.min(H - 1, d.y + UFO_H / 2), 10, 30, 25, 0.4);
        }
        ufoDebris.splice(i, 1);
        continue;
      }
      // Smoke trail
      if (Math.random() < 0.4) {
        flashes.push({
          x: d.x + (Math.random() - 0.5) * 6,
          y: d.y + (Math.random() - 0.5) * 4,
          r: 1.5 + Math.random(),
          maxLife: 14, life: 14,
          color: 'rgba(40,40,40,0.5)',
        });
      }
    }
  }

  function renderUfoDebris() {
    for (const d of ufoDebris) {
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot);
      // Clip to show only the left or right portion of the saucer shape
      ctx.beginPath();
      if (d.side === 'left') {
        ctx.rect(-d.fullW / 2, -UFO_H, d.clipW, UFO_H * 2);
      } else {
        ctx.rect(d.fullW / 2 - d.clipW, -UFO_H, d.clipW, UFO_H * 2);
      }
      ctx.clip();
      // Draw the saucer shape (same as renderUfos but centered at 0,0)
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.ellipse(0, 2, d.fullW / 2, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3a3a3a';
      ctx.fillRect(Math.floor(-d.fullW / 2 + 1), 1, d.fullW - 2, 1);
      ctx.fillStyle = '#1d3a55';
      ctx.beginPath();
      ctx.arc(0, 1, 5, Math.PI, 0);
      ctx.fill();
      // Exposed interior edge — orange glow to sell the cut
      ctx.fillStyle = '#ff6020';
      if (d.side === 'left') {
        ctx.fillRect(d.clipW - d.fullW / 2 - 1, -4, 2, 8);
      } else {
        ctx.fillRect(d.fullW / 2 - d.clipW - 1, -4, 2, 8);
      }
      ctx.restore();
    }
  }

  function firePlayerLaser() {
    const x0 = player.x, y0 = player.y - player.h / 2;
    const dx = mouseX - x0, dy = mouseY - y0;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    // Step 1px at a time across the canvas, carving terrain and hitting UFOs.
    const MAX_STEPS = Math.ceil(Math.hypot(W, H));
    let endX = x0, endY = y0;
    const bisectedThisFire = new Set(); // avoid double-bisecting same UFO
    for (let s = 1; s <= MAX_STEPS; s++) {
      const px = x0 + ux * s;
      const py = y0 + uy * s;
      if (px < 0 || px >= WORLD_W || py >= H || py < -20) { endX = px; endY = py; break; }
      endX = px; endY = py;
      // Bisect UFOs the beam crosses (dismemberment)
      const u = ufoAt(px, py);
      if (u && !bisectedThisFire.has(u)) {
        bisectedThisFire.add(u);
        bisectUfo(u, px, py, ux, uy);
      }
      // Carve terrain along the beam
      if (py >= 0) {
        const gx = Math.floor(px), gy = Math.floor(py);
        if (gx >= 0 && gx < WORLD_W && grid[idx(gx, gy)] === 1) {
          carveCircle(gx, gy, 7, false);
        }
      }
    }
    detachFloatingChunks();
    playerBeams.push({ x0, y0, x1: endX, y1: endY, life: 14, maxLife: 14 });
    addFireShake(1.0);
    player.facing = dx >= 0 ? 1 : -1;
  }

  // Blocky brush — paints a (2*half+1)x(2*half+1) square of dirt anchored to
  // existing terrain. The wide square edge gives the new chunk a solid bite
  // into the surface so it doesn't dangle as a thin appendage.
  function fillBlock(cx, cy, half) {
    const x0 = Math.max(0, Math.floor(cx - half));
    const x1 = Math.min(WORLD_W - 1, Math.floor(cx + half));
    const y0 = Math.max(0, Math.floor(cy - half));
    const y1 = Math.min(H - 1, Math.floor(cy + half));
    const pad = 1;
    const pxL = Math.floor(player.x - player.w / 2) - pad;
    const pxR = Math.floor(player.x + player.w / 2) + pad;
    const pyT = Math.floor(player.y - player.h) - pad;
    const pyB = Math.floor(player.y) + pad;
    const candidates = [];
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (grid[idx(x, y)] !== 0) continue;
        if (!player.dead && x >= pxL && x <= pxR && y >= pyT && y <= pyB) continue;
        candidates.push(x, y);
      }
    }
    // Iteratively claim cells touching existing solid terrain; anything that
    // never connects is skipped (no floating fragments).
    let changed = true;
    while (changed) {
      changed = false;
      for (let k = candidates.length - 2; k >= 0; k -= 2) {
        const x = candidates[k], y = candidates[k + 1];
        if (grid[idx(x, y)] === 1) continue;
        if ((x > 0     && grid[idx(x - 1, y)] === 1) ||
            (x < WORLD_W - 1 && grid[idx(x + 1, y)] === 1) ||
            (y > 0     && grid[idx(x, y - 1)] === 1) ||
            (y < H - 1 && grid[idx(x, y + 1)] === 1)) {
          grid[idx(x, y)] = 1;
          changed = true;
        }
      }
    }
    terrainDirty = true;
  }

  // Builder energy — drains while firing the builder, recharges otherwise.
  // 2s of use, 4s to fully recharge from empty. Locks out at 0 until the
  // meter refills to 50%.
  const BUILDER_MAX_MS = 3500;
  const BUILDER_RECHARGE_MS = 3500;
  const BUILDER_RELOCK_FRAC = 0.5;
  let builderEnergy = BUILDER_MAX_MS;
  let builderLocked = false;
  let builderLastMs = Date.now();
  function builderHeldNow() {
    return firingHeld && weapon === 'builder' && !player.dead && !paused && !builderLocked;
  }
  function updateBuilderEnergy() {
    const now = Date.now();
    const dt = now - builderLastMs;
    builderLastMs = now;
    if (builderHeldNow() && builderEnergy > 0) {
      builderEnergy = Math.max(0, builderEnergy - dt);
      if (builderEnergy === 0) builderLocked = true;
    } else {
      builderEnergy = Math.min(BUILDER_MAX_MS,
        builderEnergy + dt * (BUILDER_MAX_MS / BUILDER_RECHARGE_MS));
      if (builderLocked && builderEnergy >= BUILDER_MAX_MS * BUILDER_RELOCK_FRAC) {
        builderLocked = false;
      }
    }
  }

  function fireBuildBullet() {
    if (builderLocked || builderEnergy <= 0) return;
    const muzzleX = player.x;
    const muzzleY = player.y - player.h / 2;
    const dx = mouseX - muzzleX;
    const dy = mouseY - muzzleY;
    const len = Math.hypot(dx, dy) || 1;
    // Builder paints a chunky 11x11 square brush anchored to existing terrain.
    fillBlock(mouseX, mouseY, 5);
    flashes.push({ x: mouseX, y: mouseY, r: 3, maxLife: 8, life: 8, color: '#caa070' });
    flashes.push({
      x: muzzleX + (dx / len) * 7,
      y: muzzleY + (dy / len) * 7,
      r: 3, maxLife: 4, life: 4,
      color: '#caa070',
    });
    addFireShake(0.25);
    player.facing = dx >= 0 ? 1 : -1;
  }

  function fireDualBullet() {
    const muzzleX = player.x;
    const muzzleY = player.y - player.h / 2;
    const dx = mouseX - muzzleX;
    const dy = mouseY - muzzleY;
    const len = Math.hypot(dx, dy) || 1;
    const speed = 4.5;
    // Perpendicular offset so the two bullets fly side-by-side, not overlapping.
    const nx = -dy / len, ny = dx / len;
    for (const off of [-1, 1]) {
      bullets.push({
        x: muzzleX + nx * off,
        y: muzzleY + ny * off,
        vx: (dx / len) * speed,
